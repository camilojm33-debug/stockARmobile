{% extends "base_master.html" %}
{% block title %}Nueva oportunidad — CRM{% endblock %}
{% block content %}
{% include 'crm/_nav.html' %}<div class="app-shell"><div class="row justify-content-center"><div class="col-xl-8"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="page-kicker"><i class="bi bi-bullseye"></i> CRM</span><h1 class="h3 fw-bold mb-1">Nueva oportunidad</h1><p class="text-muted mb-0">Registrá una posibilidad comercial sin crear una venta.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('crm.pipeline') }}">Cancelar</a></div><div class="card app-card"><div class="card-body p-4"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-7"><label class="form-label fw-semibold">Título</label><input name="title" class="form-control" placeholder="Ej. Reposición mensual"></div><div class="col-md-5"><label class="form-label fw-semibold">Cliente</label><select name="client_id" class="form-select" required><option value="">Seleccionar...</option>{% for client in clients %}<option value="{{ client.id }}">{{ client.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label fw-semibold">Etapa</label><select name="stage" class="form-select">{% for value,label in stages %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label fw-semibold">Valor estimado</label><input name="value" type="number" min="0" step="0.01" class="form-control" value="0"></div><div class="col-md-4"><label class="form-label fw-semibold">Probabilidad</label><div class="input-group"><input name="probability" type="number" min="0" max="100" step="1" class="form-control" value="0"><span class="input-group-text">%</span></div></div><div class="col-md-6"><label class="form-label fw-semibold">Cierre estimado</label><input name="expected_close_date" type="datetime-local" class="form-control"></div><div class="col-md-6"><label class="form-label fw-semibold">Origen</label><input name="source" class="form-control" placeholder="WhatsApp, mostrador, referido..."></div><div class="col-12"><label class="form-label fw-semibold">Notas</label><textarea name="notes" rows="4" class="form-control" placeholder="Contexto comercial, necesidad, próximos pasos..."></textarea></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('crm.index') }}">Cancelar</a><button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Crear oportunidad</button></div></form></div></div></div></div></div>{% endblock %}
