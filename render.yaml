services:
  - type: web
    name: stockarmobile
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask db upgrade && gunicorn --timeout 120 wsgi:application
    envVars:
      - key: SAAS_MARKETING_SEND_ENABLED
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_SUPERADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MP_MODE
        value: production
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_OAUTH_ENCRYPTION_KEY
        generateValue: true
      - key: MP_OAUTH_REDIRECT_URI
        value: https://www.stockarmobile.com/admin/mercado-pago/callback
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        value: https://www.stockarmobile.com
      - key: LANDING_DEMO_VIDEO_URL
        value: https://www.youtube.com/embed/5qap5aO4i9A
      - key: MP_NOTIFICATION_URL
        value: https://www.stockarmobile.com/admin/webhooks/mercadopago
      - key: MP_SUCCESS_URL
        value: https://www.stockarmobile.com/admin/portal?checkout=success
      - key: MP_PENDING_URL
        value: https://www.stockarmobile.com/admin/portal?checkout=pending
      - key: MP_FAILURE_URL
        value: https://www.stockarmobile.com/admin/portal?checkout=failure
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_INVOICE_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TIMEOUT
        value: "25"
      - key: GOOGLE_GMAIL_CLIENT_ID
        sync: false
      - key: GOOGLE_GMAIL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_GMAIL_REDIRECT_URI
        value: https://www.stockarmobile.com/superadmin/crm/email/gmail/callback
      - key: GMAIL_COMMERCIAL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_COMMERCIAL_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_COMMERCIAL_PUBSUB_AUDIENCE
        value: https://www.stockarmobile.com/superadmin/crm/email/gmail/pubsub
      - key: GMAIL_COMMERCIAL_PUBSUB_SERVICE_ACCOUNT
        sync: false
      - key: GMAIL_COMMERCIAL_MAILBOX
        value: stockarmobile@gmail.com
      - key: BACKUP_AUTOMATION_TOKEN
        sync: false
      - key: BACKUP_VERIFY_COMPANY_ID
        sync: false
      - key: GMAIL_WATCH_AUTOMATION_TOKEN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stockarmobile-db
          property: connectionString

  - type: cron
    name: stockarmobile-commercial-campaigns
    runtime: python
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_saas_campaigns.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockarmobile-db
          property: connectionString
      - key: APP_URL
        value: https://www.stockarmobile.com
      - key: SAAS_MARKETING_SEND_ENABLED
        value: "0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "1"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false


databases:
  - name: stockarmobile-db
    databaseName: stockarmobile
    user: stockarmobile
