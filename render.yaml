services:
  - type: web
    name: stockarmobile
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask db upgrade heads && gunicorn wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_SUPERADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MP_MODE
        value: production
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_OAUTH_ENCRYPTION_KEY
        generateValue: true
      - key: MP_OAUTH_REDIRECT_URI
        value: https://www.stockarmobile.com/admin/mercado-pago/callback
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        value: https://www.stockarmobile.com
      - key: LANDING_DEMO_VIDEO_URL
        value: https://www.youtube.com/embed/5qap5aO4i9A
      - key: MP_NOTIFICATION_URL
        value: https://www.stockarmobile.com/admin/webhooks/mercadopago
      - key: MP_SUCCESS_URL
        value: https://www.stockarmobile.com/admin/portal?checkout=success
      - key: MP_PENDING_URL
        value: https://www.stockarmobile.com/admin/portal?checkout=pending
      - key: MP_FAILURE_URL
        value: https://www.stockarmobile.com/admin/portal?checkout=failure
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_PROVIDER_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_PROVIDER_MODEL
        value: gpt-4.1-mini
      - key: AI_PROVIDER_TIMEOUT
        value: "45"
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AI_AGENT_ENABLED
        value: "true"
      - key: AI_CHANNEL_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stockarmobile-db
          property: connectionString

databases:
  - name: stockarmobile-db
    databaseName: stockarmobile
    user: stockarmobile
