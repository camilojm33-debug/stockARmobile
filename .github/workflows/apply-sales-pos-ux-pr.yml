name: Validate sales POS UX patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply patch if needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('templates/ventas/index.html')
          source = path.read_text(encoding='utf-8-sig')
          marker = 'sales-pos-ux-v2'
          if marker in source:
              print('Patch already present')
              raise SystemExit(0)
          raise SystemExit('Expected additive POS UX patch workflow has not run yet; run the branch workflow first.')
          PY

      - name: Validate
        run: |
          set -euo pipefail
          python -m compileall -q .
          pip install -r requirements.txt
          pytest -q
