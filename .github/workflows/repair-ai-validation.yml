name: Repair AI validation

on:
  push:
    branches:
      - fix/ai-multitool-runtime-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor == 'camilojm33-debug'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply final production-safe repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) AI multi-tool cap: count only executed tool rounds.
          p = Path('services/ai_agent/orchestrator_v2.py')
          text = p.read_text()
          old = '''            tool_rounds += 1\n            if tool_rounds > MAX_TOOL_TURNS:'''
          new = '''            next_tool_round = tool_rounds + 1\n            if next_tool_round > MAX_TOOL_TURNS:'''
          if old in text:
              text = text.replace(old, new, 1)
              anchor = '''                raise RuntimeError("El proveedor IA no pudo completar la respuesta después de consultar las herramientas.")\n\n            assistant_tool_calls = []'''
              replacement = '''                raise RuntimeError("El proveedor IA no pudo completar la respuesta después de consultar las herramientas.")\n\n            tool_rounds = next_tool_round\n            assistant_tool_calls = []'''
              if anchor not in text:
                  raise SystemExit('orchestrator tool-round anchor not found')
              text = text.replace(anchor, replacement, 1)
              p.write_text(text)
          elif 'next_tool_round = tool_rounds + 1' not in text or 'tool_rounds = next_tool_round' not in text:
              raise SystemExit('orchestrator cap state is inconsistent')

          # 2) AI subscription cancellation: one owner for remote cancellation.
          p = Path('company_billing.py')
          text = p.read_text()
          duplicate = '''        if preapproval_id and ai_status.get("origin") == "MERCADO_PAGO":\n            MercadoPagoService().cancel_preapproval(preapproval_id)\n        AISubscriptionService.cancel(company, admin_user_id=current_user.id, reason="tenant_explicit_cancel")'''
          canonical = '''        AISubscriptionService.cancel(company, admin_user_id=current_user.id, reason="tenant_explicit_cancel")'''
          if duplicate in text:
              text = text.replace(duplicate, canonical, 1)
              p.write_text(text)
          elif canonical not in text:
              raise SystemExit('AI cancel route anchor not found')

          # 3) Register the multilevel referral blueprint during normal app bootstrap.
          # referral_network_service imports db/superadmin_required from app, so the
          # import belongs after those core symbols are initialized and before the
          # blueprint registration block.
          p = Path('app.py')
          text = p.read_text()
          top_anchor = 'from stockarmobile.extensions import csrf, db, login_manager, migrate\n'
          network_import = 'from services.referral_network_service import network_bp, install_commission_hook\n'
          if network_import not in text:
              if top_anchor not in text:
                  raise SystemExit('app.py extension import anchor not found')
              text = text.replace(top_anchor, top_anchor + network_import, 1)
          register_anchor = 'app.register_blueprint(referrals_bp)\n'
          register_replacement = 'app.register_blueprint(referrals_bp)\napp.register_blueprint(network_bp)\ninstall_commission_hook()\n'
          if 'app.register_blueprint(network_bp)\n' not in text:
              if register_anchor not in text:
                  raise SystemExit('app.py referral registration anchor not found')
              text = text.replace(register_anchor, register_replacement, 1)
          p.write_text(text)

          # 4) WSGI stays a thin entrypoint; the app owns referral network setup.
          p = Path('wsgi.py')
          text = p.read_text()
          text = re.sub(
              r'from services\.referral_network_service import network_bp, install_commission_hook\n\nif "referral_network\.dashboard" not in app\.view_functions:\n    app\.register_blueprint\(network_bp\)\ninstall_commission_hook\(\)\n\n',
              '',
              text,
              count=1,
          )
          p.write_text(text)

          # 5) Tests should not import WSGI at all; app.py now registers the routes.
          p = Path('tests/test_smoke.py')
          text = p.read_text()
          text = re.sub(r'(?m)^\s*import wsgi  # noqa: F401\s*\n', '', text)
          text = text.replace('APP_URL = stock_app.app.config["APP_URL"]', 'APP_URL = "http://test.local"', 1)
          fixture_marker = 'def clean_database():\n    stock_app.app.config["TESTING"] = True\n    stock_app.app.config["WTF_CSRF_ENABLED"] = False\n'
          if fixture_marker in text and 'stock_app.app.config["APP_URL"] = APP_URL' not in text:
              text = text.replace(fixture_marker, fixture_marker + '    stock_app.app.config["APP_URL"] = APP_URL\n', 1)

          # Current SaaS billing payment receipt contract: make the fixture explicit.
          marker = 'def test_my_company_module_employee_permissions_delete_and_billing_pdf():'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('billing PDF smoke test not found')
          next_def = text.find('\ndef ', start + len(marker))
          if next_def < 0:
              next_def = len(text)
          block = text[start:next_def]
          if 'provider="mercadopago_subscription"' not in block:
              block, changed = re.subn(
                  r'(^\s+)payment_method="transferencia",',
                  r'\1provider="mercadopago_subscription",\n\1payment_method="transferencia",',
                  block,
                  count=1,
                  flags=re.MULTILINE,
              )
              if changed != 1:
                  raise SystemExit('billing payment fixture provider insertion failed')
              text = text[:start] + block + text[next_def:]
          hardcoded = 'f"<url><loc>https://www.stockarmobile.com{page[\'endpoint\']}</loc>"'
          dynamic = 'f"<url><loc>{APP_URL.rstrip(\'/\')}{page[\'endpoint\']}</loc>"'
          if hardcoded in text:
              text = text.replace(hardcoded, dynamic, 1)
          p.write_text(text)

          # AI cancel regression: isolate MP lookup from the provider.
          p = Path('tests/test_ai_subscription_separation.py')
          text = p.read_text()
          marker = 'def test_explicit_tenant_ai_cancel_does_not_modify_standard_subscription(subscription_app, monkeypatch):\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('explicit AI cancel test not found')
          next_def = text.find('\ndef ', start + len(marker))
          if next_def < 0:
              next_def = len(text)
          block = text[start:next_def]
          if 'monkeypatch.setattr(AISubscriptionService, "_get_mp_preapproval"' not in block:
              needle = '    monkeypatch.setattr("services.mercadopago_service.MercadoPagoService.cancel_preapproval", cancel_preapproval)\n'
              if needle not in block:
                  raise SystemExit('explicit AI cancel insertion point not found')
              block = block.replace(needle, needle + '    monkeypatch.setattr(AISubscriptionService, "_get_mp_preapproval", lambda company: {"id": "ai-pre", "status": "pending"})\n', 1)
              text = text[:start] + block + text[next_def:]
              p.write_text(text)
          PY

      - name: Verify syntax
        run: |
          python -m py_compile services/ai_agent/orchestrator_v2.py services/ai_agent/providers/gemini.py services/ai_agent/subscription_service.py company_billing.py app.py wsgi.py tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py
          node --check static/service-worker.js

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py

      - name: Persist repairs and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py wsgi.py services/ai_agent/orchestrator_v2.py company_billing.py tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py .github/workflows/repair-ai-validation.yml
          git rm .github/workflows/repair-ai-validation.yml
          git commit -m 'fix(ai): finalize runtime and production regressions' || exit 0
          git push
