name: Repair AI validation

on:
  push:
    branches:
      - fix/ai-multitool-runtime-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor == 'camilojm33-debug'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Normalize AI regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # The runtime cap test must request one additional tool call so the
          # answer-only synthesis branch is exercised. If it is already patched,
          # leave it untouched.
          p = Path('tests/test_ai_agent_multitool_runtime.py')
          text = p.read_text()
          desired = 'responses = [_tool_call("buscar_producto", f"call-{index}") for index in range(MAX_TOOL_TURNS + 1)]'
          old_pattern = r'responses = \[_tool_call\("buscar_producto", f"call-\{index\}"\) for index in range\(MAX_TOOL_TURNS\)\]'
          if desired not in text:
              text, changed = re.subn(old_pattern, desired, text, count=1)
              if changed != 1:
                  raise SystemExit('multitool cap test is neither legacy nor patched')
              p.write_text(text)

          # Keep explicit AI cancellation hermetic: do not call Mercado Pago from CI.
          p = Path('tests/test_ai_subscription_separation.py')
          text = p.read_text()
          marker = 'def test_explicit_tenant_ai_cancel_does_not_modify_standard_subscription(subscription_app, monkeypatch):\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('explicit AI cancel test not found')
          next_def = text.find('\ndef ', start + len(marker))
          if next_def < 0:
              next_def = len(text)
          block = text[start:next_def]
          if 'monkeypatch.setattr(AISubscriptionService, "_get_mp_preapproval"' not in block:
              needle = '    monkeypatch.setattr("services.mercadopago_service.MercadoPagoService.cancel_preapproval", cancel_preapproval)\n'
              if needle not in block:
                  raise SystemExit('explicit AI cancel insertion point not found')
              block = block.replace(
                  needle,
                  needle + '    monkeypatch.setattr(AISubscriptionService, "_get_mp_preapproval", lambda company: {"id": "ai-pre", "status": "pending"})\n',
                  1,
              )
              text = text[:start] + block + text[next_def:]
              p.write_text(text)

          # Smoke tests: initialize WSGI routes before the first request.
          p = Path('tests/test_smoke.py')
          text = p.read_text()
          if 'import wsgi  # noqa: F401\n' not in text:
              text = text.replace('import app as stock_app\n', 'import app as stock_app\nimport wsgi  # noqa: F401\n', 1)
          # Remove only the known late import used by the referral role test.
          text = re.sub(
              r'(?m)^\s{8}import wsgi  # noqa: F401\n',
              '',
              text,
              count=1,
          )

          # Smoke tests intentionally use an isolated URL for canonical/sitemap assertions.
          text = text.replace('APP_URL = stock_app.app.config["APP_URL"]', 'APP_URL = "http://test.local"', 1)
          fixture_marker = 'def clean_database():\n    stock_app.app.config["TESTING"] = True\n    stock_app.app.config["WTF_CSRF_ENABLED"] = False\n'
          if fixture_marker in text and 'stock_app.app.config["APP_URL"] = APP_URL' not in text:
              text = text.replace(fixture_marker, fixture_marker + '    stock_app.app.config["APP_URL"] = APP_URL\n', 1)

          # The current payment receipt route is under /admin/subscription/payments/.
          text = text.replace(
              '/admin/company-settings/billing/payment/{payment_id}/pdf',
              '/admin/subscription/payments/{payment_id}/pdf',
          )
          p.write_text(text)
          PY

      - name: Verify syntax
        run: |
          python -m py_compile services/ai_agent/orchestrator_v2.py services/ai_agent/providers/gemini.py services/ai_agent/subscription_service.py tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py
          node --check static/service-worker.js

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py

      - name: Persist repairs and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py .github/workflows/repair-ai-validation.yml
          git rm .github/workflows/repair-ai-validation.yml
          git commit -m 'fix(ai): finalize deterministic validation setup' || exit 0
          git push
