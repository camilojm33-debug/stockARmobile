name: Recover subscription service

on:
  push:
    branches:
      - feat/agentes-vendedor-whatsapp-asistente-v1

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore subscription service from known-good commit
        run: |
          git checkout c549538f8b601a55e69e858118a8fda1f108f07e -- services/subscription_service.py
          rm -f .github/workflows/recover-subscription-service.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/subscription_service.py .github/workflows/recover-subscription-service.yml
          git commit -m "fix: restore subscription service"
          git push
