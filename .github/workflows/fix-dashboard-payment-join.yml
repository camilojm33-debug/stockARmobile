name: Fix dashboard payment attribution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard-payment-join.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch invalid Payment join
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/business_value_dashboard_service.py')
          s = p.read_text(encoding='utf-8')
          old = '''    # The existing AI vendor flow marks its payment provider as
    # mercadopago_ai_order and links the payment to the quote. This lets us
    # attribute historical AI sales without adding a new table.
    ai_rows = (
        db.session.query(Sale, Payment.external_reference)
        .join(Quote, Quote.converted_sale_id == Sale.id)
        .join(Payment, Payment.quote_id == Quote.id)
        .filter(
            Sale.company_id == company_id,
            Sale.date >= month_start,
            _confirmed(Sale),
            Payment.company_id == company_id,
            Payment.provider == "mercadopago_ai_order",
        )
        .distinct(Sale.id)
        .all()
    )
'''
          new = '''    # Payment has no quote_id column. The existing AI order flow stores
    # company_id and quote_id inside external_reference, so resolve the
    # relation from that canonical reference instead of guessing a schema.
    ai_payments = Payment.query.filter_by(
        company_id=company_id, provider="mercadopago_ai_order"
    ).all()
    payment_by_quote = {}
    for payment in ai_payments:
        match = re.search(r"(?:^|\\|)quote_id:(\\d+)(?:\\||$)", str(payment.external_reference or ""))
        if match:
            payment_by_quote[int(match.group(1))] = payment.external_reference
    ai_rows = []
    if payment_by_quote:
        ai_rows = (
            db.session.query(Sale, Quote.id)
            .join(Quote, Quote.converted_sale_id == Sale.id)
            .filter(
                Sale.company_id == company_id,
                Sale.date >= month_start,
                _confirmed(Sale),
                Quote.id.in_(list(payment_by_quote.keys())),
            )
            .all()
        )
'''
          if old not in s:
              raise SystemExit('expected dashboard block not found')
          s = s.replace(old, new, 1)
          s = s.replace('    for sale, external_reference in ai_rows:\n', '    for sale, quote_id in ai_rows:\n        external_reference = payment_by_quote.get(int(quote_id), "")\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile services/business_value_dashboard_service.py
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/business_value_dashboard_service.py
          git rm .github/workflows/fix-dashboard-payment-join.yml
          git commit -m "fix: prevent dashboard payment attribution crash"
          git push
