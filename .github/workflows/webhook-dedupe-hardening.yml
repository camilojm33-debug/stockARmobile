name: Webhook dedupe hardening

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch webhook event key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/webhook_service.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def _event_key(self, payload: dict) -> str:
        event_type = payload.get("type") or payload.get("topic") or "unknown"
        data = payload.get("data") or {}
        data_id = str(data.get("id") or payload.get("id") or "none")
        return f"{event_type}:{data_id}"
'''
          new = '''    def _event_key(self, payload: dict) -> str:
        # Mercado Pago assigns a unique notification ID to each webhook delivery.
        # The resource ID is intentionally not used as the generic dedupe key because
        # the same subscription/preapproval can emit multiple state-change notifications.
        event_type = payload.get("type") or payload.get("topic") or "unknown"
        notification_id = str(payload.get("id") or "").strip()
        if notification_id:
            return f"{event_type}:notification:{notification_id}"
        data = payload.get("data") or {}
        data_id = str(data.get("id") or "none")
        return f"{event_type}:{data_id}"
'''
          if old not in s:
              raise SystemExit('webhook event key block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile services/webhook_service.py
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/webhook_service.py
          git rm -f .github/workflows/webhook-dedupe-hardening.yml
          git commit -m 'fix: deduplicate Mercado Pago webhooks by notification id'
          git push origin main
