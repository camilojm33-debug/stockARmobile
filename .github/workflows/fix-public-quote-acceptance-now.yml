name: Fix public quote acceptance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, 'fix: public quote acceptance') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch public acceptance route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('quotes.py')
          s = p.read_text(encoding='utf-8')
          marker = 'PUBLIC_QUOTE_ACCEPTANCE_FIX_V1'
          if marker in s:
              print('already patched')
              raise SystemExit(0)

          import_marker = 'from app import tenant_required, utcnow\n'
          if import_marker not in s:
              raise SystemExit('app import marker not found')
          s = s.replace(import_marker, import_marker + 'from stockarmobile.extensions import csrf\n', 1)

          helper_marker = '''def _build_public_quote_url(quote_id: int) -> str:\n    token = _public_share_serializer().dumps({"quote_id": int(quote_id)}, salt=QUOTE_PUBLIC_TOKEN_SALT)\n    return url_for("quotes.quote_public_view", token=token, _external=True)\n\n\n'''
          helper = '''def _build_public_quote_url(quote_id: int) -> str:\n    token = _public_share_serializer().dumps({"quote_id": int(quote_id)}, salt=QUOTE_PUBLIC_TOKEN_SALT)\n    return url_for("quotes.quote_public_view", token=token, _external=True)\n\n\ndef _build_public_quote_accept_url(quote_id: int) -> str:\n    token = _public_share_serializer().dumps({"quote_id": int(quote_id)}, salt=QUOTE_PUBLIC_TOKEN_SALT)\n    return url_for("quotes.quote_public_accept", token=token, _external=True)\n\n\n'''
          if helper_marker not in s:
              raise SystemExit('public url helper marker not found')
          s = s.replace(helper_marker, helper, 1)

          route_marker = '''@bp.route("/publico/<token>")\ndef quote_public_view(token):\n'''
          route = '''@bp.route("/publico/<token>/aceptar", methods=["POST"])\n@csrf.exempt\ndef quote_public_accept(token):\n    """Accept a quote from its signed public customer link."""\n    from app import Quote, QuoteItem, db\n\n    quote_id = _quote_id_from_public_token(token)\n    if not quote_id:\n        abort(404)\n\n    quote = (\n        Quote.query.options(\n            selectinload(Quote.client),\n            selectinload(Quote.seller),\n            selectinload(Quote.items).selectinload(QuoteItem.product),\n        )\n        .filter(Quote.id == quote_id)\n        .first()\n    )\n    if quote is None:\n        abort(404)\n\n    status = (quote.status or "BORRADOR").upper()\n    now = utcnow()\n\n    if quote.expires_at is not None and quote.expires_at < now and status not in {"APROBADO", "CONVERTIDO", "RECHAZADO", "ANULADO", "VENCIDO"}:\n        quote.status = "VENCIDO"\n        db.session.commit()\n        return redirect(_build_public_quote_url(quote.id))\n\n    if status in {"VENCIDO", "RECHAZADO", "ANULADO", "CONVERTIDO"}:\n        return redirect(_build_public_quote_url(quote.id))\n\n    if status != "APROBADO":\n        quote.status = "APROBADO"\n        db.session.commit()\n\n    return redirect(_build_public_quote_url(quote.id))\n\n\n'''
          if route_marker not in s:
              raise SystemExit('public view route marker not found')
          s = s.replace(route_marker, route + route_marker, 1)

          view_marker = '''        quote=quote,\n        rows=_quote_rows(quote),\n        pdf_url=_build_public_quote_pdf_url(quote.id),\n    )\n\n\n@bp.route("/<int:quote_id>/whatsapp")\n'''
          view_replacement = '''        quote=quote,\n        rows=_quote_rows(quote),\n        pdf_url=_build_public_quote_pdf_url(quote.id),\n        accept_url=_build_public_quote_accept_url(quote.id),\n    )\n\n\n@bp.route("/<int:quote_id>/whatsapp")\n'''
          if view_marker not in s:
              raise SystemExit('public view render marker not found')
          s = s.replace(view_marker, view_replacement, 1)

          # The acceptance branch above renders no template itself, so this marker is
          # only a source audit flag that this version contains the public endpoint.
          s = s.replace('QUOTE_PUBLIC_TOKEN_MAX_AGE_SECONDS = 60 * 60 * 24 * 30\n', 'QUOTE_PUBLIC_TOKEN_MAX_AGE_SECONDS = 60 * 60 * 24 * 30\n' + marker + '\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Test
        env:
          PYTHONPATH: .
        run: |
          pip install -r requirements.txt
          python -m compileall -q .
          pytest -q

      - name: Commit only if green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.py
          git rm -f .github/workflows/fix-public-quote-acceptance-now.yml
          git commit -m 'fix: public quote acceptance'
          git push origin HEAD:main
