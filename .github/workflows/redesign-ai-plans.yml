name: Redesign AI plans page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redesign plans section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('templates/ai_agents/index.html')
          source = path.read_text(encoding='utf-8-sig')

          if 'AI_PLANS_REDESIGN_V1' not in source:
              css_marker = '  .ai-flow { display:grid;'
              css = '''  /* AI_PLANS_REDESIGN_V1 */
          .ai-plans-hero { position:relative; overflow:hidden; border:1px solid var(--app-line); background:linear-gradient(135deg,#eef5ff 0%,#f8fbff 55%,#ffffff 100%); }
          .ai-plans-hero::after { content:""; position:absolute; right:-80px; bottom:-120px; width:300px; height:300px; border-radius:50%; background:rgba(37,99,235,.08); }
          .ai-plans-hero-copy { position:relative; z-index:1; max-width:820px; }
          .ai-plans-hero-art { position:relative; z-index:1; width:150px; height:150px; display:grid; place-items:center; }
          .ai-plans-hero-orb { width:126px; height:126px; border-radius:34px; display:grid; place-items:center; transform:rotate(-7deg); background:linear-gradient(145deg,#2563eb,#4f46e5); box-shadow:0 18px 44px rgba(37,99,235,.20); }
          .ai-plans-hero-orb i { color:#fff; font-size:3.1rem; transform:rotate(7deg); }
          .ai-plan-grid-v2 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1rem; align-items:stretch; }
          .ai-plan-card-v3 { position:relative; display:flex; flex-direction:column; height:100%; border:1px solid var(--app-line); overflow:hidden; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; background:#fff; }
          .ai-plan-card-v3:hover { transform:translateY(-4px); box-shadow:0 16px 38px rgba(15,23,42,.10); border-color:rgba(37,99,235,.25); }
          .ai-plan-card-v3.recommended { border:2px solid #2563eb; box-shadow:0 16px 40px rgba(37,99,235,.14); }
          .ai-plan-card-v3.premium { background:linear-gradient(145deg,#f8fbff,#fff); }
          .ai-plan-topline { min-height:34px; display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
          .ai-plan-price-v3 { font-size:1.8rem; font-weight:900; letter-spacing:-.035em; margin:.35rem 0 .2rem; }
          .ai-plan-benefit { min-height:42px; color:var(--app-muted); font-size:.84rem; }
          .ai-plan-feature-list { list-style:none; padding:0; margin:1rem 0 0; }
          .ai-plan-feature-list li { display:flex; gap:.5rem; align-items:flex-start; margin-bottom:.55rem; font-size:.87rem; }
          .ai-plan-feature-list i { color:#16a34a; margin-top:.12rem; }
          .ai-plan-bottom { margin-top:auto; }
          .ai-plan-trust { font-size:.74rem; color:var(--app-muted); text-align:center; margin-top:.55rem; }
          .ai-plan-pro-callout { border:1px solid rgba(37,99,235,.16); border-radius:16px; padding:1.25rem; background:linear-gradient(135deg,rgba(37,99,235,.07),rgba(79,70,229,.025)); }
          .ai-plan-pro-callout-icon { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; background:#eef4ff; color:#2563eb; font-size:1.25rem; }
          .ai-plan-choice { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; }
          .ai-plan-choice-card { border:1px solid var(--app-line); border-radius:14px; padding:.95rem; background:var(--app-panel-soft); }
          .ai-plan-choice-card strong { display:block; margin-bottom:.2rem; }
          .ai-plan-compare { overflow-x:auto; }
          .ai-plan-compare table { min-width:760px; }
          .ai-plan-compare th, .ai-plan-compare td { vertical-align:middle; text-align:center; }
          .ai-plan-compare th:first-child, .ai-plan-compare td:first-child { text-align:left; }
          @media (max-width:1100px) { .ai-plan-grid-v2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .ai-plan-choice { grid-template-columns:repeat(2,minmax(0,1fr)); } }
          @media (max-width:700px) { .ai-plans-hero-art { width:110px; height:110px; } .ai-plans-hero-orb { width:96px; height:96px; } .ai-plans-hero-orb i { font-size:2.5rem; } .ai-plan-grid-v2 { grid-template-columns:1fr; } .ai-plan-choice { grid-template-columns:1fr; } .ai-plan-price-v3 { font-size:1.6rem; } }
'''
              if css_marker not in source:
                  raise SystemExit('AI plans CSS marker not found')
              source = source.replace(css_marker, css + css_marker, 1)

              start_marker = '  {% elif view == \'planes\' %}'
              end_marker = '  {% endif %}\n</div>\n{% endblock %}'
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit('AI plans section start not found')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit('AI plans section end boundary not found')

              replacement = '''  {% elif view == 'planes' %}
  <section class="card app-card ai-plans-hero mb-4">
    <div class="card-body p-4 p-lg-5 d-flex flex-wrap justify-content-between align-items-center gap-4">
      <div class="ai-plans-hero-copy">
        <span class="page-kicker"><i class="bi bi-stars me-1"></i> Agentes IA para tu comercio</span>
        <h1 class="display-6 fw-bold mb-2">Tu comercio puede trabajar más inteligente.</h1>
        <p class="lead text-muted mb-3">Elegí el equipo de IA que necesitás para vender más, ahorrar tiempo y tener el control de tu negocio.</p>
        <div class="d-flex flex-wrap gap-2"><span class="badge text-bg-light border"><i class="bi bi-shield-lock me-1"></i>Pago seguro</span><span class="badge text-bg-light border"><i class="bi bi-arrow-repeat me-1"></i>Renovación mensual</span><span class="badge text-bg-light border"><i class="bi bi-lightning-charge me-1"></i>Activación automática</span></div>
      </div>
      <div class="ai-plans-hero-art" aria-hidden="true"><div class="ai-plans-hero-orb"><i class="bi bi-robot"></i></div></div>
    </div>
  </section>

  <div class="mb-3"><h2 class="h4 fw-bold mb-1">Elegí el equipo que necesitás</h2><p class="text-muted mb-0">Podés empezar simple y sumar agentes cuando tu comercio los necesite.</p></div>
  <section class="ai-plan-grid-v2 mb-4">
    {% for plan_item in ai_plans %}
      {% set is_active_plan = ai_status and ai_status.plan_code == plan_item.code and ai_status.status == 'ACTIVA' %}
      {% set is_pending_plan = ai_status and ai_status.plan_code == plan_item.code and ai_status.status == 'PENDIENTE' %}
      {% set card_class = 'recommended' if plan_item.badge == 'RECOMENDADO' else 'premium' if plan_item.code == 'pro' else '' %}
      <article class="card app-card ai-plan-card-v3 {{ card_class }}">
        <div class="card-body p-3 p-lg-4">
          <div class="ai-plan-topline">
            <div>{% if is_active_plan %}<span class="badge text-bg-success"><i class="bi bi-check-circle me-1"></i>Plan activo</span>{% elif is_pending_plan %}<span class="badge text-bg-warning text-dark"><i class="bi bi-hourglass-split me-1"></i>Pendiente</span>{% endif %}</div>
            {% if plan_item.badge %}<span class="badge {{ 'text-bg-primary' if plan_item.badge == 'RECOMENDADO' else 'text-bg-dark' }}">{{ plan_item.badge }}</span>{% endif %}
          </div>
          <h2 class="h4 fw-bold mb-1 mt-2">{{ plan_item.name }}</h2>
          <div class="ai-plan-benefit">{{ plan_item.tagline }}</div>
          <div class="ai-plan-price-v3">{{ plan_item.price }}</div>
          <div class="small text-muted">por mes · {{ plan_item.limit }} interacciones IA incluidas</div>
          <ul class="ai-plan-feature-list">
            {% if plan_item.code == 'inicio' %}
            <li><i class="bi bi-check-circle-fill"></i><span>Asistente Empresarial</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Consultas sobre productos, stock y clientes</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Datos reales de tu comercio</span></li>
            {% elif plan_item.code == 'vendedor' %}
            <li><i class="bi bi-check-circle-fill"></i><span>Todo lo de Inicio</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Vendedor IA disponible 24/7</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Recomendaciones, presupuestos y pedidos</span></li>
            {% elif plan_item.code == 'negocio' %}
            <li><i class="bi bi-check-circle-fill"></i><span>Todo lo de Vendedor</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Analista IA para tus ventas y stock</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Clientes inactivos y oportunidades</span></li>
            {% else %}
            <li><i class="bi bi-check-circle-fill"></i><span>Todo tu equipo IA completo</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Marketing IA</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Reconocimiento de facturas de proveedores</span></li>
            <li><i class="bi bi-check-circle-fill"></i><span>Preparación de productos y stock desde facturas</span></li>
            {% endif %}
            <li><i class="bi bi-check-circle-fill"></i><span>{{ plan_item.limit }} interacciones IA por mes</span></li>
          </ul>
        </div>
        <div class="card-footer bg-transparent border-0 p-3 p-lg-4 pt-0 ai-plan-bottom">
          {% if is_active_plan %}
          <a class="btn btn-outline-primary w-100" href="{{ url_for('company_billing.subscription_portal') }}#suscripcion-ia"><i class="bi bi-gear me-1"></i>Administrar mi plan</a>
          {% else %}
          <form method="post" action="{{ ai_checkout_url }}" class="d-grid gap-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="plan_code" value="{{ plan_item.code }}">
            <button class="btn btn-primary w-100" type="submit" name="payment_method" value="automatic">{{ 'Continuar con Mercado Pago' if is_pending_plan else 'Contratar ahora' }}</button>
            <button class="btn btn-outline-primary w-100" type="submit" name="payment_method" value="qr">Pagar con QR</button>
          </form>
          <div class="ai-plan-trust"><i class="bi bi-lock me-1"></i>Pago seguro · renovación mensual</div>
          {% endif %}
        </div>
      </article>
    {% endfor %}
  </section>

  <section class="card app-card mb-4">
    <div class="card-body p-4">
      <div class="mb-3"><h2 class="h5 fw-bold mb-1">¿Cuál es el plan para tu comercio?</h2><p class="text-muted mb-0">Elegí según lo que querés resolver hoy.</p></div>
      <div class="ai-plan-choice">
        <div class="ai-plan-choice-card"><strong>🌱 Quiero empezar</strong><span class="small text-muted">Consultas y asistencia para conocer mejor mi negocio.</span><div class="small fw-bold mt-2">→ Inicio</div></div>
        <div class="ai-plan-choice-card"><strong>🛒 Quiero vender 24/7</strong><span class="small text-muted">Atender clientes, recomendar productos y preparar pedidos.</span><div class="small fw-bold mt-2">→ Vendedor</div></div>
        <div class="ai-plan-choice-card"><strong>📊 Quiero decidir mejor</strong><span class="small text-muted">Analizar ventas, stock y clientes para detectar oportunidades.</span><div class="small fw-bold mt-2">→ Negocio IA</div></div>
        <div class="ai-plan-choice-card"><strong>🚀 Quiero automatizar más</strong><span class="small text-muted">Ventas, análisis, marketing y facturas de proveedores con IA.</span><div class="small fw-bold mt-2">→ IA PRO</div></div>
      </div>
    </div>
  </section>

  <section class="card app-card mb-4">
    <div class="card-body p-4 p-lg-5">
      <div class="ai-plan-pro-callout">
        <div class="d-flex gap-3 align-items-start">
          <div class="ai-plan-pro-callout-icon"><i class="bi bi-stars"></i></div>
          <div>
            <h2 class="h5 fw-bold mb-1">🚀 IA PRO: tu equipo completo</h2>
            <p class="text-muted mb-2">Vendé, analizá y automatizá más desde un solo lugar.</p>
            <div class="small text-muted">Incluye Vendedor, Asistente, Analista, Marketing y reconocimiento de facturas de proveedores para preparar productos y stock.</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="card app-card mb-4">
    <div class="card-body p-4">
      <h2 class="h5 fw-bold mb-1">Compará los planes</h2>
      <p class="text-muted mb-3">Todo lo que cambia a medida que crece tu equipo IA.</p>
      <div class="ai-plan-compare">
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th>Función</th><th>Inicio</th><th>Vendedor</th><th>Negocio IA</th><th>IA PRO</th></tr></thead>
          <tbody>
            <tr><td>Asistente Empresarial</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr>
            <tr><td>Vendedor IA 24/7</td><td>—</td><td>✓</td><td>✓</td><td>✓</td></tr>
            <tr><td>Analista IA</td><td>—</td><td>—</td><td>✓</td><td>✓</td></tr>
            <tr><td>Marketing IA</td><td>—</td><td>—</td><td>—</td><td>✓</td></tr>
            <tr><td>Facturas de proveedores + IA</td><td>—</td><td>—</td><td>—</td><td>✓</td></tr>
            <tr><td>Productos y stock desde facturas</td><td>—</td><td>—</td><td>—</td><td>✓</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
'''
              source = source[:start] + replacement + source[end:]
              path.write_text(source, encoding='utf-8')
          PY

      - name: Validate and cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI_PLANS_REDESIGN_V1' templates/ai_agents/index.html
          grep -q '¿Cuál es el plan para tu comercio?' templates/ai_agents/index.html
          grep -q 'IA PRO: tu equipo completo' templates/ai_agents/index.html
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- templates/ai_agents/index.html; then
            git add templates/ai_agents/index.html
            git commit -m "feat: redesign AI plans for conversion"
          fi
          git rm .github/workflows/redesign-ai-plans.yml
          git commit -m "chore: remove temporary AI plans workflow"
          git push origin main
