name: StockArMobile tests

concurrency:
  group: stockarmobile-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      TESTING: "1"
      SECRET_KEY: test-secret-key
      DATABASE_URL: sqlite:////tmp/stockarmobile-test.db
      AI_PROVIDER: lm_studio
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pip-audit
      - run: python -m compileall -q .
      - run: pip-audit
      - name: Run multi-company tenant context regressions
        run: >-
          pytest -q
          tests/test_company_memberships.py::test_authenticated_user_can_switch_tenant_without_rewriting_primary_identity
          tests/test_company_memberships.py::test_user_without_active_membership_can_only_accept_new_company_invitation
      - run: pytest -q
