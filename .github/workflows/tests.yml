name: StockArMobile tests

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      TESTING: "1"
      SECRET_KEY: test-secret-key
      DATABASE_URL: sqlite:////tmp/stockarmobile-test.db
      AI_PROVIDER: lm_studio
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pip-audit
      - run: python -m compileall -q .
      - run: pip-audit
      - run: pytest -q
