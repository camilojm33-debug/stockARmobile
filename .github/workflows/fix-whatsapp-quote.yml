name: Fix quote WhatsApp backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch quotes.py
        run: echo '' | base64 -d | python
      - name: Validate
        run: python -m py_compile quotes.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.py
          git diff --cached --quiet || (git commit -m 'fix: permitir WhatsApp sin cliente y con numero manual' && git push origin main)
