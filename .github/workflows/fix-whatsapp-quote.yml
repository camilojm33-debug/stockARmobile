name: Fix quote WhatsApp backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: permitir WhatsApp sin cliente y con numero manual') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch quotes WhatsApp flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('quotes.py')
          text = path.read_text(encoding='utf-8')

          pattern_get = re.compile(
              r'@bp\.route\("/<int:quote_id>/whatsapp"\)\n'
              r'@tenant_required\n@login_required\ndef share_whatsapp\(quote_id\):\n'
              r'.*?\n\n\n@bp\.route\("/<int:quote_id>/whatsapp", methods=\["POST"\]\)',
              re.S,
          )
          replacement_get = '''@bp.route("/<int:quote_id>/whatsapp")
          @tenant_required
          @login_required
          def share_whatsapp(quote_id):
              from app import Company

              quote = _quote_lookup(quote_id)
              _require_owned_or_authorized(quote)
              _require_quote_permission("quotes_share_whatsapp")
              # El cliente y su teléfono son opcionales. Si existe un teléfono
              # se precarga; si no, la pantalla permite escribirlo o abrir WhatsApp
              # para elegir el contacto manualmente.
              phone = _quote_client_whatsapp_phone(quote)
              company = Company.query.filter_by(id=quote.company_id).first()
              message = _build_quote_whatsapp_message(quote, company)
              public_url = _build_public_quote_url(quote.id)
              return render_template("presupuestos/whatsapp_dialog.html", quote=quote, entered_phone=phone, message=message, pdf_url=public_url)


          @bp.route("/<int:quote_id>/whatsapp", methods=["POST"])
          '''
          new_text, count = pattern_get.subn(replacement_get, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró el bloque GET de WhatsApp para presupuestos')
          text = new_text

          pattern_post = re.compile(
              r'@bp\.route\("/<int:quote_id>/whatsapp", methods=\["POST"\]\)\n'
              r'@tenant_required\n@login_required\ndef share_whatsapp_post\(quote_id\):\n'
              r'.*?\n\n\n@bp\.route\("/<int:quote_id>/convertir", methods=\["POST"\]\)',
              re.S,
          )
          replacement_post = '''@bp.route("/<int:quote_id>/whatsapp", methods=["POST"])
          @tenant_required
          @login_required
          def share_whatsapp_post(quote_id):
              from app import Company, record_audit

              quote = _quote_lookup(quote_id)
              _require_owned_or_authorized(quote)
              _require_quote_permission("quotes_share_whatsapp")
              # Permitir un número escrito manualmente; si queda vacío, abrir
              # WhatsApp sin destinatario para que el usuario elija el contacto.
              phone = (request.form.get("whatsapp_phone") or "").strip() or _quote_client_whatsapp_phone(quote)
              company = Company.query.filter_by(id=quote.company_id).first()
              message = _build_quote_whatsapp_message(quote, company)
              public_url = _build_public_quote_url(quote.id)
              record_audit(action="quote_share_whatsapp", entity="quote", entity_id=quote.id, detail=f"Compartido por WhatsApp {quote.number or quote.id}", ip_address=request.remote_addr)
              return redirect(build_whatsapp_share_url(phone=phone, message=message, document_url=public_url, document_label="Presupuesto"))


          @bp.route("/<int:quote_id>/convertir", methods=["POST"])
          '''
          new_text, count = pattern_post.subn(replacement_post, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró el bloque POST de WhatsApp para presupuestos')
          path.write_text(new_text, encoding='utf-8')
          print('quotes.py patched successfully')
          PY

      - name: Validate Python syntax
        run: python -m py_compile quotes.py

      - name: Commit backend fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.py
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: permitir WhatsApp sin cliente y con numero manual'
          git push origin main
