name: Restore base template
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known good base template
        run: |
          git checkout 68fdecf0d202f20ee4e64f823ca3d775241ec964 -- templates/base_master.html
          git add templates/base_master.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'restore: base template from known good revision' || exit 0
          git rm .github/workflows/restore-base-template.yml
          git commit -m 'chore: remove temporary restore workflow'
          git push
