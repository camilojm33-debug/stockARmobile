name: Permanently repair Mercado Pago subscription

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch actual application files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('templates/base_master.html')
          text = base.read_text(encoding='utf-8')

          # Replace the generic POST loader with a capture listener that explicitly
          # bypasses the blocking overlay for the Mercado Pago auto-subscription form.
          pattern = re.compile(
              r"document\.querySelectorAll\('form\[method=\"post\"\]'\)\.forEach\(function\(form\)\s*\{\s*"
              r"form\.addEventListener\('submit', function\(\)\s*\{\s*"
              r"const loading = document\.getElementById\('appLoading'\);\s*"
              r"if \(loading\) loading\.classList\.add\('show'\);\s*"
              r"\}\);\s*\}\);",
              re.MULTILINE,
          )
          replacement = '''document.addEventListener('submit', function(event) {
        const form = event.target;
        if (form && form.matches && form.matches('form[data-mp-auto-subscription="true"]')) {
          const loading = document.getElementById('appLoading');
          if (loading) loading.classList.remove('show');
          const button = form.querySelector('[data-mp-auto-subscription-button="true"]');
          if (button) {
            button.disabled = true;
            button.textContent = 'Conectando con Mercado Pago…';
          }
          event.stopImmediatePropagation();
        }
      }, true);

      document.querySelectorAll('form[method="post"]').forEach(function(form) {
        form.addEventListener('submit', function() {
          if (form.matches('form[data-mp-auto-subscription="true"]')) return;
          const loading = document.getElementById('appLoading');
          if (loading) loading.classList.add('show');
        });
      });'''

          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró el listener global de formularios')
          base.write_text(text2, encoding='utf-8')

          portal = Path('templates/company_billing/portal.html')
          p = portal.read_text(encoding='utf-8')
          form_marker = '<form method="post" action="{{ url_for(\'company_billing.create_mercadopago_subscription\') }}" data-mp-auto-subscription="true">'
          if form_marker not in p:
              old_form = '<form method="post" action="{{ url_for(\'company_billing.create_mercadopago_subscription\') }}">'
              if old_form not in p:
                  raise SystemExit('No se encontró el formulario de suscripción automática')
              p = p.replace(old_form, form_marker, 1)
          button_marker = '<button class="btn btn-success" type="submit" data-mp-auto-subscription-button="true">Activar suscripción automática</button>'
          if button_marker not in p:
              old_button = '<button class="btn btn-success" type="submit">Activar suscripción automática</button>'
              if old_button not in p:
                  raise SystemExit('No se encontró el botón de suscripción automática')
              p = p.replace(old_button, button_marker, 1)
          p = re.sub(r'\s*<script id="mp-auto-subscription-final-guard">.*?</script>\s*', '\n', p, flags=re.S)
          p = p.replace('{% endblock %}', '''<script id="mp-auto-subscription-final-guard">
(function () {
  document.addEventListener('submit', function (event) {
    const form = event.target;
    if (!form || !form.matches || !form.matches('form[data-mp-auto-subscription="true"]')) return;
    document.getElementById('appLoading')?.classList.remove('show');
  }, true);
})();
</script>
{% endblock %}''', 1)
          portal.write_text(p, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          base = Path('templates/base_master.html').read_text(encoding='utf-8')
          portal = Path('templates/company_billing/portal.html').read_text(encoding='utf-8')
          assert 'form[data-mp-auto-subscription="true"]' in base
          assert 'event.stopImmediatePropagation();' in base
          assert 'data-mp-auto-subscription-button="true"' in portal
          assert 'mp-auto-subscription-final-guard' in portal
          PY
          python -m py_compile company_billing.py services/mercadopago_subscription_service.py services/mercadopago_service.py

      - name: Commit repaired application files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/base_master.html templates/company_billing/portal.html
          if git diff --cached --quiet; then
            echo 'No application changes required.'
            exit 0
          fi
          git commit -m 'fix: bypass blocking loader for Mercado Pago subscription'
          git push origin main
