name: Move AI metrics out of main dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-ai-metrics-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restructure dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Remove the large business-value presentation from the main dashboard.
          p = Path('templates/dashboard/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\s*<!-- BUSINESS_VALUE_DASHBOARD_V1 -->.*?</section>\s*'
          s, removed = re.subn(pattern, '\n', s, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit(f'expected one business-value block, removed={removed}')

          # 2) Add a dedicated IA metrics button to the operational dashboard.
          marker = '''          {% endif %}\n        </div>\n      </div>'''
          replacement = '''          {% endif %}\n          <a href="{{ url_for('dashboard.ai_metrics') }}" class="btn btn-outline-primary">\n            <i class="bi bi-robot me-1"></i>Métricas de IA\n          </a>\n        </div>\n      </div>'''
          if marker not in s:
              raise SystemExit('dashboard action marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Stop hiding the actual operational dashboard with the old CSS patch.
          p = Path('static/assets/css/dashboard.css')
          s = p.read_text(encoding='utf-8')
          hide_block = '''.app-shell > .dcc4,\n.app-shell > .hero-surface {\n  display: none !important;\n}\n'''
          if hide_block not in s:
              raise SystemExit('old dashboard hiding rule not found')
          s = s.replace(hide_block, '', 1)
          p.write_text(s, encoding='utf-8')

          # 4) Add a tenant-scoped route for the dedicated IA metrics page.
          p = Path('dashboard.py')
          s = p.read_text(encoding='utf-8')
          route = '''\n\n@bp.route("/ia")\n@tenant_required\ndef ai_metrics():\n    if not can_access_ai(current_user):\n        flash("Tu empresa no tiene habilitado el acceso a Agentes IA.", "warning")\n        return redirect(url_for("dashboard.index"))\n    context = build_dashboard_context()\n    return render_template(\n        "dashboard/ai_metrics.html",\n        business_value=context.get("business_value") or {},\n        can_view_economic_metrics=context.get("can_view_economic_metrics", False),\n    )\n'''
          anchor = '''@bp.route("/stats")\n@tenant_required\ndef stats():'''
          if 'def ai_metrics()' not in s:
              if anchor not in s:
                  raise SystemExit('dashboard stats anchor not found')
              s = s.replace(anchor, route + '\n' + anchor, 1)
          p.write_text(s, encoding='utf-8')

          print('dashboard IA separation applied')
          PY

      - name: Validate files
        run: |
          python -m py_compile dashboard.py services/dashboard_service.py services/business_value_dashboard_service.py
          python - <<'PY'
          from pathlib import Path
          index = Path('templates/dashboard/index.html').read_text(encoding='utf-8')
          css = Path('static/assets/css/dashboard.css').read_text(encoding='utf-8')
          ai = Path('templates/dashboard/ai_metrics.html').read_text(encoding='utf-8')
          dash = Path('dashboard.py').read_text(encoding='utf-8')
          assert 'BUSINESS_VALUE_DASHBOARD_V1' not in index
          assert "url_for('dashboard.ai_metrics')" in index
          assert '.app-shell > .dcc4,\n.app-shell > .hero-surface {\n  display: none !important;' not in css
          assert 'def ai_metrics()' in dash
          assert 'Ventas generadas por IA' in ai
          assert 'Dinero recuperado por IA' in ai
          print('dashboard IA validation passed')
          PY
          git diff --check

      - name: Commit final changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/dashboard/index.html templates/dashboard/ai_metrics.html dashboard.py static/assets/css/dashboard.css
          git rm .github/workflows/move-ai-metrics-dashboard.yml
          git commit -m "feat: separate AI metrics from main dashboard"
          git push
