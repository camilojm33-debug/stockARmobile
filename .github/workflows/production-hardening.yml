name: Production hardening

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          # Mercado Pago: deterministic idempotency keys.
          p = Path("services/mercadopago_service.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "def _headers(self, *, include_idempotency: bool = False, access_token: str | None = None)",
              "def _headers(self, *, include_idempotency: bool = False, idempotency_key: str | None = None, access_token: str | None = None)",
          )
          s = s.replace(
              'headers["X-Idempotency-Key"] = str(uuid.uuid4())',
              'headers["X-Idempotency-Key"] = (idempotency_key or str(uuid.uuid4())).strip()',
          )
          s = s.replace(
              "def _request(self, method: str, path: str, *, payload: dict[str, Any] | None = None, access_token: str | None = None)",
              "def _request(self, method: str, path: str, *, payload: dict[str, Any] | None = None, access_token: str | None = None, idempotency_key: str | None = None)",
          )
          s = s.replace(
              "headers=self._headers(include_idempotency=method in {\"POST\", \"PUT\", \"PATCH\"}, access_token=access_token),",
              "headers=self._headers(include_idempotency=method in {\"POST\", \"PUT\", \"PATCH\"}, idempotency_key=idempotency_key, access_token=access_token),",
          )
          s = s.replace(
              'return self._request("POST", "/checkout/preferences", payload=payload)',
              'return self._request("POST", "/checkout/preferences", payload=payload, idempotency_key=f"checkout-preference:{external_reference}")',
              1,
          )
          s = s.replace(
              'return self._request("POST", "/checkout/preferences", payload=payload, access_token=access_token)',
              'return self._request("POST", "/checkout/preferences", payload=payload, access_token=access_token, idempotency_key=f"pos-checkout-preference:{external_reference}")',
          )
          s = s.replace(
              'return self._request("POST", "/preapproval", payload=payload)',
              'return self._request("POST", "/preapproval", payload=payload, idempotency_key=f"preapproval:{external_reference}")',
          )
          s = s.replace(
              'def update_preapproval(self, preapproval_id: str, payload: dict[str, Any]) -> dict[str, Any]: return self._request("PUT", f"/preapproval/{preapproval_id}", payload=payload)',
              'def update_preapproval(self, preapproval_id: str, payload: dict[str, Any]) -> dict[str, Any]:\n        status = str((payload or {}).get("status") or "update").strip().lower()\n        return self._request("PUT", f"/preapproval/{preapproval_id}", payload=payload, idempotency_key=f"preapproval-update:{preapproval_id}:{status}")',
          )
          p.write_text(s, encoding="utf-8")

          # Subscription reactivation: only unpause an existing preapproval. Canceled/expired resources require new authorization.
          p = Path("company_billing.py")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r'@bp\.route\("/subscription/reactivate", methods=\["POST"\]\)\n@company_member_required\ndef reactivate_subscription\(\):\n.*?\n\n@bp\.route\("/payment-qr-settings"', re.S)
          replacement = '''@bp.route("/subscription/reactivate", methods=["POST"])
@company_member_required
def reactivate_subscription():
    from app import Company, db, record_audit
    from services.mercadopago_service import MercadoPagoService
    from services.mercadopago_subscription_service import MercadoPagoSubscriptionService

    company_id = getattr(current_user, "company_id", None)
    subscription = SubscriptionService.active_subscription_for_company(company_id)
    if subscription is None:
        flash("No se encontró una suscripción activa para reactivar.", "warning")
        return redirect(url_for("company_billing.subscription_portal"))
    try:
        metadata = SubscriptionService._metadata_dict(subscription)
        preapproval_id = str(metadata.get("mercadopago_preapproval_id") or "").strip()
        plan = getattr(subscription, "plan", None)
        company = Company.query.filter_by(id=company_id).first()
        if company is None or plan is None:
            raise RuntimeError("No se pudo determinar la empresa o el plan actual.")
        if preapproval_id:
            mp = MercadoPagoService()
            remote = mp.get_preapproval(preapproval_id)
            mp_status = str(remote.get("status") or "").strip().lower()
            if mp_status == "paused":
                mp.update_preapproval(preapproval_id, {"status": "authorized"})
                BillingService.reactivate_subscription(db.session, subscription=subscription, user_id=current_user.id)
                record_audit(action="subscription_reactivate", entity="subscription", entity_id=subscription.id, detail="Suscripción Mercado Pago reactivada desde estado pausado")
                db.session.commit()
                flash("La suscripción automática de Mercado Pago fue reactivada.", "success")
                return redirect(url_for("company_billing.subscription_portal"))
            if mp_status == "authorized":
                BillingService.reactivate_subscription(db.session, subscription=subscription, user_id=current_user.id)
                db.session.commit()
                flash("La suscripción automática ya estaba autorizada y quedó reactivada en StockArMobile.", "success")
                return redirect(url_for("company_billing.subscription_portal"))
        payer_email = (getattr(current_user, "email", None) or getattr(company, "contact_email", None) or "").strip()
        config = load_billing_config()
        response = MercadoPagoSubscriptionService.create(
            db_session=db.session,
            company=company,
            subscription=subscription,
            plan=plan,
            payer_email=payer_email,
            notification_url=config.notification_url,
            back_url=config.success_url,
        )
        checkout_url = str(response.get("init_point") or response.get("sandbox_init_point") or "").strip()
        if not checkout_url:
            raise RuntimeError("Mercado Pago no devolvió el enlace de autorización.")
        db.session.commit()
        return redirect(checkout_url)
    except Exception:
        db.session.rollback()
        current_app.logger.exception("Error reactivando suscripción Mercado Pago")
        flash("No se pudo reactivar la suscripción automática en Mercado Pago.", "danger")
        return redirect(url_for("company_billing.subscription_portal"))


@bp.route("/payment-qr-settings"'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit("reactivate_subscription route not found")
          p.write_text(s, encoding="utf-8")

          # Webhook dedupe: same preapproval ID can legitimately emit multiple state changes.
          p = Path("services/webhook_service.py")
          s = p.read_text(encoding="utf-8")
          if "import hashlib\n" not in s:
              s = s.replace("import json\n", "import hashlib\nimport json\n", 1)
          old = '''        existing = WebhookEvent.query.filter_by(event_key=event_key).first()
        if existing:
            return {"status": "duplicate", "event_key": event_key}

        payment_data = None
'''
          new = '''        subscription_preapproval = None
        if event_type in {"subscription_preapproval", "subscription_preapproval_plan"}:
            subscription_preapproval = self.mp_service.get_preapproval(data_id)
            fingerprint = hashlib.sha256(
                json.dumps(subscription_preapproval, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
            ).hexdigest()[:32]
            event_key = f"subscription_preapproval:{data_id}:{fingerprint}"

        existing = WebhookEvent.query.filter_by(event_key=event_key).first()
        if existing:
            return {"status": "duplicate", "event_key": event_key}

        payment_data = None
'''
          if old not in s:
              raise SystemExit("webhook dedupe block not found")
          s = s.replace(old, new, 1)
          old = '''        if event_type in {"subscription_preapproval", "subscription_preapproval_plan"}:
            from services.mercadopago_subscription_service import MercadoPagoSubscriptionService
            preapproval = self.mp_service.get_preapproval(data_id)
            subscription = MercadoPagoSubscriptionService.sync_preapproval(db_session=db_session, preapproval=preapproval)
'''
          new = '''        if event_type in {"subscription_preapproval", "subscription_preapproval_plan"}:
            from services.mercadopago_subscription_service import MercadoPagoSubscriptionService
            preapproval = subscription_preapproval or self.mp_service.get_preapproval(data_id)
            subscription = MercadoPagoSubscriptionService.sync_preapproval(db_session=db_session, preapproval=preapproval)
'''
          if old not in s:
              raise SystemExit("webhook preapproval block not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # Offline queue: only successful HTTP responses delete an operation. Auth/conflict errors remain visible.
          p = Path("static/service-worker.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("const CACHE_NAME = 'stockarmobile-pwa-v7';", "const CACHE_NAME = 'stockarmobile-pwa-v8';", 1)
          s = s.replace("const DB_VERSION = 2;", "const DB_VERSION = 3;", 1)
          old = '''      if (response.ok || [401, 403, 409, 412].includes(response.status)) {
        await dbDelete(REQUEST_STORE, item.id);
        await updateMeta(LAST_SYNC_KEY, nowIso());
        await updateMeta(LAST_ERROR_KEY, '');
        syncState.syncedCount += 1;
      } else {
        await dbPut(REQUEST_STORE, { ...item, attempts: (item.attempts || 0) + 1, status: 'pending' });
        await updateMeta(LAST_ERROR_KEY, `Error sincronizando ${item.operationType || item.url}: HTTP ${response.status}`);
        syncState.errorCount += 1;
      }
'''
          new = '''      if (response.ok) {
        await dbDelete(REQUEST_STORE, item.id);
        await updateMeta(LAST_SYNC_KEY, nowIso());
        await updateMeta(LAST_ERROR_KEY, '');
        syncState.syncedCount += 1;
      } else if ([401, 403, 409, 412].includes(response.status)) {
        await dbPut(REQUEST_STORE, {
          ...item,
          attempts: (item.attempts || 0) + 1,
          status: 'needs_attention',
          lastHttpStatus: response.status,
          lastAttemptAt: nowIso(),
        });
        await updateMeta(LAST_ERROR_KEY, `Operación ${item.operationType || item.url} requiere atención: HTTP ${response.status}. No se eliminó de la cola.`);
        syncState.errorCount += 1;
      } else {
        await dbPut(REQUEST_STORE, {
          ...item,
          attempts: (item.attempts || 0) + 1,
          status: 'pending',
          lastHttpStatus: response.status,
          lastAttemptAt: nowIso(),
        });
        await updateMeta(LAST_ERROR_KEY, `Error sincronizando ${item.operationType || item.url}: HTTP ${response.status}`);
        syncState.errorCount += 1;
      }
'''
          if old not in s:
              raise SystemExit("offline queue sync block not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # Render must use production Mercado Pago mode for the commercial deployment.
          p = Path("render.yaml")
          s = p.read_text(encoding="utf-8").replace("      - key: MP_MODE\n        value: sandbox", "      - key: MP_MODE\n        value: production", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile company_billing.py services/mercadopago_service.py services/webhook_service.py
          node --check static/service-worker.js
          grep -Fq 'value: production' render.yaml
          grep -Fq "status: 'needs_attention'" static/service-worker.js
          grep -Fq 'subscription_preapproval:' services/webhook_service.py

      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company_billing.py services/mercadopago_service.py services/webhook_service.py static/service-worker.js render.yaml
          git rm -f .github/workflows/production-hardening.yml
          git commit -m 'fix: production hardening applied'
          git push origin main
