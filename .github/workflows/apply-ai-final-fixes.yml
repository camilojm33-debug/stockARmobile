name: Apply AI final fixes

on:
  push:
    branches:
      - fix/ai-multitool-runtime-20260910

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor == 'camilojm33-debug'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Patch final runtime tests deterministically
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('tests/test_ai_agent_multitool_runtime.py')
          text = p.read_text()
          text, changed = re.subn(
              r'responses = \[_tool_call\("buscar_producto", f"call-\{index\}"\) for index in range\(MAX_TOOL_TURNS\)\]',
              'responses = [_tool_call("buscar_producto", f"call-{index}") for index in range(MAX_TOOL_TURNS + 1)]',
              text,
              count=1,
          )
          if changed != 1:
              raise SystemExit(f'multitool cap fixture patch count={changed}')
          p.write_text(text)

          p = Path('tests/test_ai_subscription_separation.py')
          text = p.read_text()
          marker = 'def test_explicit_tenant_ai_cancel_does_not_modify_standard_subscription(subscription_app, monkeypatch):\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('explicit AI cancel test not found')
          next_def = text.find('\ndef ', start + len(marker))
          if next_def < 0:
              next_def = len(text)
          block = text[start:next_def]
          if 'monkeypatch.setattr(AISubscriptionService, "_get_mp_preapproval"' not in block:
              needle = '    monkeypatch.setattr("services.mercadopago_service.MercadoPagoService.cancel_preapproval", cancel_preapproval)\n'
              if needle not in block:
                  raise SystemExit('explicit AI cancel insertion point not found')
              block = block.replace(
                  needle,
                  needle + '    monkeypatch.setattr(AISubscriptionService, "_get_mp_preapproval", lambda company: {"id": "ai-pre", "status": "pending"})\n',
                  1,
              )
              text = text[:start] + block + text[next_def:]
              p.write_text(text)

          p = Path('tests/test_smoke.py')
          text = p.read_text()
          if 'import wsgi  # noqa: F401\n' not in text:
              text = text.replace('import app as stock_app\n', 'import app as stock_app\nimport wsgi  # noqa: F401\n', 1)
          text = text.replace('        import wsgi  # noqa: F401\n', '', 1)
          text = text.replace('APP_URL = stock_app.app.config["APP_URL"]', 'APP_URL = "http://test.local"', 1)
          fixture_marker = 'def clean_database():\n    stock_app.app.config["TESTING"] = True\n    stock_app.app.config["WTF_CSRF_ENABLED"] = False\n'
          if fixture_marker in text and 'stock_app.app.config["APP_URL"] = APP_URL' not in text:
              text = text.replace(fixture_marker, fixture_marker + '    stock_app.app.config["APP_URL"] = APP_URL\n', 1)
          text = text.replace('/admin/company-settings/billing/payment/{payment_id}/pdf', '/admin/subscription/payments/{payment_id}/pdf')
          p.write_text(text)
          PY

      - name: Verify syntax
        run: |
          python -m py_compile services/ai_agent/orchestrator_v2.py services/ai_agent/providers/gemini.py services/ai_agent/subscription_service.py tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py
          node --check static/service-worker.js

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py

      - name: Commit and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_ai_agent_multitool_runtime.py tests/test_ai_subscription_separation.py tests/test_smoke.py .github/workflows/apply-ai-final-fixes.yml
          git rm .github/workflows/apply-ai-final-fixes.yml
          git commit -m 'fix(ai): finalize multi-tool validation' || exit 0
          git push
