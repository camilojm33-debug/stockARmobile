name: Repair public quote WhatsApp flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: WhatsApp public quote flow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair public quote route, template and WhatsApp URL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Make the public quote page truly public and independent of the
          # authenticated tenant context. Find the existing function by the
          # template it renders, preserving its existing URL decorator.
          path = Path('quotes.py')
          text = path.read_text(encoding='utf-8')
          marker = 'render_template("presupuestos/public_view.html"'
          marker_alt = "render_template('presupuestos/public_view.html'"
          pos = text.find(marker)
          if pos < 0:
              pos = text.find(marker_alt)
          if pos < 0:
              raise SystemExit('No se encontró la ruta pública de presupuestos')

          route_pos = text.rfind('@bp.route(', 0, pos)
          if route_pos < 0:
              raise SystemExit('No se encontró el decorador de la ruta pública')
          next_route = text.find('\n@bp.route(', pos)
          if next_route < 0:
              next_route = len(text)
          block = text[route_pos:next_route]
          route_match = re.search(r'@bp\.route\([^\n]+\)', block)
          fn_match = re.search(r'def\s+(\w+)\s*\([^)]*\)', block)
          if not route_match or not fn_match:
              raise SystemExit('No se pudo identificar la función pública')
          route_decorator = route_match.group(0)
          fn_name = fn_match.group(1)

          replacement = f'''{route_decorator}
          def {fn_name}(token):
              from app import Quote

              quote_id = _quote_id_from_public_token(token)
              if quote_id is None:
                  abort(404)

              quote = (
                  Quote.query
                  .options(selectinload(Quote.items), selectinload(Quote.client))
                  .filter(Quote.id == quote_id)
                  .first()
              )
              if quote is None:
                  abort(404)

              return render_template(
                  "presupuestos/public_view.html",
                  quote=quote,
                  rows=_quote_rows(quote),
                  pdf_url=_build_public_quote_pdf_url(quote.id),
              )


          '''
          text = text[:route_pos] + replacement + text[next_route + 1:]
          path.write_text(text, encoding='utf-8')

          # 2) Use WhatsApp Web explicitly instead of wa.me. This avoids the
          # browser waiting indefinitely for the desktop app/protocol handler.
          wpath = Path('services/whatsapp_share_service.py')
          wtext = wpath.read_text(encoding='utf-8')
          wtext = wtext.replace(
              'return f"https://wa.me/{normalized_phone}?text={text}"',
              'return f"https://web.whatsapp.com/send?phone={normalized_phone}&text={text}"',
          )
          wtext = wtext.replace(
              'return f"https://wa.me/?text={text}"',
              'return f"https://web.whatsapp.com/send?text={text}"',
          )
          wpath.write_text(wtext, encoding='utf-8')

          # 3) Keep the public page independent from base_master, which may
          # depend on authenticated navigation/context. It remains responsive
          # and professional for a customer opening the link from WhatsApp.
          tpath = Path('templates/presupuestos/public_view.html')
          tpath.write_text(r'''<!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Presupuesto {{ quote.number or quote.id }} - StockArmobile</title>
            <style>
              body{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,sans-serif}
              .wrap{max-width:900px;margin:32px auto;padding:0 16px}
              .card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
              .head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
              h1{margin:6px 0;font-size:28px}.muted{color:#687386}
              .btn{display:inline-block;padding:11px 16px;border-radius:9px;text-decoration:none;background:#1769e0;color:#fff}
              .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
              .box{border:1px solid #e1e5eb;border-radius:10px;padding:14px}.label{font-size:13px;color:#687386;margin-bottom:5px}
              table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:12px 8px;border-bottom:1px solid #e8ebef;text-align:left}th:nth-child(n+2),td:nth-child(n+2){text-align:right}
              .totals{max-width:330px;margin:24px 0 0 auto}.total{font-size:20px;font-weight:700;border-top:2px solid #172033;padding-top:12px;margin-top:10px}
              @media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:12px auto}.card{padding:18px}table{font-size:13px}}
            </style>
          </head>
          <body>
            <main class="wrap"><section class="card">
              <div class="head">
                <div><div class="muted">StockArmobile · Presupuesto</div><h1>{{ quote.number or ('P-%06d'|format(quote.id)) }}</h1><div class="muted">{{ quote.date.strftime('%d/%m/%Y %H:%M') if quote.date else '' }}</div></div>
                <a class="btn" href="{{ pdf_url }}" target="_blank" rel="noopener">Ver PDF</a>
              </div>
              <div class="grid">
                <div class="box"><div class="label">Cliente</div><strong>{{ quote.client.name if quote.client else (quote.consumer_name or 'Consumidor final') }}</strong></div>
                <div class="box"><div class="label">Validez</div><strong>{{ quote.expires_at.strftime('%d/%m/%Y') if quote.expires_at else '-' }}</strong></div>
              </div>
              <table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>
                {% for row in rows %}<tr><td>{{ row.description }}</td><td>{{ '%.3g'|format(row.quantity) }}</td><td>${{ '%.2f'|format(row.unit_price) }}</td><td>${{ '%.2f'|format(row.subtotal) }}</td></tr>{% endfor %}
              </tbody></table>
              <div class="totals">
                <div>Subtotal <strong style="float:right">${{ '%.2f'|format(quote.subtotal or 0) }}</strong></div>
                <div>Descuento <strong style="float:right">-${{ '%.2f'|format(quote.discount or 0) }}</strong></div>
                <div>Impuestos <strong style="float:right">${{ '%.2f'|format(quote.tax or 0) }}</strong></div>
                <div class="total">Total <span style="float:right">${{ '%.2f'|format(quote.total_amount or 0) }}</span></div>
              </div>
            </section></main>
          </body></html>
          ''', encoding='utf-8')
          PY

      - name: Validate Python
        run: python -m py_compile quotes.py services/whatsapp_share_service.py

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.py services/whatsapp_share_service.py templates/presupuestos/public_view.html
          git rm .github/workflows/fix-whatsapp-public.yml
          git commit -m 'fix: WhatsApp public quote flow'
          git push origin main
