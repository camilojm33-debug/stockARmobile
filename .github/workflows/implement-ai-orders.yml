name: Implement AI orders center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply AI orders integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wa = Path('whatsapp_agent.py')
          s = wa.read_text(encoding='utf-8')
          s = s.replace(
              'from flask import Blueprint, current_app, jsonify, request',
              'from flask import Blueprint, abort, current_app, jsonify, render_template, request',
              1,
          )
          if 'from flask_login import current_user, login_required' not in s:
              s = s.replace('from sqlalchemy.exc import IntegrityError\n', 'from sqlalchemy.exc import IntegrityError\nfrom flask_login import current_user, login_required\n', 1)

          routes_marker = '@bp.route("/api/whatsapp/webhook", methods=["GET", "POST"])\n'
          if 'def ai_orders():' not in s:
              routes = r'''

def _ai_order_payment(company_id: int, quote_id: int):
    from app import Payment
    prefix = f"flow:ai_order|company_id:{int(company_id)}|quote_id:{int(quote_id)}|"
    return (
        Payment.query.filter(
            Payment.company_id == int(company_id),
            Payment.provider == "mercadopago_ai_order",
            Payment.external_reference.like(prefix + "%"),
        )
        .order_by(Payment.id.desc())
        .first()
    )


def _ai_order_row(company_id: int, quote):
    payment = _ai_order_payment(company_id, quote.id)
    payment_status = str(getattr(payment, "status", "pending") or "pending").lower()
    if getattr(quote, "converted_sale_id", None):
        order_key, order_label, order_badge = "confirmed", "Confirmado", "text-bg-success"
    elif payment_status == "approved":
        order_key, order_label, order_badge = "paid", "Pagado · pendiente de venta", "text-bg-warning"
    elif payment_status in {"pending", "in_process", "authorized", ""}:
        order_key, order_label, order_badge = "pending", "Esperando pago", "text-bg-warning"
    else:
        order_key, order_label, order_badge = "problem", "Incidencia de pago", "text-bg-danger"
    payment_labels = {
        "approved": ("Pagado", "text-bg-success"), "pending": ("Pendiente", "text-bg-warning"),
        "in_process": ("En proceso", "text-bg-info"), "authorized": ("Autorizado", "text-bg-info"),
        "rejected": ("Rechazado", "text-bg-danger"), "cancelled": ("Cancelado", "text-bg-danger"),
        "canceled": ("Cancelado", "text-bg-danger"), "refunded": ("Reembolsado", "text-bg-secondary"),
        "charged_back": ("Contracargo", "text-bg-danger"),
    }
    payment_label, payment_badge = payment_labels.get(payment_status, (payment_status.replace("_", " ").title(), "text-bg-secondary"))
    client = getattr(quote, "client", None)
    return {
        "quote_id": quote.id,
        "number": quote.number or f"P-{quote.id:06d}",
        "customer_name": getattr(client, "name", None) or getattr(quote, "consumer_name", None) or "Consumidor final",
        "customer_phone": getattr(client, "whatsapp", None) or getattr(client, "phone", None) or "",
        "total": float(quote.total_amount or 0), "currency": quote.currency or "ARS",
        "line_count": len(getattr(quote, "items", []) or []), "payment_status": payment_status,
        "payment_label": payment_label, "payment_badge": payment_badge,
        "payment_id": getattr(payment, "payment_id", None) if payment else None,
        "paid_at": getattr(payment, "paid_at", None) if payment else None,
        "order_key": order_key, "order_label": order_label, "order_badge": order_badge,
        "sale_id": quote.converted_sale_id, "created_at": quote.date or quote.created_at,
    }


@bp.get("/pedidos-ia")
@login_required
def ai_orders():
    company_id = getattr(current_user, "company_id", None)
    if not company_id or getattr(current_user, "role", None) not in {"admin", "user"}:
        abort(403)
    from app import Quote
    marker = "Pedido generado por el Vendedor 24 hs de StockARmobile."
    quotes = (Quote.query.filter(Quote.company_id == int(company_id), Quote.observations == marker)
              .order_by(Quote.date.desc(), Quote.id.desc()).limit(100).all())
    all_rows = [_ai_order_row(company_id, quote) for quote in quotes]
    selected_status = (request.args.get("status") or "").strip().lower()
    rows = [row for row in all_rows if not selected_status or row["order_key"] == selected_status]
    summary = {
        "total": len(all_rows),
        "pending": sum(1 for row in all_rows if row["order_key"] == "pending"),
        "paid": sum(1 for row in all_rows if row["payment_status"] == "approved"),
        "confirmed": sum(1 for row in all_rows if row["order_key"] == "confirmed"),
    }
    return render_template("ai_agent/orders.html", orders=rows, summary=summary, selected_status=selected_status)


@bp.get("/pedidos-ia/<int:quote_id>")
@login_required
def ai_order_detail(quote_id: int):
    company_id = getattr(current_user, "company_id", None)
    if not company_id or getattr(current_user, "role", None) not in {"admin", "user"}:
        abort(403)
    from app import Quote
    marker = "Pedido generado por el Vendedor 24 hs de StockARmobile."
    quote = Quote.query.filter_by(id=int(quote_id), company_id=int(company_id), observations=marker).first()
    if quote is None:
        abort(404)
    return render_template("ai_agent/order_detail.html", order=_ai_order_row(company_id, quote), quote=quote, payment=_ai_order_payment(company_id, quote.id))


'''
              if routes_marker not in s:
                  raise SystemExit('whatsapp webhook marker missing')
              s = s.replace(routes_marker, routes + routes_marker, 1)
          wa.write_text(s, encoding='utf-8')

          ns = Path('services/notification_service.py')
          n = ns.read_text(encoding='utf-8')
          if 'def _build_ai_order_notifications()' not in n:
              marker = '\ndef _build_user_notifications():\n'
              helper = r'''

def _build_ai_order_notifications():
    from app import Payment, Quote, get_current_company_id, utcnow
    company_id = get_current_company_id()
    if not company_id:
        return []
    cutoff = utcnow() - timedelta(days=7)
    marker = "Pedido generado por el Vendedor 24 hs de StockARmobile."
    quotes = (Quote.query.filter(Quote.company_id == company_id, Quote.observations == marker, Quote.date >= cutoff)
              .order_by(Quote.date.desc(), Quote.id.desc()).limit(8).all())
    payments = (Payment.query.filter(Payment.company_id == company_id, Payment.provider == "mercadopago_ai_order", Payment.created_at >= cutoff)
                .order_by(Payment.id.desc()).limit(50).all())
    by_quote = {}
    prefix = f"flow:ai_order|company_id:{int(company_id)}|quote_id:"
    for payment in payments:
        ref = str(payment.external_reference or "")
        if not ref.startswith(prefix):
            continue
        qid = ref[len(prefix):].split("|", 1)[0]
        if qid.isdigit() and int(qid) not in by_quote:
            by_quote[int(qid)] = payment
    items = []
    for quote in quotes:
        payment = by_quote.get(quote.id)
        customer = getattr(getattr(quote, "client", None), "name", None) or getattr(quote, "consumer_name", None) or "Consumidor final"
        number = getattr(quote, "number", None) or f"P-{quote.id:06d}"
        total = float(getattr(quote, "total_amount", 0) or 0)
        if getattr(quote, "converted_sale_id", None):
            items.append({"type":"success","title":"Pedido IA confirmado","body":f"{number} de {customer} · ${total:.2f}. Pago aprobado y venta confirmada.","href":f"/pedidos-ia/{quote.id}"})
            continue
        status = str(getattr(payment, "status", "pending") or "pending").lower() if payment else "pending"
        if status == "approved":
            items.append({"type":"warning","title":"Pago aprobado · revisar pedido IA","body":f"{number} de {customer} tiene el pago aprobado, pero todavía no figura como venta confirmada.","href":f"/pedidos-ia/{quote.id}"})
        elif status in {"pending","in_process","authorized"}:
            items.append({"type":"primary","title":"Nuevo pedido IA","body":f"{number} de {customer} · ${total:.2f}. Esperando aprobación de pago.","href":f"/pedidos-ia/{quote.id}"})
        else:
            items.append({"type":"danger","title":"Incidencia en pedido IA","body":f"{number} de {customer} · estado de pago: {status.replace('_',' ')}.","href":f"/pedidos-ia/{quote.id}"})
    return items[:6]

'''
              if marker not in n:
                  raise SystemExit('notification user builder marker missing')
              n = n.replace(marker, helper + marker, 1)
          old = '    items = _build_recent_quote_acceptance_notifications()\n    items.append({"type": "success", "title": "Ventas",'
          new = '    items = _build_ai_order_notifications() + _build_recent_quote_acceptance_notifications()\n    items.append({"type": "success", "title": "Ventas",'
          if old not in n:
              raise SystemExit('notification anchor missing')
          n = n.replace(old, new, 1)
          ns.write_text(n, encoding='utf-8')

          base = Path('templates/base_master.html')
          b = base.read_text(encoding='utf-8')
          marker = '''      <a class="nav-link {% if request.endpoint and request.endpoint.startswith('quotes.') %}active{% endif %}" href="{{ url_for('quotes.index') }}"><i class="bi bi-file-earmark-text"></i><span class="nav-text">Presupuestos</span></a>
'''
          if 'href="{{ url_for(\'whatsapp_agent.ai_orders\') }}"' not in b:
              if marker not in b:
                  raise SystemExit('quotes menu marker missing')
              b = b.replace(marker, marker + '''      <a class="nav-link {% if request.endpoint and request.endpoint == 'whatsapp_agent.ai_orders' %}active{% endif %}" href="{{ url_for('whatsapp_agent.ai_orders') }}"><i class="bi bi-robot"></i><span class="nav-text">Pedidos IA</span></a>
''', 1)
          base.write_text(b, encoding='utf-8')

          import py_compile
          py_compile.compile('whatsapp_agent.py', doraise=True)
          py_compile.compile('services/notification_service.py', doraise=True)
          print('AI orders integration syntax check OK')
          PY
          git diff --check

      - name: Commit and clean one-time hook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp_agent.py services/notification_service.py templates/base_master.html templates/ai_agent/orders.html templates/ai_agent/order_detail.html
          git rm -f AI_ORDERS_TRIGGER.txt .github/workflows/implement-ai-orders.yml
          git diff --cached --check
          git commit -m 'feat: add AI orders center'
          git push origin HEAD:main
