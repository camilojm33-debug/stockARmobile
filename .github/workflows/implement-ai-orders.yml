          (repo / 'templates/ai_agent/order_detail.html').write_text(detail_template, encoding='utf-8')

          ns = repo / 'services/notification_service.py'
          n = ns.read_text(encoding='utf-8')
          marker = '\ndef _build_user_notifications():\n'
          if marker not in n:
              raise SystemExit('notification user builder marker not found')
          if 'def _build_ai_order_notifications()' not in n:
              helper = r'''

def _build_ai_order_notifications():
    """Build tenant notifications for orders created by the 24h AI seller."""
    from app import Payment, Quote, utcnow, get_current_company_id

    company_id = get_current_company_id()
    if not company_id:
        return []
    cutoff = utcnow() - timedelta(days=7)
    ai_marker = "Pedido generado por el Vendedor 24 hs de StockARmobile."
    quotes = (
        Quote.query.filter(
            Quote.company_id == company_id,
            Quote.observations == ai_marker,
            Quote.date >= cutoff,
        )
        .order_by(Quote.date.desc(), Quote.id.desc())
        .limit(8)
        .all()
    )
    if not quotes:
        return []

    payments = (
        Payment.query.filter(
            Payment.company_id == company_id,
            Payment.provider == "mercadopago_ai_order",
            Payment.created_at >= cutoff,
        )
        .order_by(Payment.id.desc())
        .limit(50)
        .all()
    )
    payment_by_quote = {}
    prefix = f"flow:ai_order|company_id:{int(company_id)}|quote_id:"
    for payment in payments:
        reference = str(payment.external_reference or "")
        if not reference.startswith(prefix):
            continue
        tail = reference[len(prefix):]
        quote_part = tail.split("|", 1)[0]
        if quote_part.isdigit() and int(quote_part) not in payment_by_quote:
            payment_by_quote[int(quote_part)] = payment

    items = []
    for quote in quotes:
        payment = payment_by_quote.get(quote.id)
        customer_name = getattr(getattr(quote, "client", None), "name", None) or getattr(quote, "consumer_name", None) or "Consumidor final"
        number = getattr(quote, "number", None) or f"P-{quote.id:06d}"
        total = float(getattr(quote, "total_amount", 0) or 0)
        if getattr(quote, "converted_sale_id", None):
            items.append(
                {
                    "type": "success",
                    "title": "Pedido IA confirmado",
                    "body": f"{number} de {customer_name} · ${total:.2f}. Pago aprobado y venta confirmada.",
                    "href": f"/pedidos-ia/{quote.id}",
                }
            )
            continue
        payment_status = str(getattr(payment, "status", "pending") or "pending").lower() if payment else "pending"
        if payment_status == "approved":
            items.append(
                {
                    "type": "warning",
                    "title": "Pago aprobado · revisar pedido IA",
                    "body": f"{number} de {customer_name} tiene el pago aprobado, pero todavía no figura como venta confirmada.",
                    "href": f"/pedidos-ia/{quote.id}",
                }
            )
        elif payment_status in {"pending", "in_process", "authorized"}:
            items.append(
                {
                    "type": "primary",
                    "title": "Nuevo pedido IA",
                    "body": f"{number} de {customer_name} · ${total:.2f}. Esperando aprobación de pago.",
                    "href": f"/pedidos-ia/{quote.id}",
                }
            )
        else:
            items.append(
                {
                    "type": "danger",
                    "title": "Incidencia en pedido IA",
