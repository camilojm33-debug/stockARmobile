    <div class="col-6 col-xl-3"><div class="card app-card h-100 ai-order-stat ai-order-stat-success"><div class="card-body"><div class="small text-muted">Pagados</div><div class="fs-3 fw-bold">{{ summary.paid }}</div><div class="small text-muted">Pago aprobado</div></div></div></div>
    <div class="col-6 col-xl-3"><div class="card app-card h-100 ai-order-stat ai-order-stat-primary"><div class="card-body"><div class="small text-muted">Confirmados</div><div class="fs-3 fw-bold">{{ summary.confirmed }}</div><div class="small text-muted">Venta creada y stock aplicado</div></div></div></div>
