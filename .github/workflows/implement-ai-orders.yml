name: Implement AI orders center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ hashFiles('AI_ORDERS_TRIGGER.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Implement AI orders center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')

