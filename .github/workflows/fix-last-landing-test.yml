name: One-time last landing test fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[landing-final-test]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stale landing assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_smoke.py')
          s = p.read_text(encoding='utf-8')
          old = 'assert "Pensado para comercios, ferreterías, kioscos y negocios en crecimiento" in html'
          new = 'assert "Comercios con equipo" in html'
          if old not in s:
              raise SystemExit('Expected stale landing assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Last stale landing assertion updated.')
          PY
      - name: Verify
        run: |
          grep -F 'assert "Comercios con equipo" in html' tests/test_smoke.py
      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-last-landing-test.yml
          git add tests/test_smoke.py
          git commit -m 'test: align final landing assertion [landing-final-test]'
          git push
