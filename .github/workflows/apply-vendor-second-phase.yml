name: Apply vendor 24-7 second phase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'chore: finalize vendor second phase')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch vendor agent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

