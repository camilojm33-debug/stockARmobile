name: Repair public quote PDF link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: abrir PDF profesional desde WhatsApp') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix public quote routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('quotes.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'def _build_public_quote_url\(quote_id: int\) -> str:\n'
              r'    token = _public_share_serializer\(\)\.dumps\(\{"quote_id": int\(quote_id\)\}, salt=QUOTE_PUBLIC_TOKEN_SALT\)\n'
              r'    return url_for\("quotes\.quote_public_view", token=token, _external=True\)'
          )
          replacement = (
              'def _build_public_quote_url(quote_id: int) -> str:\n'
              '    token = _public_share_serializer().dumps({"quote_id": int(quote_id)}, salt=QUOTE_PUBLIC_TOKEN_SALT)\n'
              '    # Compartir por WhatsApp debe llevar directamente al PDF profesional.\n'
              '    return url_for("quotes.quote_public_pdf", token=token, _external=True)'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró _build_public_quote_url')

          route_pattern = re.compile(
              r'(def quote_public_view\(token\):\n)'
              r'(.*?)(?=\n\n@bp\.route\("/<int:quote_id>/whatsapp"\))',
              re.S,
          )
          route_match = route_pattern.search(text)
          if not route_match:
              raise SystemExit('No se encontró quote_public_view')
          new_function = (
              'def quote_public_view(token):\n'
              '    return redirect(url_for("quotes.quote_public_pdf", token=token))\n'
          )
          text = text[:route_match.start()] + new_function + text[route_match.end():]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile quotes.py

      - name: Verify public PDF route exists
        run: |
          grep -q '@bp.route("/publico/<token>/pdf")' quotes.py
          grep -q 'def quote_public_pdf(token)' quotes.py
          grep -q 'def _quote_pdf_response' quotes.py

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.py
          git rm .github/workflows/fix-public-quote-pdf.yml
          git commit -m 'fix: abrir PDF profesional desde WhatsApp'
          git push origin main
