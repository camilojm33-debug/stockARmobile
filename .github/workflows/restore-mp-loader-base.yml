name: Restore Mercado Pago loader fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore base template with MP loader fix
        run: |
          git checkout 38cc6fa02fb326d54a91f2d1df3dfb7b7df85e89 -- templates/base_master.html
          if git diff --quiet -- templates/base_master.html; then
            echo 'Base template already contains the Mercado Pago loader fix.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/base_master.html
          git commit -m 'fix: restore Mercado Pago subscription loader handling'
          git push
