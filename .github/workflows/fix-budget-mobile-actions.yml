name: Fix budget builder mobile actions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: add mobile budget actions and hide desktop shortcuts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile actions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('templates/presupuestos/form.html')
          text = path.read_text(encoding='utf-8')

          if 'id="mobileQuoteActions"' in text:
              raise SystemExit('Mobile quote actions already present')

          css_marker = '  /* MOBILE QUOTE BUILDER */'
          if css_marker not in text:
              raise SystemExit('No se encontró el bloque MOBILE QUOTE BUILDER')

          extra_css = r'''

    /* Acciones siempre accesibles desde el teléfono. */
    #mobileQuoteActions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1080;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
      padding: .55rem max(.65rem, env(safe-area-inset-left)) calc(.55rem + env(safe-area-inset-bottom)) max(.65rem, env(safe-area-inset-right));
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(15,23,42,.12);
      box-shadow: 0 -10px 28px rgba(15,23,42,.10);
    }

    #mobileQuoteActions .btn {
      min-height: 48px;
      font-size: .95rem;
      font-weight: 700;
      border-radius: 11px;
    }

    #mobileQuoteActions .mobile-action-more {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: .35rem;
    }

    #mobileQuoteActions .mobile-action-more .btn {
      min-height: 40px;
      font-size: .76rem;
      padding: .25rem .35rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.mobile-quote-page {
      padding-bottom: 120px;
    }

    .mobile-quote-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .4rem;
      margin-bottom: .75rem;
    }

    .mobile-quote-nav .btn {
      min-height: 40px;
      font-size: .78rem;
    }
'''
          text = text.replace(css_marker, css_marker + extra_css, 1)

          old_shortcuts = '''    <div class="small text-muted">\n      Atajos: <strong>F2</strong> buscar, <strong>F3</strong> cliente, <strong>F4</strong> guardar, <strong>F5</strong> PDF, <strong>F6</strong> convertir, <strong>ESC</strong> limpiar, <strong>ENTER</strong> agregar.\n    </div>'''
          if old_shortcuts not in text:
              raise SystemExit('No se encontró el bloque de atajos')
          text = text.replace(old_shortcuts, '''    <div class="small text-muted desktop-quote-shortcuts">\n      Atajos: <strong>F2</strong> buscar, <strong>F3</strong> cliente, <strong>F4</strong> guardar, <strong>F5</strong> PDF, <strong>F6</strong> convertir, <strong>ESC</strong> limpiar, <strong>ENTER</strong> agregar.\n    </div>''', 1)

          builder_marker = '<form method="post" id="quoteForm" novalidate>'
          if builder_marker not in text:
              raise SystemExit('No se encontró quoteForm')

          mobile_nav = r'''<div class="mobile-quote-nav d-md-none" aria-label="Navegación rápida del presupuesto">
      <button type="button" class="btn btn-outline-primary" data-mobile-scroll="#panelCatalog"><i class="bi bi-box-seam me-1"></i>Productos</button>
      <button type="button" class="btn btn-outline-primary" data-mobile-scroll="#panelLines"><i class="bi bi-list-check me-1"></i>Presupuesto</button>
      <button type="button" class="btn btn-outline-primary" data-mobile-scroll="#panelContext"><i class="bi bi-person-lines-fill me-1"></i>Datos</button>
    </div>
    '''
          text = text.replace(builder_marker, builder_marker + '\n' + mobile_nav, 1)

          end_marker = '</form>\n</div>\n{% endblock %}'
          if end_marker not in text:
              raise SystemExit('No se encontró el cierre del formulario')

          mobile_actions = r'''<div id="mobileQuoteActions" class="d-md-none" aria-label="Acciones del presupuesto">
      <button type="button" class="btn btn-primary" id="mobileActionSave"><i class="bi bi-save me-1"></i>Guardar</button>
      <button type="button" class="btn btn-success" id="mobileActionSend"><i class="bi bi-send me-1"></i>Enviar</button>
      <div class="mobile-action-more">
        {% if quote %}
        <button type="button" class="btn btn-outline-danger" id="mobileActionPdf"><i class="bi bi-filetype-pdf"></i> PDF</button>
        <button type="button" class="btn btn-outline-success" id="mobileActionWhatsapp"><i class="bi bi-whatsapp"></i> WhatsApp</button>
        <button type="button" class="btn btn-warning" id="mobileActionConvert"><i class="bi bi-bag-check"></i> Venta</button>
        <button type="button" class="btn btn-outline-secondary" data-mobile-scroll="#panelLines"><i class="bi bi-pencil"></i> Modificar</button>
        {% else %}
        <button type="button" class="btn btn-outline-secondary" data-mobile-scroll="#panelLines"><i class="bi bi-pencil"></i> Modificar</button>
        <button type="button" class="btn btn-outline-secondary" data-mobile-scroll="#panelContext"><i class="bi bi-person"></i> Datos</button>
        <button type="button" class="btn btn-outline-secondary" data-mobile-scroll="#panelCatalog"><i class="bi bi-plus-lg"></i> Agregar</button>
        <button type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-filetype-pdf"></i> PDF</button>
        {% endif %}
      </div>
    </div>
    '''
          text = text.replace(end_marker, '</form>\n' + mobile_actions + '</div>\n{% endblock %}', 1)

          js_marker = "  const draftKey = `quote_draft_${quoteId || 'new'}`;"
          if js_marker not in text:
              raise SystemExit('No se encontró draftKey para insertar JS móvil')

          mobile_js = r'''

  // Controles táctiles: mantienen exactamente la misma lógica de escritorio.
  document.body.classList.add('mobile-quote-page');

  document.querySelectorAll('[data-mobile-scroll]').forEach((button) => {
    button.addEventListener('click', () => {
      const target = document.querySelector(button.dataset.mobileScroll);
      if (target) {
        target.classList.remove('collapsed');
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  document.getElementById('mobileActionSave')?.addEventListener('click', () => {
    document.getElementById('actionSave')?.click();
  });

  document.getElementById('mobileActionSend')?.addEventListener('click', () => {
    document.getElementById('actionSend')?.click();
  });

  document.getElementById('mobileActionPdf')?.addEventListener('click', () => {
    const target = document.querySelector('#panelContext a[href*="quote_pdf"]');
    if (target) window.open(target.href, '_blank', 'noopener');
  });

  document.getElementById('mobileActionWhatsapp')?.addEventListener('click', () => {
    const target = document.querySelector('#panelContext a[href*="share_whatsapp"]');
    if (target) window.location.href = target.href;
  });

  document.getElementById('mobileActionConvert')?.addEventListener('click', () => {
    document.getElementById('actionConvert')?.click();
  });
'''
          text = text.replace(js_marker, js_marker + mobile_js, 1)

          # Hide desktop shortcuts and prevent the mobile fixed bar from covering the last controls.
          mobile_marker = '  @media (max-width: 768px) {'
          if mobile_marker not in text:
              raise SystemExit('No se encontró media query móvil')
          text = text.replace(mobile_marker, mobile_marker + '\n    .desktop-quote-shortcuts { display: none !important; }', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('templates/presupuestos/form.html').read_text(encoding='utf-8')
          for marker in ('mobileQuoteActions','mobileActionSave','mobileActionSend','mobileActionConvert','data-mobile-scroll'):
              assert marker in text, marker
          assert '.desktop-quote-shortcuts { display: none !important; }' in text
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/presupuestos/form.html
          git rm .github/workflows/fix-budget-mobile-actions.yml
          git commit -m 'fix: add mobile budget actions and hide desktop shortcuts'
          git push origin main
