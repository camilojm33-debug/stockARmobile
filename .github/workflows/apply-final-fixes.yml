name: Apply final AI hardening fixes

on:
  push:
    branches:
      - hardening/vendor-24-7-webchat

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and clean up
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          if "chore: apply final AI hardening fixes" in os.environ.get("HEAD_MESSAGE", ""):
              raise SystemExit(0)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "dashboard.py",
              '            metadata={},\n            include_system_prompt=False,\n',
              '            metadata={},\n            include_system_prompt=True,\n',
          )
          replace_once(
              "ai_agents.py",
              '            idempotency_key=str(payload.get("idempotency_key") or uuid.uuid4().hex),\n',
              '            idempotency_key=str(request.headers.get("Idempotency-Key") or payload.get("idempotency_key") or uuid.uuid4().hex),\n',
          )
          replace_once(
              "templates/ai_agents/public_vendor_chat.html",
              '        <div class="status">● Disponible</div>\n',
              '        <div class="status">{% if disabled_reason %}● No disponible{% else %}● Disponible{% endif %}</div>\n',
          )
          report = Path("docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md")
          text = report.read_text(encoding="utf-8")
          line = '- Endurecida la ruta de chat autenticado para incluir siempre el system prompt del agente; el chat público también usa el prompt específico del Vendedor.\n'
          if line not in text:
              report.write_text(text.rstrip() + "\n" + line, encoding="utf-8")
          Path(".github/workflows/apply-final-fixes.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py ai_agents.py templates/ai_agents/public_vendor_chat.html docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md .github/workflows
          git add -u .github/workflows
          git commit -m "chore: apply final AI hardening fixes"
          git push origin HEAD:hardening/vendor-24-7-webchat
