name: Temporary landing validation

on:
  push:
    branches: [landing-refresh-20260911]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install template parser
        run: pip install jinja2
      - name: Validate Jinja template
        run: python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, meta
          text = Path('templates/landing/index.html').read_text(encoding='utf-8')
          Environment().parse(text)
          print('PASS: Jinja template parses successfully')
      - name: Validate CSS asset
        run: python - <<'PY'
          from pathlib import Path
          text = Path('static/assets/css/landing-v3.css').read_text(encoding='utf-8')
          assert text.count('{') == text.count('}'), 'Unbalanced CSS braces'
          print('PASS: CSS braces are balanced')
      - name: Validate existing workflow
        run: python -m compileall -q .
