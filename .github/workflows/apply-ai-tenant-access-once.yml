name: Hide AI provider details from tenants

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch tenant-facing AI errors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # The chat endpoint must never relay provider-specific messages to the browser.
          path = 'dashboard.py'
          source = read(path)
          old = '        return jsonify({"success": False, "error": str(exc)}), exc.status_code'
          new = '''        return jsonify({"success": False, "error": "El servicio de IA no está disponible en este momento. Intentá nuevamente más tarde."}), exc.status_code'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'El servicio de IA no está disponible en este momento.' not in source:
              raise SystemExit('dashboard.py: provider error response not found')
          write(path, source)

          # Provider adapter errors are also neutralized as defense in depth.
          path = 'services/ai_agent/providers/gemini.py'
          source = read(path)
          replacements = {
              'Se agotó la cuota disponible de Gemini para este modelo. Revisá el plan o la facturación de la API de Gemini.': 'El servicio de IA alcanzó temporalmente su límite de uso.',
              'Gemini está saturado temporalmente. Intentá nuevamente en unos segundos.': 'El servicio de IA está temporalmente saturado. Intentá nuevamente en unos segundos.',
              'Gemini no pudo procesar la solicitud.': 'El servicio de IA no pudo procesar la solicitud.',
          }
          changed = False
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new)
                  changed = True
          if not changed and 'El servicio de IA alcanzó temporalmente su límite de uso.' not in source:
              raise SystemExit('gemini.py: provider messages not found')
          write(path, source)

          # The public AI hub gets one final browser-side filter so stale/API error payloads cannot reveal provider names.
          path = 'templates/ai_agents/index.html'
          source = read(path)
          if 'function publicAiError' not in source:
              marker = "  async function ask() {"
              helper = '''  function publicAiError(message) {\n    const text = String(message || "");\n    return /gemini|openai|anthropic|provider|proveedor|cuota|modelo|model|token|billing|factur/i.test(text)\n      ? "El servicio de IA no está disponible en este momento. Intentá nuevamente más tarde."\n      : (text || "No se pudo procesar la consulta.");\n  }\n'''
              if marker not in source:
                  raise SystemExit('ai_agents/index.html: ask marker not found')
              source = source.replace(marker, helper + marker, 1)
              source = source.replace("throw new Error(data.error || 'No se pudo procesar la consulta.');", "throw new Error(publicAiError(data.error || 'No se pudo procesar la consulta.'));" )
          write(path, source)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile dashboard.py services/ai_agent/providers/gemini.py
          grep -q 'El servicio de IA no está disponible en este momento.' dashboard.py
          ! grep -q 'Se agotó la cuota disponible de Gemini' dashboard.py
          ! grep -q 'Gemini no pudo procesar la solicitud.' dashboard.py
          grep -q 'El servicio de IA alcanzó temporalmente su límite de uso.' services/ai_agent/providers/gemini.py
          grep -q 'function publicAiError' templates/ai_agents/index.html
          git diff --check
          echo 'validation ok'

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.py services/ai_agent/providers/gemini.py templates/ai_agents/index.html .github/workflows/apply-ai-tenant-access-once.yml
          git commit -m 'fix: hide AI provider details from tenant chat' || exit 0
          git push origin HEAD:main
