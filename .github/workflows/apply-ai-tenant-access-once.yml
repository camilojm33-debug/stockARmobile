name: Finish AI tenant branding and access

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply AI branding and access policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1. Employee permission + PIN protected administration from Mi Empresa.
          path = 'company_billing.py'
          source = read(path)
          if '("ai_access", "Agentes IA"),' not in source:
              anchor = '("economic_stats", "Puede visualizar estadísticas económicas"),\n]'
              if anchor not in source:
                  raise SystemExit('employee permission list anchor not found')
              source = source.replace(anchor, '("economic_stats", "Puede visualizar estadísticas económicas"),\n    ("ai_access", "Agentes IA"),\n]', 1)
          route = '@bp.route("/company-settings/users/<int:user_id>/permissions", methods=["POST"])\n@company_admin_required\ndef company_settings_user_permissions(user_id):\n'
          if '# AI_PERMISSION_PIN_FINAL' not in source:
              if route not in source:
                  raise SystemExit('employee permission route anchor not found')
              guard = route + '''    company_id = getattr(current_user, "company_id", None)\n    if not company_id or not _is_pin_verified(company_id):\n        flash("Validá el PIN de Mi Empresa para administrar los permisos de empleados.", "warning")\n        return redirect(url_for("company_billing.company_settings", panel="employees"))\n    # AI_PERMISSION_PIN_FINAL\n'''
              source = source.replace(route, guard, 1)
          write(path, source)

          # 2. Hide Agentes IA from employees unless explicitly authorized.
          path = 'templates/base_master.html'
          source = read(path)
          if 'AI_NAV_PERMISSION_FINAL' not in source:
              lines = source.splitlines(True)
              found = False
              for i, line in enumerate(lines):
                  if 'ai_agents.index' in line and 'url_for' in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      link = line.strip()
                      lines[i] = (f'{indent}{{% set _ai_permissions = (current_user.permissions_json or "") %}}\n'
                                  f'{indent}{{% if current_user.is_authenticated and (current_user.role in ["admin", "superadmin"] or \'"ai_access"\' in _ai_permissions) %}}\n'
                                  f'{indent}{link} <!-- AI_NAV_PERMISSION_FINAL -->\n'
                                  f'{indent}{{% endif %}}\n')
                      found = True
                      break
              if not found:
                  raise SystemExit('Agentes IA sidebar link not found')
              source = ''.join(lines)
          write(path, source)

          # 3. Protect all tenant dashboard AI API routes with the same permission.
          path = 'dashboard.py'
          source = read(path)
          if 'from stockarmobile.permissions import can_access_ai' not in source:
              source = source.replace(
                  'from services.ai_agent.usage_service import can_use_ai\n',
                  'from services.ai_agent.usage_service import can_use_ai\nfrom stockarmobile.permissions import can_access_ai\n', 1,
              )
          if '# AI_ACCESS_GUARD_FINAL' not in source:
              anchor = 'bp = Blueprint("dashboard", __name__)\n\n'
              guard = '''bp = Blueprint("dashboard", __name__)\n\n\n@bp.before_request\ndef _ai_access_guard():\n    if request.path.startswith("/dashboard/ai-agent") and not can_access_ai(current_user):\n        return jsonify({"success": False, "error": "Tu usuario no tiene habilitado el acceso a Agentes IA."}), 403\n\n# AI_ACCESS_GUARD_FINAL\n\n'''
              if anchor not in source:
                  raise SystemExit('dashboard blueprint anchor not found')
              source = source.replace(anchor, guard, 1)
          write(path, source)

          # 4. Require the existing Mi Empresa PIN for the AI administration panel and its saves.
          path = 'services/ai_agent/admin.py'
          source = read(path)
          if '# AI_ADMIN_PIN_FINAL' not in source:
              anchor = 'bp = Blueprint("ai_admin", __name__, url_prefix="/dashboard/ai-agent")\n\n'
              helper = '''bp = Blueprint("ai_admin", __name__, url_prefix="/dashboard/ai-agent")\n\n\n@bp.before_request\ndef _require_company_pin():\n    from company_billing import _is_pin_verified\n    company_id = get_current_company_id(current_user)\n    if _is_pin_verified(company_id):\n        return None\n    flash("Validá el PIN de Mi Empresa para gestionar la configuración de IA.", "warning")\n    return redirect(url_for("company_billing.company_settings"))\n\n# AI_ADMIN_PIN_FINAL\n\n'''
              if anchor not in source:
                  raise SystemExit('AI admin blueprint anchor not found')
              source = source.replace(anchor, helper, 1)

          # Preserve hidden WhatsApp settings when the technical fields are not rendered.
          if 'existing_whatsapp = get_whatsapp_connection(company)' not in source:
              anchor = '    configure_whatsapp_connection(\n'
              if anchor not in source:
                  raise SystemExit('WhatsApp save anchor not found')
              source = source.replace(anchor, '    existing_whatsapp = get_whatsapp_connection(company)\n\n    configure_whatsapp_connection(\n', 1)
          replacements = {
              'phone_number_id=(request.form.get("phone_number_id") or "").strip(),': 'phone_number_id=(request.form.get("phone_number_id") or existing_whatsapp.get("phone_number_id") or "").strip(),',
              'business_account_id=(request.form.get("business_account_id") or "").strip(),': 'business_account_id=(request.form.get("business_account_id") or existing_whatsapp.get("business_account_id") or "").strip(),',
              'display_phone_number=(request.form.get("display_phone_number") or "").strip(),': 'display_phone_number=(request.form.get("display_phone_number") or existing_whatsapp.get("display_phone_number") or "").strip(),',
              'enabled=request.form.get("whatsapp_enabled") == "1",': 'enabled=(request.form.get("whatsapp_enabled") == "1") if "whatsapp_enabled" in request.form else bool(existing_whatsapp.get("enabled")),',
              'template_name=(request.form.get("template_name") or "").strip(),': 'template_name=(request.form.get("template_name") or existing_whatsapp.get("template_name") or "").strip(),',
              'template_language=(request.form.get("template_language") or "es_AR").strip(),': 'template_language=(request.form.get("template_language") or existing_whatsapp.get("template_language") or "es_AR").strip(),',
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)

          # Preserve technical model values while exposing only business-facing customization.
          old_cfg = '''        model = (request.form.get(f"{prefix}_model") or "").strip()[:120]\n        if model:\n            config.model = model\n        config.system_prompt = (request.form.get(f"{prefix}_prompt") or "").strip()[:12000]\n        config.language = (request.form.get(f"{prefix}_language") or "es-AR").strip()[:8]\n        config.max_tokens = _safe_int(request.form.get(f"{prefix}_max_tokens"), 700, 128, 4000)\n        config.temperature = _safe_decimal(request.form.get(f"{prefix}_temperature"), Decimal("0.20"))\n'''
          new_cfg = '''        model = (request.form.get(f"{prefix}_model") or "").strip()[:120]\n        if model:\n            config.model = model\n        prompt = request.form.get(f"{prefix}_prompt")\n        if prompt is not None:\n            config.system_prompt = prompt.strip()[:12000]\n        language = request.form.get(f"{prefix}_language")\n        if language is not None:\n            config.language = language.strip()[:8] or "es-AR"\n        max_tokens_raw = request.form.get(f"{prefix}_max_tokens")\n        if max_tokens_raw is not None:\n            config.max_tokens = _safe_int(max_tokens_raw, config.max_tokens or 700, 128, 4000)\n        temperature_raw = request.form.get(f"{prefix}_temperature")\n        if temperature_raw is not None:\n            config.temperature = _safe_decimal(temperature_raw, config.temperature or Decimal("0.20"))\n'''
          if old_cfg in source:
              source = source.replace(old_cfg, new_cfg, 1)
          write(path, source)

          # 5. Tenant-facing AI administration: StockArMobile branding only.
          path = 'templates/ai_agent/admin.html'
          source = read(path)
          if 'AI_BRANDING_FINAL' not in source:
              start = source.find('\n  <div class="row g-3 mb-4">')
              end = source.find('\n\n  <form method="post" action="{{ url_for(\'ai_admin.save\') }}">', start)
              if start == -1 or end == -1:
                  raise SystemExit('AI admin status cards anchors not found')
              replacement = '''\n  <div class="row g-3 mb-4">\n    <div class="col-md-4"><div class="card app-card ai-status-card h-100"><div class="card-body"><div class="ai-status-label">Inteligencia artificial</div><div class="ai-status-value">{{ 'Activa' if ai_enabled else 'Desactivada' }}</div><div class="ai-state {{ 'success' if ai_enabled else 'danger' }} mt-2">{{ 'Lista para trabajar' if ai_enabled else 'Desactivada por la empresa' }}</div></div></div></div>\n    <div class="col-md-4"><div class="card app-card ai-status-card h-100"><div class="card-body"><div class="ai-status-label">Plan IA</div><div class="ai-status-value">{% if prefs.ai_agent.plan_code %}{% for plan in ai_plans %}{% if plan.code == prefs.ai_agent.plan_code %}{{ plan.name }}{% endif %}{% endfor %}{% else %}Sin plan IA{% endif %}</div><div class="small text-muted mt-2">{{ 'Servicio activo para tu comercio.' if prefs.ai_agent.plan_code else 'El plan lo administra Super Admin.' }}</div></div></div></div>\n    <div class="col-md-4"><div class="card app-card ai-status-card {{ whatsapp_state.tone }} h-100"><div class="card-body"><div class="ai-status-label">Canal de atención</div><div class="ai-status-value">{{ whatsapp_state.label }}</div><div class="small text-muted mt-2">Atención integrada para tus clientes.</div></div></div></div>\n  </div>\n<!-- AI_BRANDING_FINAL -->\n'''
              source = source[:start] + replacement + source[end:]

              # The template uses one shared Jinja details block inside the agent loop.
              marker = '<details class="agent-config"><summary>Configurar agente</summary>'
              block_start = source.find(marker)
              if block_start == -1:
                  raise SystemExit('shared technical agent configuration block not found')
              block_end = source.find('</details>', block_start)
              if block_end == -1:
                  raise SystemExit('shared technical agent configuration end not found')
              block_end += len('</details>')
              replacement_block = '''<details class="agent-config"><summary>Personalizar comportamiento</summary><div class="agent-config-body"><div class="row g-3"><div class="col-md-4"><label class="form-label fw-semibold">Idioma</label><input class="form-control" name="{{ prefix }}_language" value="{{ config.language or 'es-AR' }}"></div><div class="col-md-8"><label class="form-label fw-semibold">Instrucciones del comercio</label><textarea class="form-control" rows="4" name="{{ prefix }}_prompt">{{ config.system_prompt or '' }}</textarea></div></div></div></details>'''
              source = source[:block_start] + replacement_block + source[block_end:]

              # Remove technical Meta configuration and WhatsApp credential forms by their exact headings.
              meta_marker = '<details class="mt-3"><summary class="small text-muted">Configuración avanzada de Meta</summary>'
              meta_start = source.find(meta_marker)
              if meta_start != -1:
                  meta_end = source.find('</details>', meta_start)
                  if meta_end == -1:
                      raise SystemExit('Meta details closing tag not found')
                  meta_end += len('</details>')
                  source = source[:meta_start] + source[meta_end:]

              wa_marker = '<details class="agent-config mt-3"><summary>Configuración avanzada</summary>'
              wa_start = source.find(wa_marker)
              if wa_start != -1:
                  wa_end = source.find('</details>', wa_start)
                  if wa_end == -1:
                      raise SystemExit('WhatsApp advanced details closing tag not found')
                  wa_end += len('</details>')
                  source = source[:wa_start] + source[wa_end:]

              source = source.replace('El token se guarda cifrado y nunca vuelve a mostrarse.', 'La conexión se gestiona de forma segura y sus credenciales no se muestran en este panel.', 1)

          forbidden = ['Proveedor de IA', 'provider_label', 'provider_model', 'Phone Number ID', 'Business Account ID', 'Access Token', 'Configuración avanzada de Meta']
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f'provider detail still present in AI admin: {needle}')
          write(path, source)

          print('AI branding and access policy applied')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile company_billing.py dashboard.py services/ai_agent/admin.py services/ai_agent/providers/gemini.py stockarmobile/permissions.py
          grep -q 'El servicio de IA no está disponible en este momento.' dashboard.py
          grep -q 'AI_ACCESS_GUARD_FINAL' dashboard.py
          grep -q 'ai_access' company_billing.py
          grep -q 'AI_PERMISSION_PIN_FINAL' company_billing.py
          grep -q 'AI_NAV_PERMISSION_FINAL' templates/base_master.html
          grep -q 'AI_ADMIN_PIN_FINAL' services/ai_agent/admin.py
          grep -q 'AI_BRANDING_FINAL' templates/ai_agent/admin.html
          ! grep -q 'Proveedor de IA' templates/ai_agent/admin.html
          ! grep -q 'provider_label' templates/ai_agent/admin.html
          ! grep -q 'provider_model' templates/ai_agent/admin.html
          ! grep -q 'Phone Number ID' templates/ai_agent/admin.html
          ! grep -q 'Business Account ID' templates/ai_agent/admin.html
          ! grep -q 'Access Token' templates/ai_agent/admin.html
          ! grep -q 'Configuración avanzada de Meta' templates/ai_agent/admin.html
          git diff --check
          echo 'validation ok'

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: hide AI providers and gate AI by employee permission' || exit 0
          git push origin HEAD:main
