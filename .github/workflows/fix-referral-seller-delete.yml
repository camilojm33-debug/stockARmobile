name: Fix referral seller deletion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch seller deletion safely
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('referrals.py')
          text = path.read_text(encoding='utf-8')

          old = '''    db.session.delete(profile)
    if user.company_id is None and (user.role or "") == "seller":
        NotificationReadState.query.filter_by(user_id=user.id).delete(synchronize_session=False)
        PasswordResetToken.query.filter_by(user_id=user.id).delete(synchronize_session=False)
        PasswordRecoveryRequest.query.filter_by(user_id=user.id).delete(synchronize_session=False)
        PasswordRecoveryRequest.query.filter_by(processed_by_user_id=user.id).update({"processed_by_user_id": None}, synchronize_session=False)
        db.session.delete(user)
    else:
        user.role = "admin" if user.company_id else "user"
    db.session.commit()
    flash("Vendedor eliminado definitivamente.", "success")
    return redirect(url_for("referrals.admin_referrals_sellers_list"))
'''

          new = '''    # En vendedores sin historial se elimina el perfil de referidos, pero se conserva
    # la cuenta User para evitar errores de FK con auditorías, notificaciones u otros
    # registros que puedan apuntar al usuario aunque ya no sea vendedor.
    db.session.delete(profile)
    user.role = "admin" if user.company_id else "user"
    user.active = False

    from app import record_audit
    record_audit(
        action="referral_seller_deleted",
        entity="referral_seller",
        entity_id=seller_id,
        user_id=current_user.id,
        company_id=user.company_id,
        detail=f"Vendedor eliminado del programa de referidos. La cuenta de usuario se conservó sin rol vendedor. username={user.username}.",
        ip_address=request.remote_addr,
    )

    db.session.commit()
    flash("Vendedor eliminado definitivamente del programa de referidos.", "success")
    return redirect(url_for("referrals.admin_referrals_sellers_list"))
'''

          if old not in text:
              raise SystemExit('No se encontró el bloque de eliminación esperado en referrals.py')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-referral-seller-delete.yml
          git add referrals.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: safely delete referral seller profiles"
          git push
