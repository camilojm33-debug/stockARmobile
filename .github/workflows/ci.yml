name: CI

"on":
  push:
    branches: [main, feat/agentes-vendedor-whatsapp-asistente-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check service worker
        run: node --check static/service-worker.js
      - name: Run tests
        run: pytest -q
