name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check single Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(python -m flask db heads)"
          printf '%s\n' "$heads"
          head_count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          test "$head_count" -eq 1

      - name: Check service worker
        run: node --check static/service-worker.js
      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest -q --tb=short > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          echo "$code" > pytest-exit-code.txt
          exit "$code"
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-exit-code.txt
          retention-days: 2
      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
