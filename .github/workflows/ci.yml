name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .

      - name: Security audit
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pip-audit bandit
          set -o pipefail
          pip-audit -r requirements.txt | tee pip-audit.txt
          bandit -r . -x tests,instance,.git,scripts/qa_vendor_public.py,migrations -lll
          bandit -r . -x tests,instance,.git,scripts/qa_vendor_public.py,migrations -ll > bandit.txt 2>&1 || true

      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-diagnostics
          path: |
            pip-audit.txt
            bandit.txt
          retention-days: 7
      - name: Check single Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(python -m flask db heads)"
          printf '%s\n' "$heads"
          head_count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          test "$head_count" -eq 1

      - name: Check service worker
        run: node --check static/service-worker.js
      - name: Check offline manager
        run: node --check static/assets/js/offline-manager-core.js
      - name: Check cart manager
        run: node --check static/assets/js/cart-manager.js
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short | tee pytest-output.txt
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-exit-code.txt
          retention-days: 2

  postgres-backup-restore:
    name: PostgreSQL backup/restore regression tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/stockarmobile_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stockarmobile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stockarmobile_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run PostgreSQL recovery regression tests
        run: pytest -q --tb=short tests/test_backup_recovery_stage.py tests/test_persistent_storage.py tests/test_readiness_endpoint.py
