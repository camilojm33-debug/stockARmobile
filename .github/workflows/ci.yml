name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .

      - name: Security audit
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pip-audit bandit
          pip-audit -r requirements.txt
          bandit -r . -x tests,instance,.git -ll

      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-diagnostics
          path: |
            pip-audit.txt
            bandit.txt
          retention-days: 7
      - name: Check single Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(python -m flask db heads)"
          printf '%s\n' "$heads"
          head_count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          test "$head_count" -eq 1

      - name: Check service worker
        run: node --check static/service-worker.js
      - name: Check cart manager
        run: node --check static/assets/js/cart-manager.js
      - name: Run tests
        id: tests
        shell: bash
        run: pytest -q --tb=short
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-exit-code.txt
          retention-days: 2
