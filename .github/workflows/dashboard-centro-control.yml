name: Dashboard center control

on:
  push:
    branches: [feat/dashboard-centro-control]

permissions:
  contents: write

jobs:
  enhance-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dashboard UX only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/dashboard/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'DASHBOARD_CENTER_CONTROL_V1'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          insert_after = '<div class="app-shell">'
          block = r'''
          <!-- DASHBOARD_CENTER_CONTROL_V1: visual/UX layer only; existing metrics and routes remain untouched. -->
          <style>
            .dashboard-command-center{border:1px solid rgba(15,98,254,.12);border-radius:20px;background:linear-gradient(135deg,rgba(15,98,254,.06),rgba(20,148,91,.045));box-shadow:0 12px 35px rgba(16,24,40,.06)}
            .dcc-actions{display:flex;gap:.65rem;flex-wrap:wrap}.dcc-actions .btn{min-height:44px;font-weight:700}
            .dcc-status{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1rem}.dcc-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .7rem;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(16,24,40,.08);font-size:.8rem;font-weight:700}
            .dcc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.85rem;margin-top:1rem}.dcc-tile{display:block;text-decoration:none;color:inherit;border:1px solid rgba(16,24,40,.08);background:#fff;border-radius:15px;padding:1rem;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}.dcc-tile:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(16,24,40,.08);border-color:rgba(15,98,254,.22);color:inherit}.dcc-tile-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#f1f5fb;margin-bottom:.65rem;font-size:1.05rem}.dcc-tile-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#667085;font-weight:800}.dcc-tile-value{font-size:1.45rem;font-weight:900;margin-top:.15rem}.dcc-tile-meta{font-size:.78rem;color:#667085;margin-top:.2rem}
            .dcc-alerts{margin-top:1rem;display:flex;flex-direction:column;gap:.55rem}.dcc-alert{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem .9rem;border-radius:12px;background:#fff;border:1px solid rgba(16,24,40,.08)}.dcc-alert-main{display:flex;align-items:center;gap:.7rem;min-width:0}.dcc-alert-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff4e5;color:#a15c00;flex:0 0 auto}.dcc-alert-title{font-weight:800;font-size:.9rem}.dcc-alert-text{font-size:.78rem;color:#667085}.dcc-alert-link{font-size:.8rem;font-weight:800;white-space:nowrap;text-decoration:none}
            .dcc-section-label{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:0 0 .75rem}.dcc-section-label h2{font-size:1rem;font-weight:900;margin:0}.dcc-section-label span{font-size:.78rem;color:#667085}
            @media(max-width:991.98px){.dcc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
            @media(max-width:575.98px){.dashboard-command-center{border-radius:15px}.dcc-grid{grid-template-columns:1fr 1fr;gap:.6rem}.dcc-tile{padding:.75rem}.dcc-tile-value{font-size:1.2rem}.dcc-actions .btn{width:100%}.dcc-alert{align-items:flex-start}.dcc-alert-link{align-self:center}.dcc-status{gap:.4rem}.dcc-chip{font-size:.72rem}}
          </style>
          <section class="dashboard-command-center app-card mb-4" aria-label="Centro de control">
            <div class="card-body p-3 p-lg-4">
              <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
                <div class="me-auto">
                  <span class="page-kicker"><i class="bi bi-speedometer2"></i> Centro de control</span>
                  <h2 class="h3 fw-bold mb-1">Todo en orden, desde un solo lugar</h2>
                  <p class="text-muted mb-0">Accesos rápidos y alertas del negocio sin reemplazar tus indicadores actuales.</p>
                </div>
                <div class="dcc-actions">
                  <a href="{{ url_for('sales.index') }}" class="btn btn-primary"><i class="bi bi-cart-plus me-1"></i>Nueva venta</a>
                  {% if company_feature_enabled('quotes_module_enabled') and current_user_has_permission('quotes_view') %}
                  <a href="/presupuestos/" class="btn btn-outline-primary"><i class="bi bi-file-earmark-text me-1"></i>Presupuestos</a>
                  {% endif %}
                </div>
              </div>
              <div class="dcc-status">
                <span class="dcc-chip"><i class="bi bi-wifi"></i> Sistema operativo</span>
                <span class="dcc-chip"><i class="bi bi-safe2"></i> Caja: {{ 'abierta' if cash_stats.open_sessions else 'cerrada' }}</span>
                <span class="dcc-chip"><i class="bi bi-box-seam"></i> Stock bajo: {{ productos_bajo_nivel }}</span>
                {% if quote_stats %}<span class="dcc-chip"><i class="bi bi-file-earmark-text"></i> Presupuestos pendientes: {{ quote_stats.pending }}</span>{% endif %}
              </div>
              <div class="dcc-grid">
                {% if can_view_economic_metrics %}
                <a class="dcc-tile" href="{{ url_for('sales.index') }}"><span class="dcc-tile-icon"><i class="bi bi-cash-stack"></i></span><div class="dcc-tile-title">Ventas hoy</div><div class="dcc-tile-value">${{ "%.2f"|format(ingresos_hoy) }}</div><div class="dcc-tile-meta">{{ ventas_hoy }} operación(es)</div></a>
                <div class="dcc-tile"><span class="dcc-tile-icon"><i class="bi bi-piggy-bank"></i></span><div class="dcc-tile-title">Ganancia hoy</div><div class="dcc-tile-value">${{ "%.2f"|format(ganancia_hoy) }}</div><div class="dcc-tile-meta">Margen {{ "%.1f"|format(rentabilidad) }}%</div></div>
                {% endif %}
                <a class="dcc-tile" href="/productos/"><span class="dcc-tile-icon"><i class="bi bi-exclamation-triangle"></i></span><div class="dcc-tile-title">Stock crítico</div><div class="dcc-tile-value">{{ productos_bajo_nivel }}</div><div class="dcc-tile-meta">{{ stock_agotado }} agotado(s)</div></a>
                <a class="dcc-tile" href="/clientes/"><span class="dcc-tile-icon"><i class="bi bi-people"></i></span><div class="dcc-tile-title">Clientes</div><div class="dcc-tile-value">{{ total_clients }}</div><div class="dcc-tile-meta">{{ clientes_nuevos }} nuevo(s) este mes</div></a>
              </div>
              {% set dashboard_alert_count = (stock_agotado or 0) + (productos_bajo_nivel or 0) + ((quote_stats.pending or 0) if quote_stats else 0) %}
              <div class="dcc-alerts">
                <div class="dcc-section-label"><h2>Atención</h2><span>{{ dashboard_alert_count }} elemento(s) para revisar</span></div>
                {% if stock_agotado %}<div class="dcc-alert"><div class="dcc-alert-main"><span class="dcc-alert-icon"><i class="bi bi-x-octagon"></i></span><div><div class="dcc-alert-title">Hay {{ stock_agotado }} producto(s) agotado(s)</div><div class="dcc-alert-text">Conviene reponerlos antes de la próxima venta.</div></div></div><a class="dcc-alert-link" href="/productos/">Revisar →</a></div>{% endif %}
                {% if productos_bajo_nivel %}<div class="dcc-alert"><div class="dcc-alert-main"><span class="dcc-alert-icon"><i class="bi bi-box-arrow-down"></i></span><div><div class="dcc-alert-title">{{ productos_bajo_nivel }} producto(s) con stock bajo</div><div class="dcc-alert-text">Revisá niveles y prepará una compra.</div></div></div><a class="dcc-alert-link" href="/productos/">Ver stock →</a></div>{% endif %}
                {% if quote_stats and quote_stats.pending %}<div class="dcc-alert"><div class="dcc-alert-main"><span class="dcc-alert-icon"><i class="bi bi-file-earmark-check"></i></span><div><div class="dcc-alert-title">{{ quote_stats.pending }} presupuesto(s) pendientes</div><div class="dcc-alert-text">Revisá respuestas y seguí las oportunidades aceptadas.</div></div></div><a class="dcc-alert-link" href="/presupuestos/">Ver presupuestos →</a></div>{% endif %}
                {% if not dashboard_alert_count %}<div class="dcc-alert"><div class="dcc-alert-main"><span class="dcc-alert-icon" style="background:#eaf9f0;color:#13804a"><i class="bi bi-check2-circle"></i></span><div><div class="dcc-alert-title">No hay alertas importantes</div><div class="dcc-alert-text">Tu negocio está al día.</div></div></div></div>{% endif %}
              </div>
            </div>
          </section>
          '''
          if insert_after not in s:
              raise SystemExit('app-shell marker not found')
          s = s.replace(insert_after, insert_after + '\n' + block, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Python and template file
        run: |
          python -m compileall -q .
          test -s templates/dashboard/index.html

      - name: Commit dashboard enhancement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/dashboard/index.html
          git rm -f .github/workflows/dashboard-centro-control.yml
          git commit -m 'feat: dashboard center control'
          git push origin HEAD:feat/dashboard-centro-control
