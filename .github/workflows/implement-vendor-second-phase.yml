        return f"Perfecto. Tu pedido *{result['quote_number']}* suma *${result['total']:.2f} ARS*.\n\nPagalo acá: {result['payment_url']}\n\nUna vez aprobado el pago, StockARmobile confirma la venta y descuenta el stock automáticamente."
    return None
'''
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 4) After Mercado Pago confirms an AI order, inform the customer on WhatsApp.
          path = Path('services/webhook_service.py')
          text = path.read_text(encoding='utf-8')
          marker = '                event_row.status = result.get("status", "processed")\n                db_session.add(event_row)\n                return result\n'
          if 'AI_ORDER_CUSTOMER_NOTIFY' not in text:
              inject = r'''                event_row.status = result.get("status", "processed")
                db_session.add(event_row)
                # AI_ORDER_CUSTOMER_NOTIFY: customer confirmation/recovery message is best-effort.
                if flow == "ai_order":
                    try:
                        from stockarmobile.models.conversations import Conversation
                        from services.ai_agent.whatsapp_service import WhatsAppService
                        from services.ai_agent.vendor_order_service import _metadata
                        conversation_id = int(ref_parts.get("conversation_id") or 0) if str(ref_parts.get("conversation_id") or "").isdigit() else 0
                        if conversation_id:
                            conversation = Conversation.query.filter_by(id=conversation_id, company_id=company_id).first()
                            if conversation is not None:
                                state = _metadata(conversation)
                                recipient = str(state.get("customer_phone") or conversation.external_conversation_id or "").strip()
                                if recipient:
                                    if payment_status == "approved":
                                        body = f"✅ Pago recibido. Tu pedido {result.get('quote_number') or quote_id} fue confirmado correctamente por ${float(result.get('total') or 0):.2f} ARS. Gracias por tu compra."
                                    elif payment_status in {"rejected", "cancelled", "canceled"}:
                                        body = f"⚠️ El pago de tu pedido {result.get('quote_number') or quote_id} no fue aprobado. Si querés volver a intentarlo, escribime *reintentar pago*."
                                    else:
                                        body = "Tu pedido sigue pendiente de pago. Cuando quieras, podés pedirme nuevamente el link de pago."
                                    WhatsAppService.send_text(conversation.company, to=recipient, body=body)
                    except Exception:
                        # Never fail payment processing because an outbound customer message failed.
                        pass
                return result
'''
              if marker not in text:
                  raise SystemExit('webhook AI order return marker not found')
              text = text.replace(marker, inject, 1)
          path.write_text(text, encoding='utf-8')

          # 5) Add a small customer-facing section to the vendor prompt docs without changing public UI.
