name: Implement business value dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-business-value-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dashboard integration
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('services/dashboard_service.py')
          text = dashboard.read_text(encoding='utf-8')
          import_line = 'from services.business_value_dashboard_service import build_business_value_metrics\n'
          anchor = 'from stockarmobile.helpers.dates import local_day_bounds_utc_naive, local_month_start_utc_naive, local_today\n'
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line)
          call = '    business_value = build_business_value_metrics(company=company, can_view_economic_metrics=can_view_economic_metrics)\n'
          marker = '    can_view_economic_metrics = _can_view_economic_metrics()\n'
          if call not in text:
              text = text.replace(marker, marker + '\n' + call)
          return_marker = '        "cash_stats": cash_stats, "invoice_access": invoice_access,\n'
          if '"business_value": business_value' not in text:
              text = text.replace(return_marker, return_marker + '        "business_value": business_value,\n')
          dashboard.write_text(text, encoding='utf-8')

          template = Path('templates/dashboard/index.html')
          html = template.read_text(encoding='utf-8')
          section_marker = '  <!-- BUSINESS_VALUE_DASHBOARD_V1 -->'
          if section_marker not in html:
              section = r'''  <!-- BUSINESS_VALUE_DASHBOARD_V1 -->
  <style>
    .bvd{margin-bottom:1.5rem;border:1px solid rgba(15,98,254,.14);border-radius:20px;background:linear-gradient(135deg,rgba(15,98,254,.055),rgba(20,148,91,.045));box-shadow:0 12px 35px rgba(16,24,40,.06)}
    .bvd-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.75rem}.bvd-card{display:block;padding:1rem;border:1px solid rgba(16,24,40,.08);border-radius:15px;background:#fff;color:inherit;text-decoration:none}.bvd-card:hover{color:inherit;box-shadow:0 10px 24px rgba(16,24,40,.08);transform:translateY(-1px)}.bvd-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#f1f5fb;margin-bottom:.55rem}.bvd-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.035em;color:#667085}.bvd-value{font-size:1.35rem;font-weight:900;margin-top:.15rem}.bvd-meta{font-size:.74rem;color:#667085;margin-top:.15rem}.bvd-opps{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(16,24,40,.08)}.bvd-opp{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem .8rem;margin-top:.45rem;border:1px solid rgba(16,24,40,.08);border-radius:12px;background:#fff}.bvd-opp-main{display:flex;align-items:center;gap:.65rem;min-width:0}.bvd-opp-icon{display:grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:#eef4ff}.bvd-opp-title{font-size:.84rem;font-weight:800}.bvd-opp-text{font-size:.73rem;color:#667085}.bvd-opp a{font-size:.76rem;font-weight:800;white-space:nowrap;text-decoration:none}
    [data-bs-theme="dark"] .bvd{background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(20,148,91,.10));border-color:rgba(226,232,240,.12)}[data-bs-theme="dark"] .bvd-card,[data-bs-theme="dark"] .bvd-opp{background:rgba(15,23,42,.72);border-color:rgba(226,232,240,.12);color:#edf4ff}[data-bs-theme="dark"] .bvd-icon{background:#101a2b}[data-bs-theme="dark"] .bvd-label,[data-bs-theme="dark"] .bvd-meta,[data-bs-theme="dark"] .bvd-opp-text{color:#b7c4d6}
    @media(max-width:1199.98px){.bvd-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:575.98px){.bvd{border-radius:15px}.bvd-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}.bvd-card{padding:.72rem}.bvd-value{font-size:1.08rem}.bvd-opp{align-items:flex-start}.bvd-opp a{align-self:center}}
  </style>
  <section class="bvd app-card" aria-label="Valor del negocio">
    <div class="card-body p-3 p-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
        <div><span class="page-kicker"><i class="bi bi-stars"></i> Valor del negocio</span><h2 class="h3 fw-bold mb-1">Lo importante de tu negocio, en un vistazo</h2><p class="text-muted mb-0">Métricas y oportunidades construidas con los datos reales de tu comercio.</p></div>
        <span class="badge text-bg-primary align-self-start">{{ business_value.opportunities|length }} oportunidad(es)</span>
      </div>
      <div class="bvd-grid mt-3">
        {% if can_view_economic_metrics %}<a class="bvd-card" href="/ventas/"><span class="bvd-icon"><i class="bi bi-cash-stack"></i></span><div class="bvd-label">Ventas este mes</div><div class="bvd-value">${{ "%.2f"|format(business_value.sales_month or 0) }}</div><div class="bvd-meta">{% if business_value.sales_change_pct is not none %}{{ "%+.1f"|format(business_value.sales_change_pct) }}% vs período anterior{% else %}Sin período comparable{% endif %}</div></a>{% else %}<div class="bvd-card"><span class="bvd-icon"><i class="bi bi-lock"></i></span><div class="bvd-label">Ventas este mes</div><div class="bvd-value">Restringido</div><div class="bvd-meta">Visible al usuario autorizado</div></div>{% endif %}
        <a class="bvd-card" href="/productos/"><span class="bvd-icon"><i class="bi bi-box-seam"></i></span><div class="bvd-label">Stock crítico</div><div class="bvd-value">{{ business_value.critical_stock }}</div><div class="bvd-meta">Productos para revisar</div></a>
        <a class="bvd-card" href="/clientes/"><span class="bvd-icon"><i class="bi bi-person-heart"></i></span><div class="bvd-label">Clientes recuperables</div><div class="bvd-value">{{ business_value.recoverable_clients }}</div><div class="bvd-meta">60+ días sin comprar</div></a>
        <a class="bvd-card" href="/presupuestos/"><span class="bvd-icon"><i class="bi bi-cart-check"></i></span><div class="bvd-label">Pedidos pendientes</div><div class="bvd-value">{{ business_value.pending_orders }}</div><div class="bvd-meta">{% if can_view_economic_metrics %}${{ "%.2f"|format(business_value.pending_orders_amount or 0) }} en juego{% else %}Revisar pendientes{% endif %}</div></a>
        {% if can_view_economic_metrics %}<a class="bvd-card" href="{{ url_for('dashboard.index') }}#business-value-ai"><span class="bvd-icon"><i class="bi bi-robot"></i></span><div class="bvd-label">Ventas generadas por IA</div><div class="bvd-value">${{ "%.2f"|format(business_value.ai_sales_amount or 0) }}</div><div class="bvd-meta">{{ business_value.ai_sales_count or 0 }} venta(s) atribuidas</div></a><a class="bvd-card" href="{{ url_for('dashboard.index') }}#business-value-ai"><span class="bvd-icon"><i class="bi bi-arrow-counterclockwise"></i></span><div class="bvd-label">Dinero recuperado</div><div class="bvd-value">${{ "%.2f"|format(business_value.recovered_amount or 0) }}</div><div class="bvd-meta">{{ business_value.recovered_sales_count or 0 }} recuperación(es) por IA</div></a>{% else %}<div class="bvd-card"><span class="bvd-icon"><i class="bi bi-robot"></i></span><div class="bvd-label">Ventas generadas por IA</div><div class="bvd-value">Restringido</div><div class="bvd-meta">Métrica económica</div></div><div class="bvd-card"><span class="bvd-icon"><i class="bi bi-arrow-counterclockwise"></i></span><div class="bvd-label">Dinero recuperado</div><div class="bvd-value">Restringido</div><div class="bvd-meta">Métrica económica</div></div>{% endif %}
      </div>
      <div class="bvd-opps" id="business-value-ai"><div class="d-flex justify-content-between align-items-center gap-2"><strong><i class="bi bi-lightbulb me-1"></i> Oportunidades detectadas</strong><span class="small text-muted">Basadas en datos reales</span></div>
      {% for opportunity in business_value.opportunities %}<div class="bvd-opp"><div class="bvd-opp-main"><span class="bvd-opp-icon"><i class="bi {{ opportunity.icon }}"></i></span><div><div class="bvd-opp-title">{{ opportunity.title }}</div><div class="bvd-opp-text">{{ opportunity.text }}</div></div></div><a href="{{ opportunity.url }}">{{ opportunity.action }} →</a></div>{% else %}<div class="bvd-opp"><div class="bvd-opp-main"><span class="bvd-opp-icon"><i class="bi bi-check2-circle"></i></span><div><div class="bvd-opp-title">No detectamos oportunidades urgentes</div><div class="bvd-opp-text">El negocio no tiene alertas comerciales prioritarias con los datos actuales.</div></div></div></div>{% endfor %}
      </div>
    </div>
  </section>
'''
              html = html.replace('  <!-- DASHBOARD_CENTER_CONTROL_V4 -->', section + '  <!-- DASHBOARD_CENTER_CONTROL_V4 -->', 1)
          template.write_text(html, encoding='utf-8')

          vendor = Path('services/ai_agent/vendor_order_service.py')
          v = vendor.read_text(encoding='utf-8')
          old = '        app_db.session.add(sale)\n'
          new = '''        ai_metadata = {"origin": "ai_vendor", "ai_agent": "vendedor", "quote_id": int(quote.id)}\n        conversation_match = re.search(r"(?:^|\\|)conversation_id:(\\d+)(?:\\||$)", external_reference)\n        if conversation_match:\n            conversation_id = int(conversation_match.group(1))\n            ai_metadata["conversation_id"] = conversation_id\n            from stockarmobile.models.conversations import Conversation\n            conversation = Conversation.query.filter_by(id=conversation_id, company_id=company_id).first()\n            if conversation is not None:\n                raw_metadata = conversation.metadata_json or {}\n                try:\n                    conversation_metadata = raw_metadata if isinstance(raw_metadata, dict) else json.loads(raw_metadata)\n                except (TypeError, ValueError):\n                    conversation_metadata = {}\n                outbox = conversation_metadata.get("ai_outbox") if isinstance(conversation_metadata, dict) else []\n                ai_metadata["ai_recovered"] = any(\n                    isinstance(item, dict) and item.get("status") == "sent"\n                    for item in (outbox if isinstance(outbox, list) else [])\n                )\n        sale.metadata_json = json.dumps(ai_metadata, ensure_ascii=False)\n        app_db.session.add(sale)\n'''
          if old in v and 'ai_metadata = {"origin": "ai_vendor"' not in v:
              v = v.replace(old, new, 1)
          vendor.write_text(v, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile services/business_value_dashboard_service.py services/dashboard_service.py services/ai_agent/vendor_order_service.py

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/business_value_dashboard_service.py services/dashboard_service.py services/ai_agent/vendor_order_service.py templates/dashboard/index.html
          git rm .github/workflows/implement-business-value-dashboard.yml
          git commit -m "feat: add business value dashboard" || exit 0
          git push
