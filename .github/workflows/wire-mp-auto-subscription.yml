name: Wire Mercado Pago automatic subscription

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # company_billing.py
          p = Path('company_billing.py')
          s = p.read_text(encoding='utf-8')
          marker = '@bp.route("/subscription/change", methods=["POST"])\n'
          route = '''@bp.route("/subscription/mercadopago/create", methods=["POST"])\n@company_member_required\ndef create_mercadopago_subscription():\n    from app import Company, Subscription, db\n    from services.mercadopago_subscription_service import MercadoPagoSubscriptionService\n\n    company_id = getattr(current_user, "company_id", None)\n    company = Company.query.filter_by(id=company_id).first_or_404()\n    plan_id = request.form.get("plan_id", type=int)\n    plan = PlanService.get_plan(plan_id=plan_id) if plan_id else None\n    subscription = SubscriptionService.active_subscription_for_company(company.id)\n    if plan is None:\n        plan = getattr(subscription, "plan", None) if subscription else None\n    if plan is None:\n        flash("Seleccioná un plan antes de activar la suscripción automática.", "warning")\n        return redirect(url_for("company_billing.subscription_portal"))\n\n    try:\n        if subscription is None or subscription.plan_id != plan.id:\n            result = SubscriptionService.run_command(db.session, SubscriptionService.ChangePlanCommand(\n                company_id=company.id, plan_id=plan.id, actor_user_id=current_user.id,\n                actor_role=getattr(current_user, "role", None), origin="mercadopago_subscription",\n                ip_address=request.remote_addr, idempotency_key=f"mp-auto-plan:{company.id}:{plan.id}:{current_user.id}"\n            ))\n            subscription = db.session.get(Subscription, result.subscription_id)\n        if subscription is None:\n            raise RuntimeError("No se pudo obtener la suscripción de StockArMobile.")\n\n        payer_email = (getattr(current_user, "email", None) or getattr(company, "contact_email", None) or "").strip()\n        response = MercadoPagoSubscriptionService.create(\n            db_session=db.session, company=company, subscription=subscription, plan=plan,\n            payer_email=payer_email, notification_url=load_billing_config().notification_url,\n            back_url=load_billing_config().success_url,\n        )\n        db.session.commit()\n        checkout_url = response.get("init_point")\n        if not checkout_url:\n            raise RuntimeError("Mercado Pago no devolvió el enlace de autorización.")\n        return redirect(checkout_url)\n    except Exception as exc:\n        db.session.rollback()\n        current_app.logger.exception("Error creando suscripción automática Mercado Pago: %s", exc)\n        flash("No se pudo iniciar la suscripción automática de Mercado Pago.", "danger")\n        return redirect(url_for("company_billing.subscription_portal"))\n\n\n'''
          if 'def create_mercadopago_subscription()' not in s:
              if marker not in s: raise SystemExit('company_billing marker not found')
              s = s.replace(marker, route + marker, 1)

          old_cancel = '''    BillingService.cancel_subscription(db.session, subscription=subscription, user_id=current_user.id)\n    record_audit(action="subscription_cancel", entity="subscription", entity_id=subscription.id, detail="Cancelacion de suscripcion solicitada")\n    db.session.commit()\n    flash("La suscripción se cancelará al finalizar el período actual.", "success")\n'''
          new_cancel = '''    metadata = SubscriptionService._metadata_dict(subscription)\n    preapproval_id = str(metadata.get("mercadopago_preapproval_id") or "").strip()\n    try:\n        if preapproval_id:\n            from services.mercadopago_service import MercadoPagoService\n            MercadoPagoService().cancel_preapproval(preapproval_id)\n        BillingService.cancel_subscription(db.session, subscription=subscription, user_id=current_user.id)\n        record_audit(action="subscription_cancel", entity="subscription", entity_id=subscription.id, detail="Cancelacion de suscripcion solicitada" + (" en Mercado Pago" if preapproval_id else ""))\n        db.session.commit()\n        flash("Suscripción cancelada en Mercado Pago." if preapproval_id else "La suscripción se cancelará al finalizar el período actual.", "success")\n    except Exception:\n        db.session.rollback()\n        current_app.logger.exception("Error cancelando suscripción Mercado Pago")\n        flash("No se pudo cancelar la suscripción automática en Mercado Pago.", "danger")\n'''
          if old_cancel in s: s = s.replace(old_cancel, new_cancel, 1)

          p.write_text(s, encoding='utf-8')

          # Portal context.
          p = Path('company_billing.py')
          s = p.read_text(encoding='utf-8')
          marker = '    selected_plan_id = request.args.get("selected_plan_id", type=int)\n'
          if 'mp_auto_active = bool(' not in s:
              if marker not in s: raise SystemExit('portal marker not found')
              ins = '''    subscription_metadata = SubscriptionService._metadata_dict(subscription) if subscription else {}\n    mp_auto_active = bool(subscription_metadata.get("mercadopago_preapproval_id") and str(subscription_metadata.get("mercadopago_status") or "").lower() == "authorized" and bool(getattr(subscription, "auto_renew", False)))\n'''
              s = s.replace(marker, ins + marker, 1)
          if 'mp_auto_active=mp_auto_active' not in s:
              marker2 = '        selected_plan=selected_plan,\n'
              if marker2 not in s: raise SystemExit('render marker not found')
              s = s.replace(marker2, marker2 + '        mp_auto_active=mp_auto_active,\n', 1)
          p.write_text(s, encoding='utf-8')

          # Template.
          p = Path('templates/company_billing/portal.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("            {% set mp_meta = subscription and SubscriptionService._metadata_dict(subscription) or {} %}\n            {% if mp_meta.get('mercadopago_preapproval_id') and mp_meta.get('mercadopago_status') == 'authorized' %}", "            {% if mp_auto_active %}", 1)
          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile company_billing.py services/mercadopago_service.py services/mercadopago_subscription_service.py services/webhook_service.py

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company_billing.py templates/company_billing/portal.html services/mercadopago_service.py services/mercadopago_subscription_service.py services/webhook_service.py
          git rm .github/workflows/wire-mp-auto-subscription.yml
          git commit -m 'feat: wire Mercado Pago automatic subscriptions [skip ci]'
          git push origin main
