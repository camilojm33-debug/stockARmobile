name: Polish Mi Empresa UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          settings = Path('templates/company_billing/settings.html')
          s = settings.read_text(encoding='utf-8')

          optional_replacements = [
              (
                  'Panel de administración por módulos y accesos rápidos.',
                  'Configurá y administrá todos los aspectos de tu negocio desde un solo lugar.',
              ),
              (
                  "{'endpoint': 'ai_admin.index', 'title': 'Agentes IA', 'icon': 'bi-robot', 'tone': 'primary', 'description': 'Vendedor 24 hs y asistente empresarial.'}",
                  "{'endpoint': 'ai_admin.index', 'title': 'IA para tu negocio', 'icon': 'bi-robot', 'tone': 'primary', 'description': 'Vendedor IA: atiende clientes y prepara presupuestos. Asistente IA: consulta ventas, stock, productos y clientes.'}",
          ]
          for old, new in optional_replacements:
              if old in s:
                  s = s.replace(old, new, 1)

          old_admin_grid = '      <div class="row g-3 company-module-grid">'
          new_admin_grid = '      <div class="company-module-section-label mb-2">Administración de la empresa</div>\n      <div class="row g-3 company-module-grid">'
          if 'Administración de la empresa</div>' not in s and old_admin_grid in s:
              s = s.replace(old_admin_grid, new_admin_grid, 1)

          old_tile_col = '        <div class="col-sm-6 col-xl-4">\n          <a class="card app-card company-module-card{% if tile.endpoint == \'ai_admin.index\' %} ai-company-module-card{% endif %}'
          
          new_tile_col = '        {% if tile.endpoint == \'ai_admin.index\' %}<div class="col-12 col-xl-6 mt-2">\n          <div class="company-module-section-label mb-2">IA para tu negocio</div>\n        {% else %}<div class="col-sm-6 col-xl-4">{% endif %}\n          <a class="card app-card company-module-card{% if tile.endpoint == \'ai_admin.index\' %} ai-company-module-card{% endif %}'
          
          if old_tile_col in s and 'company-module-section-label mb-2">IA para tu negocio' not in s:
              s = s.replace(old_tile_col, new_tile_col, 1)

          if '<span class="company-module-badge"><i class="bi bi-stars"></i> Ventas + consultas de negocio</span>' not in s:
              marker = '              <div class="company-module-description">{{ tile.description }}</div>\n'
              badge = '              <div class="company-module-description">{{ tile.description }}</div>\n              {% if tile.endpoint == \'ai_admin.index\' %}<span class="company-module-badge"><i class="bi bi-stars"></i> Ventas + consultas de negocio</span>{% endif %}\n'
              if marker in s:
                  s = s.replace(marker, badge, 1)

          css_marker = '  .company-module-grid { margin-top: .25rem; }'
          css_rules = '''  .company-module-section-label {\n    display: flex;\n    align-items: center;\n    gap: .7rem;\n    margin-top: .35rem;\n    color: #64748b;\n    font-size: .72rem;\n    font-weight: 900;\n    letter-spacing: .08em;\n    text-transform: uppercase;\n  }\n  .company-module-section-label::after {\n    content: "";\n    flex: 1;\n    height: 1px;\n    background: var(--app-line);\n  }\n'''
          if '.company-module-section-label {' not in s and css_marker in s:
              s = s.replace(css_marker, css_rules + css_marker, 1)

          settings.write_text(s, encoding='utf-8')

          base = Path('templates/base_master.html')
          b = base.read_text(encoding='utf-8')
          if '<span class="nav-text">Agentes IA</span>' in b:
              b = b.replace('<span class="nav-text">Agentes IA</span>', '<span class="nav-text">IA para tu negocio</span>', 1)
          base.write_text(b, encoding='utf-8')

          # Return CI to the repository's normal workflow after this one-time patch.
          Path('.github/workflows/ci.yml').write_text('''name: CI\n\n"on":\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    env:\n      PYTHONPATH: .\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Install dependencies\n        run: pip install -r requirements.txt\n      - name: Compile Python\n        run: python -m compileall -q .\n      - name: Check service worker\n        run: node --check static/service-worker.js\n      - name: Run tests\n        run: pytest -q\n''', encoding='utf-8')
          PY
          git diff --check

      - name: Commit changes and clean temporary hooks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/company_billing/settings.html templates/base_master.html .github/workflows/ci.yml
          git rm -f .github/workflows/polish-company-settings-ux.yml UX_TRIGGER.txt
          git diff --cached --check
          git commit -m 'chore: polish Mi Empresa UX'
          git push origin HEAD:main
