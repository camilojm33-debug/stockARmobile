name: One-time landing test refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[landing-tests-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align landing regression tests with current UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_smoke.py')
          s = p.read_text(encoding='utf-8')

          for obsolete in [
              '        "Sistema de gestión para comercios: stock, ventas y caja en un solo lugar",\n',
              '        "Gana dinero recomendando StockArmobile",\n',
              '        "Comisión configurada",\n',
              '        "Prueba StockArmobile GRATIS",\n',
              '        "Sin tarjeta de crédito",\n',
              '        "Ya sos cliente? Iniciar sesion y activar Referidos",\n',
              '        "No sos cliente? Crear cuenta de vendedor",\n',
          ]:
              s = s.replace(obsolete, '', 1)

          marker = '    ]:\n        assert value in landing_html\n\n    client.post("/auth/login", data={"username": "empresa_admin", "password": "admin123"})'
          replacement = '    ]:\n        assert value in landing_html\n    assert "Tu negocio más ordenado. Tus ventas más inteligentes." in landing_html\n    assert "Sumá inteligencia artificial a tu negocio" in landing_html\n    assert "Vendedor IA" in landing_html\n\n    client.post("/auth/login", data={"username": "empresa_admin", "password": "admin123"})'
          if marker not in s:
              raise SystemExit('Landing catalog assertion marker not found')
          s = s.replace(marker, replacement, 1)

          old_seo = ('    assert html.count("<h1") == 1\n'
                     '    assert "Sistema de gestión para comercios: stock, ventas y caja en un solo lugar" in html\n'
                     '    assert (\n'
                     '        "Controlá tu negocio desde la PC o el celular: ventas, stock, clientes, caja, QR, etiquetas y reportes "\n'
                     '        "en una sola plataforma pensada para comercios argentinos." in html\n'
                     '    )\n')
          new_seo = ('    assert html.count("<h1") == 1\n'
                     '    assert "Tu negocio más ordenado. Tus ventas más inteligentes." in html\n'
                     '    assert "Sumá inteligencia artificial a tu negocio" in html\n'
                     '    assert "Vendedor IA" in html\n')
          if old_seo not in s:
              raise SystemExit('Landing SEO assertion block not found')
          s = s.replace(old_seo, new_seo, 1)

          referral_cta = ('    assert "Ya sos cliente? Iniciar sesion y activar Referidos" in html\n'
                          '    assert "No sos cliente? Crear cuenta de vendedor" in html\n')
          if referral_cta not in s:
              raise SystemExit('Referral CTA assertions not found')
          s = s.replace(referral_cta, '', 1)

          p.write_text(s, encoding='utf-8')
          print('Landing regression tests refreshed for current copy and agent UX.')
          PY
      - name: Verify refreshed assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('tests/test_smoke.py').read_text(encoding='utf-8')
          required = [
              'Tu negocio más ordenado. Tus ventas más inteligentes.',
              'Sumá inteligencia artificial a tu negocio',
              'Vendedor IA',
          ]
          for fragment in required:
              assert fragment in text, fragment
          print('Landing test refresh: PASS')
          PY
      - name: Remove one-time workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-landing-tests.yml
          git add tests/test_smoke.py
          git commit -m 'test: align landing regressions with current copy [landing-tests-refresh]'
          git push
