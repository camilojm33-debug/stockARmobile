name: Finalize StockArMobile hardening branch

on:
  push:
    branches:
      - hardening/vendor-24-7-webchat

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize source hardening
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          head_message = os.environ.get("HEAD_MESSAGE", "")
          if "chore: harden vendor 24/7 webchat" in head_message:
              print("Final hardening commit already present.")
              raise SystemExit(0)

          p = Path("ai_agents.py")
          text = p.read_text(encoding="utf-8")
          old = '@bp.post("/campanas/<int:campaign_id>/edit")\n@tenant_required\ndef campaign_edit(campaign_id):\n'
          new = '@bp.post("/campanas/<int:campaign_id>/edit")\n@company_admin_required\ndef campaign_edit(campaign_id):\n'
          if text.count(old) != 1:
              raise SystemExit(f"campaign_edit decorator pattern count={text.count(old)}")
          p.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_vendor_webchat_security.py")
          test_path.write_text('''import app as stock_app\n\nfrom ai_agents import _decode_public_vendor_token, _public_vendor_token\n\n\ndef test_public_vendor_token_is_signed_and_company_scoped():\n    with stock_app.app.app_context():\n        token = _public_vendor_token(12345)\n        assert _decode_public_vendor_token(token) == 12345\n        assert _decode_public_vendor_token(token + "tampered") is None\n        other = _public_vendor_token(54321)\n        assert _decode_public_vendor_token(other) == 54321\n        assert _decode_public_vendor_token(other) != 12345\n''', encoding="utf-8")

          report = Path("docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md")
          current = report.read_text(encoding="utf-8") if report.exists() else ""
          extra = "\n- Corrección de autorización: editar campañas IA queda reservado a administradores de la empresa; la transición ya estaba protegida por `company_admin_required`.\n- Agregado test de firma/aislamiento del enlace público del Vendedor Web.\n"
          if "editar campañas IA queda reservado" not in current:
              report.write_text(current.rstrip() + extra, encoding="utf-8")

          for path in (Path(".github/workflows/hardening-vendor-webchat.yml"), Path(".github/workflows/apply-hardening-v2.yml"), Path(".github/workflows/finalize-hardening.yml")):
              if path.exists():
                  path.unlink()
          PY
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
      - name: Commit finalization
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if echo "$HEAD_MESSAGE" | grep -q "chore: harden vendor 24/7 webchat"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_agents.py tests/test_vendor_webchat_security.py docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md .github/workflows
          git add -u .github/workflows
          git commit -m "chore: harden vendor 24/7 webchat"
          git push origin HEAD:hardening/vendor-24-7-webchat
