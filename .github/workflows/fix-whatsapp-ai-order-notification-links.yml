name: Fix AI seller notification links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch tenant context in AI seller pages
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("whatsapp_agent.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from stockarmobile.extensions import db\n"
          new_import = old_import + "from app import get_current_company_id\n"
          if "from app import get_current_company_id\n" not in text:
              if old_import not in text:
                  raise SystemExit("expected db import not found")
              text = text.replace(old_import, new_import, 1)

          needle = 'company_id = getattr(current_user, "company_id", None)'
          occurrences = text.count(needle)
          if occurrences != 2:
              raise SystemExit(f"expected exactly 2 AI seller company_id assignments, got {occurrences}")
          text = text.replace(needle, "company_id = get_current_company_id()")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile changed module
        run: python -m py_compile whatsapp_agent.py

      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp_agent.py
          git diff --cached --quiet && { echo "No code changes"; exit 1; }
          git commit -m "fix: use active tenant context for AI seller notifications"
          git rm .github/workflows/fix-whatsapp-ai-order-notification-links.yml
          git commit -m "chore: remove temporary notification fix workflow"
          git push