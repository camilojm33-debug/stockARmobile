name: Fix historical subscription delete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch SuperAdmin historical subscription deletion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          saas = Path('saas.py')
          text = saas.read_text(encoding='utf-8')

          # 1) Historical rows get a dedicated destructive action; current rows keep normal lifecycle actions.
          pattern = re.compile(r'    subscription_actions = \{.*?\n    return render_template\(', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('No se encontró subscription_actions')
          block = match.group(0)
          if 'delete_historical' not in block:
              replacement = '''    subscription_actions = {}
    for sub in subscriptions:
        is_current = current_subscription_id_by_company.get(sub.company_id) == sub.id
        is_historical = bool(current_subscription_id_by_company.get(sub.company_id)) and not is_current
        if is_historical:
            subscription_actions[sub.id] = {"delete_historical"}
        elif current_subscription_id_by_company.get(sub.company_id) in {None, sub.id}:
            subscription_actions[sub.id] = _allowed_ui_actions_for_status(
                effective_status_by_id.get(sub.id, sub.status)
            )
        else:
            subscription_actions[sub.id] = set()
    return render_template('''
              text = text[:match.start()] + replacement + text[match.end():]

          # 2) Allow only historical subscriptions to use the hard-delete action.
          guard = '''    if not _action_allowed_for_status(status_before, action):
        flash("La acción no está permitida para el estado actual de la suscripción.", "warning")
        return _redirect_back("saas.subscriptions_panel")
'''
          if 'action == "delete_historical"' not in text:
              if guard not in text:
                  raise SystemExit('No se encontró el guard de subscriptions_action')
              text = text.replace(guard, '''    if action == "delete_historical":
        current_subscription = SubscriptionService.active_subscription_for_company(subscription.company_id)
        if current_subscription is not None and current_subscription.id == subscription.id:
            flash("No se puede eliminar la suscripción actual de la empresa.", "warning")
            return _redirect_back("saas.subscriptions_panel")
    elif not _action_allowed_for_status(status_before, action):
        flash("La acción no está permitida para el estado actual de la suscripción.", "warning")
        return _redirect_back("saas.subscriptions_panel")
''', 1)

          # 3) Insert the hard-delete branch immediately before the legacy logical delete branch.
          if 'elif action == "delete_historical":' not in text:
              needle = '        elif action == "delete":\n'
              if needle not in text:
                  raise SystemExit('No se encontró action=delete')
              branch = '''        elif action == "delete_historical":
            from app import AuditLog, Invoice, Payment, PaymentHistory, SubscriptionCommandExecution

            current_subscription = SubscriptionService.active_subscription_for_company(subscription.company_id)
            if current_subscription is not None and current_subscription.id == subscription.id:
                raise SubscriptionCommandError("No se puede eliminar la suscripción actual de la empresa.")

            subscription_id = subscription.id
            company_id = subscription.company_id
            for model in (Payment, Invoice, PaymentHistory, SubscriptionCommandExecution):
                if hasattr(model, "subscription_id"):
                    db.session.query(model).filter(model.subscription_id == subscription_id).update(
                        {model.subscription_id: None}, synchronize_session=False
                    )

            db.session.add(AuditLog(
                user_id=current_user.id,
                company_id=company_id,
                action="subscription_historical_hard_delete",
                entity="subscription",
                entity_id=subscription_id,
                detail=f"Suscripción histórica eliminada por SuperAdmin. ip={request.remote_addr or 'unknown'} resultado=ok",
            ))
            db.session.delete(subscription)
'''
              text = text.replace(needle, branch + needle, 1)

          saas.write_text(text, encoding='utf-8')

          tpl = Path('templates/saas/subscriptions.html')
          html = tpl.read_text(encoding='utf-8')
          if 'data-action="delete_historical"' not in html:
              marker = '''                {% if is_historical_subscription %}
                <span class="small text-muted align-self-center">Sin acciones operativas</span>
                {% endif %}
'''
              replacement = '''                {% if is_historical_subscription %}
                <span class="small text-muted align-self-center">Histórica</span>
                {% if 'delete_historical' in allowed_actions %}
                <form method="post" action="{{ url_for('saas.subscriptions_action', subscription_id=subscription.id) }}" onsubmit="return confirm('¿Eliminar DEFINITIVAMENTE esta suscripción histórica? La empresa y sus datos actuales NO serán eliminados. Los registros financieros conservarán su historial, pero quedarán sin esta suscripción.');">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <input type="hidden" name="next" value="{{ request.full_path }}">
                  <input type="hidden" name="action" value="delete_historical">
                  <button class="btn btn-sm btn-outline-danger" data-action="delete_historical" type="submit">Eliminar histórica</button>
                </form>
                {% endif %}
                {% endif %}
'''
              if marker not in html:
                  raise SystemExit('No se encontró el bloque histórico de la plantilla')
              tpl.write_text(html.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Validate Python
        run: python -m py_compile saas.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saas.py templates/saas/subscriptions.html
          git commit -m "fix: hard delete historical subscriptions safely"
          git push
