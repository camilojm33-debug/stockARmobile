name: Apply idempotency hardening

on:
  push:
    branches:
      - hardening/vendor-24-7-webchat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch idempotency and trusted client identity
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          if "chore: harden idempotent retries" in os.environ.get("HEAD_MESSAGE", ""):
              raise SystemExit(0)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "ai_agents.py",
              '    remote = (request.headers.get("X-Forwarded-For", "").split(",", 1)[0] or request.remote_addr or "unknown").strip()\n',
              '    remote = (request.remote_addr or "unknown").strip()\n',
          )

          duplicate_old = '''        if idempotency_key:\n            duplicate = (\n                db.session.query(ConversationMessage)\n                .filter(\n                    ConversationMessage.company_id == company_id,\n                    ConversationMessage.idempotency_key == idempotency_key,\n                )\n                .first()\n            )\n            if duplicate:\n                return {\n                    "status": "duplicate",\n                    "conversation_id": conversation.id,\n                    "message_id": duplicate.id,\n                    "content": "",\n                }\n'''
          duplicate_new = '''        if idempotency_key:\n            duplicate = (\n                db.session.query(ConversationMessage)\n                .filter(\n                    ConversationMessage.company_id == company_id,\n                    ConversationMessage.idempotency_key == idempotency_key,\n                )\n                .first()\n            )\n            if duplicate:\n                assistant_duplicate = (\n                    db.session.query(ConversationMessage)\n                    .filter(\n                        ConversationMessage.company_id == company_id,\n                        ConversationMessage.conversation_id == conversation.id,\n                        ConversationMessage.trace_id == duplicate.trace_id,\n                        ConversationMessage.role == "assistant",\n                    )\n                    .order_by(ConversationMessage.id.desc())\n                    .first()\n                )\n                return {\n                    "status": "duplicate",\n                    "conversation_id": conversation.id,\n                    "message_id": duplicate.id,\n                    "assistant_message_id": assistant_duplicate.id if assistant_duplicate else None,\n                    "content": assistant_duplicate.content if assistant_duplicate else "",\n                }\n'''
          replace_once("services/ai_agent/orchestrator_v2.py", duplicate_old, duplicate_new)

          test_path = Path("tests/test_vendor_webchat_security.py")
          text = test_path.read_text(encoding="utf-8")
          test = '''\n\ndef test_runtime_idempotent_retry_returns_original_assistant_content(qa_ai_database):\n    from stockarmobile.models.conversations import Agent, Conversation, ConversationMessage\n\n    company = qa_ai_database["companies"]["vendedor"]\n    agent = Agent.query.filter_by(company_id=company.id).first()\n    conversation = Conversation(company_id=company.id, agent_id=agent.id, channel="qa", status="open")\n    db = stock_app.db\n    db.session.add(conversation)\n    db.session.flush()\n    incoming = ConversationMessage(conversation_id=conversation.id, company_id=company.id, sender_type="user", role="user", content="hola", content_type="text", idempotency_key="same-key", trace_id="trace-1")\n    assistant = ConversationMessage(conversation_id=conversation.id, company_id=company.id, sender_type="agent", role="assistant", content="respuesta original", content_type="text", trace_id="trace-1")\n    db.session.add_all([incoming, assistant])\n    db.session.flush()\n    from services.ai_agent.orchestrator_v2 import AgentRuntime\n    class Provider:\n        def generate(self, **payload):\n            raise AssertionError("no debería invocarse el proveedor en un retry idempotente")\n    result = AgentRuntime.process(company_id=company.id, conversation_id=conversation.id, message="hola", channel="qa", idempotency_key="same-key", provider_override=Provider())\n    assert result["status"] == "duplicate"\n    assert result["content"] == "respuesta original"\n'''
          if "test_runtime_idempotent_retry_returns_original_assistant_content" not in text:
              test_path.write_text(text.rstrip() + test, encoding="utf-8")

          report = Path("docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md")
          report_text = report.read_text(encoding="utf-8")
          note = "- Los reintentos idempotentes ahora devuelven la respuesta del agente ya generada en lugar de una respuesta vacía.\n"
          if note not in report_text:
              report.write_text(report_text.rstrip() + "\n" + note, encoding="utf-8")

          Path(".github/workflows/apply-idempotency-hardening.yml").unlink()
          PY
          python -m compileall -q ai_agents.py dashboard.py services/ai_agent tests/test_vendor_webchat_security.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_agents.py services/ai_agent/orchestrator_v2.py tests/test_vendor_webchat_security.py docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md .github/workflows
          git add -u .github/workflows
          git commit -m "chore: harden idempotent retries"
          git push origin HEAD:hardening/vendor-24-7-webchat
