name: Repair Mercado Pago automatic subscriptions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch automatic subscription state and portal
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix preapproval lifecycle: authorized must activate local subscription and sync next payment date.
          p = Path('services/mercadopago_subscription_service.py')
          s = p.read_text(encoding='utf-8')
          old = '''        if status == "authorized":
            subscription.renewal_enabled = True
            subscription.auto_renew = True
            subscription.cancel_at_period_end = False
        elif status in {"paused", "cancelled", "canceled", "expired"}:
'''
          new = '''        if status == "authorized":
            if subscription.status not in {SubscriptionService.STATE_ACTIVE, SubscriptionService.STATE_SCHEDULED}:
                SubscriptionService._transition(subscription, SubscriptionService.STATE_ACTIVE, reason="mercadopago_preapproval_authorized")
            subscription.renewal_enabled = True
            subscription.auto_renew = True
            subscription.cancel_at_period_end = False
            next_payment = preapproval.get("next_payment_date")
            if next_payment:
                parsed = SubscriptionService._parse_mp_datetime(next_payment) if hasattr(SubscriptionService, "_parse_mp_datetime") else None
                if parsed:
                    subscription.next_billing_date = parsed
                    subscription.ends_at = parsed
        elif status in {"paused", "cancelled", "canceled", "expired"}:
'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Add a small local datetime parser to the subscription service if the helper is absent.
          p = Path('services/mercadopago_subscription_service.py')
          s = p.read_text(encoding='utf-8')
          if 'def _parse_mp_datetime' not in s:
              marker = '    @classmethod\n    def sync_preapproval'
              helper = '''    @staticmethod
    def _parse_mp_datetime(value):
        from datetime import datetime, timezone
        if not value:
            return None
        raw = str(value).strip()
        if raw.endswith("Z"):
            raw = raw[:-1] + "+00:00"
        try:
            parsed = datetime.fromisoformat(raw)
        except ValueError:
            return None
        if parsed.tzinfo is None:
            parsed = parsed.replace(tzinfo=timezone.utc)
        return parsed.astimezone(timezone.utc).replace(tzinfo=None)

'''
              if marker not in s: raise SystemExit('sync_preapproval marker missing')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')

          # Portal: expose computed boolean instead of calling Python service methods from Jinja.
          p = Path('company_billing.py')
          s = p.read_text(encoding='utf-8')
          marker = '    selected_plan_id = request.args.get("selected_plan_id", type=int)\n'
          insertion = '''    subscription_metadata = SubscriptionService._metadata_dict(subscription) if subscription else {}
    mp_auto_active = bool(
        subscription_metadata.get("mercadopago_preapproval_id")
        and str(subscription_metadata.get("mercadopago_status") or "").lower() == "authorized"
        and bool(getattr(subscription, "auto_renew", False))
    )
'''
          if 'mp_auto_active = bool(' not in s:
              if marker not in s: raise SystemExit('portal selected_plan marker missing')
              s = s.replace(marker, insertion + marker, 1)
          marker2 = '        selected_plan=selected_plan,\n'
          replacement2 = '        selected_plan=selected_plan,\n        mp_auto_active=mp_auto_active,\n'
          if 'mp_auto_active=mp_auto_active' not in s:
              if marker2 not in s: raise SystemExit('render_template selected_plan marker missing')
              s = s.replace(marker2, replacement2, 1)
          p.write_text(s, encoding='utf-8')

          # Template: replace the undefined SubscriptionService Jinja call with the boolean from the route.
          p = Path('templates/company_billing/portal.html')
          s = p.read_text(encoding='utf-8')
          old = "            {% set mp_meta = subscription and SubscriptionService._metadata_dict(subscription) or {} %}\n            {% if mp_meta.get('mercadopago_preapproval_id') and mp_meta.get('mercadopago_status') == 'authorized' %}"
          new = "            {% if mp_auto_active %}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Python
        run: |
          python -m py_compile company_billing.py services/mercadopago_service.py services/mercadopago_subscription_service.py services/webhook_service.py

      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company_billing.py services/mercadopago_subscription_service.py templates/company_billing/portal.html
          git rm .github/workflows/repair-mp-auto-subscriptions.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'fix: harden Mercado Pago automatic subscription state [auto-repair-mp]'
          git push origin main
