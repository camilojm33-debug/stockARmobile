name: Fix AI admin template
on:
  push:
    branches: [fix/ai-admin-ux]
permissions:
  contents: write
jobs:
  fix-template:
    if: ${{ !contains(github.event.head_commit.message, 'fix: correct AI admin template') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct template reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/ai_agent/admin.html')
          s = p.read_text(encoding='utf-8')
          old = "{{ 'Puede atender' if agent.active else 'No atenderá' }}"
          new = "{{ 'Puede atender' if agents['Vendedor 24 hs'].active else 'No atenderá' }}"
          old2 = "{% if agent.active %}checked{% endif %}"
          new2 = "{% if agents['Vendedor 24 hs'].active %}checked{% endif %}"
          if old not in s and old2 not in s:
              raise SystemExit('expected stale agent reference not found')
          s = s.replace(old, new, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/ai_agent/admin.html
          git commit -m "fix: correct AI admin template"
          git push
