name: Apply AI pricing UI updates
on:
  push:
    branches: [feature/ai-pricing-ui-final]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update pricing capability copy
        shell: python
        run: |
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit(f'Pattern not found: {old[:120]}')
              p.write_text(t.replace(old,new,1), encoding='utf-8')
          f='templates/ai_agents/index.html'
          r(f,"('asistente','bi-lightbulb','Asistente Empresarial','GESTIÓN','Tu negocio, resumido en segundos.','Consulta ventas, productos, stock y clientes para responder preguntas con datos reales de tu comercio.',['Ventas y resultados','Stock crítico','Clientes','Productos más vendidos']),","('asistente','bi-lightbulb','Asistente Empresarial','GESTIÓN','Tu negocio, resumido en segundos.','Consulta ventas, productos, stock, clientes y precios para responder preguntas con datos reales de tu comercio.',['Ventas y resultados','Stock crítico','Clientes','Productos más vendidos']),")
          r(f,"('analista','bi-bar-chart-line','Analista IA','ANÁLISIS','Convertí datos en decisiones.','Detecta problemas, oportunidades, clientes inactivos, baja rotación y cambios en tus ventas.',['Comparación de ventas','Baja rotación','Clientes inactivos','Oportunidades']),","('analista','bi-bar-chart-line','Analista IA','ANÁLISIS','Convertí datos y precios en decisiones.','Detecta problemas, oportunidades, clientes inactivos, baja rotación y oportunidades de optimización de precios.',['Comparación de ventas','Baja rotación','Clientes inactivos','Optimización de precios']),")
          r(f,"<tr><td>Analista IA</td><td>—</td><td>—</td><td>✓</td><td>✓</td></tr>","<tr><td>Analista IA</td><td>—</td><td>—</td><td>✓</td><td>✓</td></tr><tr><td>Optimización de precios con IA</td><td>—</td><td>—</td><td>✓</td><td>✓</td></tr><tr><td>Controlador Global de Precios</td><td>—</td><td>—</td><td>Vista previa + aprobación</td><td>Completo</td></tr><tr><td>Rollback de precios</td><td>—</td><td>—</td><td>—</td><td>✓</td></tr>")
          r(f,"{% elif plan_item.code == 'negocio' %}<li><i class=\"bi bi-check-circle-fill\"></i><span>Todo lo de Vendedor</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Analista IA para tus ventas y stock</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Clientes inactivos y oportunidades</span></li>{% else %}","{% elif plan_item.code == 'negocio' %}<li><i class=\"bi bi-check-circle-fill\"></i><span>Todo lo de Vendedor</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Analista IA para tus ventas y stock</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Clientes inactivos y oportunidades</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Optimización global de precios con IA</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Vista previa y aprobación antes de aplicar</span></li>{% else %}")
          r(f,"<li><i class=\"bi bi-check-circle-fill\"></i><span>Marketing IA</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Reconocimiento de facturas de proveedores</span></li>","<li><i class=\"bi bi-check-circle-fill\"></i><span>Marketing IA</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Controlador Global de Precios</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Vista previa, aprobación y rollback</span></li><li><i class=\"bi bi-check-circle-fill\"></i><span>Reconocimiento de facturas de proveedores</span></li>")
          r(f,"{% for agent_key in current_plan_ns.plan.agents %}<div><i class=\"bi bi-check-circle-fill\"></i><span>{{ agent_labels[agent_key] }}</span></div>{% endfor %}","{% for agent_key in current_plan_ns.plan.agents %}<div><i class=\"bi bi-check-circle-fill\"></i><span>{{ agent_labels[agent_key] }}</span></div>{% endfor %}{% if current_plan_ns.plan and current_plan_ns.plan.code in ['negocio','pro'] %}<div><i class=\"bi bi-check-circle-fill\"></i><span>Optimización de precios con IA</span></div><div><i class=\"bi bi-check-circle-fill\"></i><span>Vista previa y aprobación de cambios</span></div>{% endif %}{% if current_plan_ns.plan and current_plan_ns.plan.code == 'pro' %}<div><i class=\"bi bi-check-circle-fill\"></i><span>Rollback de cambios de precios</span></div>{% endif %}")
          r(f,"<strong>📊 Quiero decidir mejor</strong><span class=\"small text-muted\">Analizar ventas, stock y clientes para detectar oportunidades.</span>","<strong>📊 Quiero decidir mejor</strong><span class=\"small text-muted\">Analizar ventas, stock, clientes y precios para detectar oportunidades y mejorar márgenes.</span>")
          r(f,"<div class=\"small text-muted\">Incluye Vendedor, Asistente, Analista, Marketing y reconocimiento de facturas de proveedores para preparar productos y stock.</div>","<div class=\"small text-muted\">Incluye Vendedor, Asistente, Analista, Marketing, Controlador Global de Precios con vista previa, aprobación y rollback, y reconocimiento de facturas de proveedores.</div>")
          l='templates/landing/index.html'
          r(l,"<p>Transformá tus datos en señales útiles: compará ventas, detectá clientes inactivos y encontrá productos con oportunidades.</p><div class=\"ai-tags\"><span>Ventas</span><span>Clientes</span><span>Productos</span><span>Oportunidades</span></div>","<p>Transformá tus datos en señales útiles: compará ventas, detectá clientes inactivos y encontrá oportunidades de optimización de precios.</p><div class=\"ai-tags\"><span>Ventas</span><span>Clientes</span><span>Productos</span><span>Precios</span></div>")
          Path('.github/workflows/apply-ai-pricing-ui.yml').unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/ai_agents/index.html templates/landing/index.html .github/workflows/apply-ai-pricing-ui.yml
          git commit -m 'feat(ai): expose global pricing across agent and plan screens'
          git push
