name: Apply vendor 24/7 hardening

on:
  push:
    branches:
      - hardening/vendor-24-7-webchat

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: harden vendor 24/7') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply hardening patch
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          patch(
              'ai_agents.py',
              'from flask import Blueprint, abort, current_app, flash, jsonify, redirect, render_template, request, url_for\n',
              'from flask import Blueprint, abort, current_app, flash, jsonify, redirect, render_template, request, session, url_for\n'
          )
          patch(
              'ai_agents.py',
              'import os\nimport secrets\n',
              'import os\nimport secrets\nimport uuid\n\nfrom itsdangerous import BadSignature, SignatureExpired, URLSafeTimedSerializer\n'
          )
          patch(
              'ai_agents.py',
              'bp = Blueprint("ai_agents", __name__, url_prefix="/agentes-ia")\n\n\n@bp.before_request\ndef _require_ai_access():\n    if not can_access_ai(current_user):\n',
              'bp = Blueprint("ai_agents", __name__, url_prefix="/agentes-ia")\n\nPUBLIC_VENDOR_CHAT_SALT = "stockarmobile-public-vendor-v1"\nPUBLIC_VENDOR_CHAT_MAX_AGE = 60 * 60 * 24 * 365\nPUBLIC_VENDOR_CHAT_LIMIT = 12\nPUBLIC_VENDOR_CHAT_WINDOW = 60\n\n\ndef _public_vendor_serializer():\n    return URLSafeTimedSerializer(current_app.config.get("SECRET_KEY", "stockarmobile-dev-secret"))\n\n\ndef _public_vendor_token(company_id: int) -> str:\n    return _public_vendor_serializer().dumps({"company_id": int(company_id), "agent": "vendedor"}, salt=PUBLIC_VENDOR_CHAT_SALT)\n\n\ndef _decode_public_vendor_token(token: str):\n    try:\n        payload = _public_vendor_serializer().loads(token, salt=PUBLIC_VENDOR_CHAT_SALT, max_age=PUBLIC_VENDOR_CHAT_MAX_AGE)\n    except (BadSignature, SignatureExpired, TypeError, ValueError):\n        return None\n    if not isinstance(payload, dict) or payload.get("agent") != "vendedor":\n        return None\n    try:\n        return int(payload.get("company_id"))\n    except (TypeError, ValueError):\n        return None\n\n\ndef _public_vendor_rate_limit(company_id: int) -> bool:\n    forwarded = request.headers.get("X-Forwarded-For", "")\n    remote = (forwarded.split(",", 1)[0] if forwarded else (request.remote_addr or "unknown")).strip()\n    redis_url = (os.getenv("REDIS_URL") or "").strip()\n    if redis_url:\n        try:\n            import redis\n            client = redis.Redis.from_url(redis_url, socket_connect_timeout=1, socket_timeout=1, decode_responses=True)\n            key = f"stockarmobile:public-vendor:{int(company_id)}:{remote}"\n            count = int(client.incr(key))\n            if count == 1:\n                client.expire(key, PUBLIC_VENDOR_CHAT_WINDOW)\n            return count <= PUBLIC_VENDOR_CHAT_LIMIT\n        except Exception:\n            current_app.logger.warning("Redis rate limit unavailable; using signed-session fallback.")\n    now = int(__import__("time").time())\n    state = session.get("public_vendor_rate") or {}\n    if not isinstance(state, dict) or now - int(state.get("started_at", 0) or 0) >= PUBLIC_VENDOR_CHAT_WINDOW:\n        session["public_vendor_rate"] = {"started_at": now, "count": 1}\n        return True\n    count = int(state.get("count", 0) or 0)\n    if count >= PUBLIC_VENDOR_CHAT_LIMIT:\n        return False\n    state["count"] = count + 1\n    session["public_vendor_rate"] = state\n    session.modified = True\n    return True\n\n\n@bp.before_request\ndef _require_ai_access():\n    if request.endpoint in {"ai_agents.public_vendor_chat", "ai_agents.public_vendor_chat_message"}:\n        return None\n    if not can_access_ai(current_user):\n'
          )
          patch(
              'ai_agents.py',
              '    return {"company": company, "agents": agents, "preferences": preferences, "metrics": {"conversations": conversations, "clients_attended": clients_attended, "quotes": quotes, "sales": int(sales_month.count())}, "analyst": {"sales_change": sales_change, "critical_stock": critical_stock, "low_rotation": low_rotation, "opportunities": None}, "ai_status": ai_status, "ai_plans": AI_PLANS, "agent_labels": AGENT_LABELS, "ai_plan": ai_plan, "ai_usage": ai_usage, "agent_access": agent_access, "invoice_access": invoice_access, "any_chat_agent": any_chat_agent, "default_chat_agent": default_chat_agent, "plan_url": url_for("ai_agents.agent", agent="planes"), "ai_checkout_url": url_for("company_billing.create_ai_subscription_checkout"), "config_url": url_for("ai_admin.index") if current_user.role == "admin" else None, "chat_url": url_for("dashboard.ai_agent_chat")}\n',
              '    public_webchat_enabled = bool(preferences.get("ai_agent", {}).get("public_webchat_enabled", False))\n    public_vendor_url = None\n    if agent_access.get("vendedor", AIAccess(False)).allowed:\n        public_vendor_url = url_for("ai_agents.public_vendor_chat", token=_public_vendor_token(company_id))\n    return {"company": company, "agents": agents, "preferences": preferences, "metrics": {"conversations": conversations, "clients_attended": clients_attended, "quotes": quotes, "sales": int(sales_month.count())}, "analyst": {"sales_change": sales_change, "critical_stock": critical_stock, "low_rotation": low_rotation, "opportunities": None}, "ai_status": ai_status, "ai_plans": AI_PLANS, "agent_labels": AGENT_LABELS, "ai_plan": ai_plan, "ai_usage": ai_usage, "agent_access": agent_access, "invoice_access": invoice_access, "any_chat_agent": any_chat_agent, "default_chat_agent": default_chat_agent, "public_webchat_enabled": public_webchat_enabled, "public_vendor_url": public_vendor_url, "plan_url": url_for("ai_agents.agent", agent="planes"), "ai_checkout_url": url_for("company_billing.create_ai_subscription_checkout"), "config_url": url_for("ai_admin.index") if current_user.role == "admin" else None, "chat_url": url_for("dashboard.ai_agent_chat")}\n'
          )
          patch(
              'ai_agents.py',
              '@bp.get("/")\n@tenant_required\ndef index():\n    return render_template("ai_agents/index.html", view="dashboard", **_context())\n\n\n@bp.get("/campanas")',
              '@bp.get("/public/vendedor/<token>")\ndef public_vendor_chat(token):\n    company_id = _decode_public_vendor_token(token)\n    if company_id is None:\n        abort(404)\n    from app import Company\n    company = Company.query.filter_by(id=company_id, active=True).first()\n    if company is None:\n        abort(404)\n    preferences = get_ai_preferences(company)\n    if not bool(preferences.get("ai_agent", {}).get("public_webchat_enabled", False)):\n        abort(404)\n    access = can_use_ai(company, "vendedor")\n    if not access.allowed:\n        return render_template("ai_agents/public_vendor_chat.html", company=company, disabled_reason=access.reason, chat_url=None, csrf_public_token=None)\n    visitor_session_key = f"public_vendor_visitor_{company_id}"\n    visitor_id = str(session.get(visitor_session_key) or uuid.uuid4().hex)\n    session[visitor_session_key] = visitor_id\n    return render_template(\n        "ai_agents/public_vendor_chat.html",\n        company=company,\n        disabled_reason=None,\n        chat_url=url_for("ai_agents.public_vendor_chat_message", token=token),\n        csrf_public_token=None,\n    )\n\n\n@bp.post("/public/vendedor/<token>/message")\ndef public_vendor_chat_message(token):\n    company_id = _decode_public_vendor_token(token)\n    if company_id is None:\n        return jsonify({"success": False, "error": "Enlace de vendedor inválido o vencido."}), 404\n    from app import Company\n    company = Company.query.filter_by(id=company_id, active=True).first()\n    if company is None:\n        return jsonify({"success": False, "error": "El comercio no está disponible."}), 404\n    preferences = get_ai_preferences(company)\n    if not bool(preferences.get("ai_agent", {}).get("public_webchat_enabled", False)):\n        return jsonify({"success": False, "error": "El vendedor web no está habilitado."}), 404\n    access = can_use_ai(company, "vendedor")\n    if not access.allowed:\n        return jsonify({"success": False, "error": access.reason}), 403\n    if not _public_vendor_rate_limit(company_id):\n        return jsonify({"success": False, "error": "Hay muchas consultas en este momento. Esperá unos segundos e intentá nuevamente."}), 429, {"Retry-After": str(PUBLIC_VENDOR_CHAT_WINDOW)}\n    payload = request.get_json(silent=True) or {}\n    message = str(payload.get("message") or "").strip()\n    if not message:\n        return jsonify({"success": False, "error": "Escribí una consulta."}), 400\n    if len(message) > 500:\n        return jsonify({"success": False, "error": "La consulta es demasiado larga."}), 400\n    visitor_session_key = f"public_vendor_visitor_{company_id}"\n    visitor_id = str(session.get(visitor_session_key) or uuid.uuid4().hex)\n    session[visitor_session_key] = visitor_id\n    from services.ai_agent.config_service import ensure_default_agents, VENDOR_AGENT_NAME\n    from services.ai_agent.orchestrator_v2 import AgentRuntime\n    vendor_agent = ensure_default_agents(company_id)[VENDOR_AGENT_NAME]\n    conversation_id = payload.get("conversation_id")\n    conversation = None\n    if conversation_id not in (None, ""):\n        try:\n            conversation = Conversation.query.filter_by(id=int(conversation_id), company_id=company_id, channel="webchat", external_conversation_id=visitor_id).first()\n        except (TypeError, ValueError):\n            conversation = None\n        if conversation is None:\n            return jsonify({"success": False, "error": "La conversación ya no es válida."}), 403\n        if conversation.agent_id != vendor_agent.id:\n            return jsonify({"success": False, "error": "La conversación no corresponde al vendedor."}), 409\n    else:\n        conversation = Conversation.query.filter_by(company_id=company_id, channel="webchat", external_conversation_id=visitor_id, agent_id=vendor_agent.id).filter(Conversation.status == "open").order_by(Conversation.id.desc()).first()\n        if conversation is None:\n            conversation = Conversation(company_id=company_id, agent_id=vendor_agent.id, channel="webchat", external_conversation_id=visitor_id, status="open", metadata_json={"source": "public_webchat"})\n            db.session.add(conversation)\n            db.session.flush()\n    try:\n        result = AgentRuntime.process(\n            company_id=company_id,\n            conversation_id=conversation.id,\n            message=message,\n            channel="webchat",\n            sender_id=None,\n            idempotency_key=str(payload.get("idempotency_key") or uuid.uuid4().hex),\n            metadata={"from": visitor_id, "source": "public_webchat"},\n            include_system_prompt=True,\n        )\n        return jsonify({"success": True, "conversation_id": result.get("conversation_id"), "message_id": result.get("message_id"), "assistant_message_id": result.get("assistant_message_id"), "content": result.get("content")})\n    except ValueError as exc:\n        db.session.rollback()\n        return jsonify({"success": False, "error": str(exc)}), 400\n    except Exception:\n        db.session.rollback()\n        current_app.logger.exception("Error en vendedor web público: company_id=%s conversation_id=%s", company_id, conversation.id)\n        return jsonify({"success": False, "error": "No se pudo procesar la consulta. Intentá nuevamente."}), 500\n\n\n@bp.get("/")\n@tenant_required\ndef index():\n    return render_template("ai_agents/index.html", view="dashboard", **_context())\n\n\n@bp.get("/campanas")'
          )
          patch(
              'ai_agents.py',
              '@bp.post("/campanas/<int:campaign_id>/edit")\n@tenant_required\ndef campaign_edit(campaign_id):',
              '@bp.post("/vendedor/webchat/toggle")\n@company_admin_required\ndef vendor_webchat_toggle():\n    company = current_user.company\n    access = can_use_ai(company, "vendedor")\n    if not access.allowed:\n        flash(access.reason or "Tu plan no incluye el Vendedor IA.", "warning")\n        return redirect(url_for("ai_agents.agent", agent="planes"))\n    enabled = str((request.get_json(silent=True) or request.form).get("enabled") or "").strip().lower() in {"1", "true", "yes", "on", "si", "sí"}\n    update_ai_preferences(company, ai_updates={"public_webchat_enabled": enabled})\n    db.session.commit()\n    flash("Webchat público del Vendedor IA " + ("activado." if enabled else "desactivado."), "success")\n    return redirect(url_for("ai_agents.agent", agent="vendedor"))\n\n\n@bp.post("/campanas/<int:campaign_id>/edit")\n@tenant_required\ndef campaign_edit(campaign_id):'
          )
          patch(
              'ai_agents.py',
              '    if agent == "vendedor":\n        whatsapp = get_whatsapp_connection(current_user.company)\n        if not (whatsapp.get("enabled") and whatsapp.get("phone_number_id")):\n            return redirect(url_for("ai_agents.vendor_whatsapp_connect"))\n    return render_template("ai_agents/index.html", view=agent, **_context())\n',
              '    return render_template("ai_agents/index.html", view=agent, **_context())\n'
          )

          patch(
              'templates/ai_agents/index.html',
              "  {% elif view == 'asistente' %}",
              dedent('''\n\n  {% elif view == 'asistente' %}''')
          )
          # Replace the vendor detail block with a channel-independent presentation.
          p = Path('templates/ai_agents/index.html')
          html = p.read_text(encoding='utf-8')
          start = html.index("  {% elif view == 'vendedor' %}")
          end = html.index("\n\n  {% elif view == 'asistente' %}", start)
          vendor_block = dedent('''\
            {% elif view == 'vendedor' %}
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3"><div><h2 class="h3 fw-bold mb-1"><i class="bi bi-cart3 me-2"></i>Vendedor IA 24/7</h2><p class="text-muted mb-0">El mismo vendedor puede atender desde distintos canales conectados.</p></div><span class="badge text-bg-success fs-6"><i class="bi bi-circle-fill me-1"></i>Disponible</span></div>
            <div class="row g-3 mb-4">{% for label, value in [('Conversaciones este mes', metrics.conversations), ('Clientes atendidos', metrics.clients_attended), ('Presupuestos', metrics.quotes), ('Ventas derivadas', metrics.sales)] %}<div class="col-6 col-lg-3"><div class="ai-metric h-100"><div class="small text-muted">{{ label }}</div><div class="ai-metric-value">{{ value }}</div></div></div>{% endfor %}</div>
            <div class="row g-4 mb-4"><div class="col-lg-7"><div class="card app-card h-100"><div class="card-body"><h2 class="h5 fw-bold">Canal web</h2><p class="text-muted">Activá un chat público para que tus clientes hablen con el Vendedor sin entrar a StockAr y sin depender de WhatsApp.</p>{% if public_webchat_enabled %}<div class="alert alert-success"><strong>Webchat activo.</strong><div class="small mt-1">Compartí el enlace con tus clientes.</div></div>{% if public_vendor_url %}<div class="input-group mb-2"><input class="form-control" value="{{ public_vendor_url }}" readonly aria-label="Enlace público del vendedor"><button class="btn btn-outline-primary" type="button" onclick="navigator.clipboard && navigator.clipboard.writeText('{{ public_vendor_url|e }}')">Copiar</button></div><a class="btn btn-primary" target="_blank" rel="noopener" href="{{ public_vendor_url }}">Abrir chat público</a>{% endif %}<form method="post" action="{{ url_for('ai_agents.vendor_webchat_toggle') }}" class="d-inline"><input type="hidden" name="enabled" value="0"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-outline-secondary ms-2" type="submit">Desactivar</button></form>{% else %}<div class="alert alert-light border"><strong>Webchat desactivado.</strong><div class="small mt-1">No consume conversaciones públicas hasta que lo actives.</div></div><form method="post" action="{{ url_for('ai_agents.vendor_webchat_toggle') }}"><input type="hidden" name="enabled" value="1"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-primary" type="submit"><i class="bi bi-globe2 me-1"></i>Activar Vendedor web 24/7</button></form>{% endif %}</div></div></div><div class="col-lg-5"><div class="card app-card h-100"><div class="card-body"><h2 class="h5 fw-bold">WhatsApp</h2><p class="text-muted">WhatsApp es un canal opcional. Podés activarlo cuando la conexión con Meta esté lista.</p>{% if preferences.whatsapp.enabled and preferences.whatsapp.phone_number_id %}<div class="alert alert-success"><strong>WhatsApp conectado.</strong><div class="small mt-1">{{ preferences.whatsapp.display_phone_number }}</div></div>{% else %}<div class="alert alert-light border"><strong>WhatsApp no conectado.</strong><div class="small mt-1">No bloquea el Vendedor web.</div></div>{% endif %}<a class="btn btn-outline-primary" href="{{ url_for('ai_agents.vendor_whatsapp_connect') }}"><i class="bi bi-whatsapp me-1"></i>{% if preferences.whatsapp.enabled %}Administrar WhatsApp{% else %}Conectar WhatsApp{% endif %}</a></div></div></div></div>
            <div class="row g-4"><div class="col-lg-7"><div class="card app-card h-100"><div class="card-body"><h2 class="h5 fw-bold">Capacidades</h2><div class="row g-2">{% for item, functional in [('Consultar productos', true), ('Consultar precios', true), ('Consultar stock', true), ('Recomendar productos', true), ('Ofrecer alternativas', true), ('Preparar presupuestos', true), ('Armar pedidos: presupuesto pendiente de pago', true), ('Hacer seguimiento', false), ('Detectar intención de compra', false), ('Derivar conversación a una persona', false)] %}<div class="col-sm-6"><div class="text-muted"><i class="bi {{ 'bi-check-circle-fill text-success' if functional else 'bi-dash-circle text-secondary' }} me-2"></i>{{ item }}{% if not functional %} <span class="small">(Pendiente de integración)</span>{% endif %}</div></div>{% endfor %}</div></div></div></div><div class="col-lg-5"><div class="card app-card h-100"><div class="card-body"><h2 class="h5 fw-bold">Uso de IA</h2><p class="text-muted">{{ ai_usage.used_usage }} / {{ ai_usage.included_usage or 'Pendiente de asignación' }} interacciones.</p><div class="progress" role="progressbar" aria-label="Uso de IA" aria-valuenow="{{ ai_usage.percent }}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width: {{ ai_usage.percent }}%"></div></div><div class="small text-muted mt-2">{{ ai_usage.percent }}% utilizado · {{ ai_usage.remaining_usage }} restantes</div>{% if config_url %}<a class="btn btn-outline-primary mt-3" href="{{ config_url }}"><i class="bi bi-gear me-1"></i>Configurar agente</a>{% endif %}</div></div></div></div>
          ''')
          html = html[:start] + vendor_block.rstrip() + html[end:]
          p.write_text(html, encoding='utf-8')

          patch(
              'dashboard.py',
              '    agent_key = str(payload.get("agent") or "asistente").strip().lower()\n',
              '    agent_key = str(payload.get("agent") or "asistente").strip().lower()\n    idempotency_key = str(request.headers.get("Idempotency-Key") or payload.get("idempotency_key") or uuid.uuid4()).strip()\n'
          )
          patch(
              'dashboard.py',
              '            idempotency_key=str(uuid.uuid4()),\n',
              '            idempotency_key=idempotency_key,\n'
          )

          patch(
              'services/ai_agent/orchestrator_v2.py',
              'VENDOR_SYSTEM_PROMPT = "Sos el Vendedor 24 hs de StockARmobile. Consultá herramientas antes de afirmar precio o stock. No inventes información."\n',
              'VENDOR_SYSTEM_PROMPT = "Sos el Vendedor 24 hs de StockARmobile. Podés atender desde los canales conectados por el comercio. Consultá herramientas antes de afirmar precio o stock. No inventes información. Si el canal actual no es WhatsApp, no afirmes que enviaste o recibiste mensajes por WhatsApp. Al preparar un pedido, dejalo explícitamente pendiente de pago hasta una confirmación backend exitosa."\n'
          )

          report = Path('docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md')
          report.write_text(dedent('''\
          # Informe de auditoría y endurecimiento — 2026-09-17

          ## Hallazgos corregidos

          - El Vendedor IA estaba bloqueado por una redirección obligatoria a la conexión de WhatsApp. Ahora el Vendedor puede funcionar con un canal web público y WhatsApp queda como canal adicional.
          - Se agregó webchat público opt-in por empresa, con URL firmada, aislamiento por `company_id`, sesión de visitante, control de longitud y rate-limit con Redis cuando `REDIS_URL` está disponible y fallback por sesión.
          - Se mantiene la separación del `AgentRuntime`: el webchat reutiliza el mismo Vendedor y las mismas herramientas, sin duplicar motor IA.
          - El chat autenticado ahora acepta `Idempotency-Key` del cliente para reintentos; si no se envía, conserva el comportamiento seguro generando una clave única.
          - El prompt del Vendedor fue endurecido para no afirmar capacidades de WhatsApp cuando el canal activo es otro y para distinguir pedido pendiente de pago de venta confirmada.
          - La vista del Vendedor deja de presentar WhatsApp como requisito para operar y muestra claramente el estado de Webchat y WhatsApp por separado.

          ## Puntos revisados del producto

          - Aislamiento multiempresa en conversaciones y herramientas: se mantiene el `company_id` como límite principal en runtime y `VendorOrderService`.
          - Presupuesto/pedido/venta: el Vendedor continúa usando `VendorOrderService` y no se cambió la transición comercial existente; el lenguaje del agente fue endurecido para no presentar un pendiente como venta confirmada.
          - Planes IA: las capacidades siguen centralizadas en `AI_PLANS`/`can_use_ai`.
          - Marketing: las campañas siguen quedando en borrador/aprobación y no se habilita envío automático.
          - Referidos y Mercado Pago: permanecen con su implementación actual; se identificaron como siguiente pasada específica para auditoría financiera con pruebas de idempotencia sobre webhooks.

          ## Verificación

          - Esta pasada no ejecuta `pytest` ni pruebas manuales sobre producción. El repositorio tiene CI que ejecuta `compileall`, chequeo del service worker y `pytest` en Pull Requests contra `main`.
          ''').strip() + '\n', encoding='utf-8')
          PY
      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_agents.py dashboard.py services/ai_agent/orchestrator_v2.py templates/ai_agents/index.html docs/INFORME_AUDITORIA_ENDURECIMIENTO_20260917.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: harden vendor 24/7 webchat"
          git push origin HEAD:hardening/vendor-24-7-webchat
