name: Fix subscription plan selector

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'fix: use canonical entrepreneur plan code' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch subscription quick-renew plan selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('saas.py')
          text = path.read_text(encoding='utf-8')
          changed = False

          old = 'Plan.query.filter(Plan.active.is_(True), Plan.code == "emprendedor")'
          new = 'Plan.query.filter(Plan.active.is_(True), Plan.code == "entrepreneur")'
          if old in text:
              text = text.replace(old, new)
              changed = True

          # Do not silently fall back to Trial when the intended Emprendedor plan
          # is missing. Quick renewal must either select the canonical plan or stop.
          old_block = '''        plan = (\n            Plan.query.filter(Plan.active.is_(True), Plan.code == "entrepreneur")\n            .order_by(Plan.price.asc(), Plan.id.asc())\n            .first()\n        )\n        if plan is None:\n            plan = Plan.query.filter(Plan.active.is_(True)).order_by(Plan.price.asc(), Plan.id.asc()).first()\n        if plan is None:\n            flash("No hay planes activos para crear una suscripción.", "danger")\n            return redirect(url_for("saas.subscriptions_panel", company_id=company.id))\n'''
          new_block = '''        plan = (\n            Plan.query.filter(Plan.active.is_(True), Plan.code == "entrepreneur")\n            .order_by(Plan.id.asc())\n            .first()\n        )\n        if plan is None:\n            flash("El plan Emprendedor no está configurado. No se creó una suscripción para evitar asignar otro plan por error.", "danger")\n            return redirect(url_for("saas.subscriptions_panel", company_id=company.id))\n'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
              changed = True

          if not changed:
              raise SystemExit('No matching subscription quick-renew block found; refusing to make an unrelated change.')

          path.write_text(text, encoding='utf-8')
          print('Subscription quick-renew patch applied')
          PY

      - name: Validate Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          echo 'compileall OK'

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add saas.py
          git rm -f .github/workflows/fix-subscription-plan-code.yml
          git commit -m 'fix: use canonical entrepreneur plan code'
          git push origin HEAD:main
