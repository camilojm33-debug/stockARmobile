name: Fix Mercado Pago subscription loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch subscription form and global loader
        run: |
          python - <<'PY'
          from pathlib import Path

          portal = Path('templates/company_billing/portal.html')
          text = portal.read_text(encoding='utf-8')
          old = '''<form method="post" action="{{ url_for('company_billing.create_mercadopago_subscription') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input type="hidden" name="plan_id" value="{{ usage_snapshot.plan.id if usage_snapshot.plan else '' }}">
              <button class="btn btn-success" type="submit">Activar suscripción automática</button>
            </form>'''
          new = '''<form method="post" action="{{ url_for('company_billing.create_mercadopago_subscription') }}" data-mp-auto-subscription="true">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input type="hidden" name="plan_id" value="{{ usage_snapshot.plan.id if usage_snapshot.plan else '' }}">
              <button class="btn btn-success" type="submit" data-mp-auto-subscription-button="true">Activar suscripción automática</button>
            </form>'''
          if 'data-mp-auto-subscription="true"' not in text:
              if old not in text:
                  raise SystemExit('No se encontró el formulario de suscripción automática')
              text = text.replace(old, new, 1)
              portal.write_text(text, encoding='utf-8')

          base = Path('templates/base_master.html')
          text = base.read_text(encoding='utf-8')
          old = '''      document.querySelectorAll('form[method="post"]').forEach(function(form) {
        form.addEventListener('submit', function() {
          const loading = document.getElementById('appLoading');
          if (loading) loading.classList.add('show');
        });
      });'''
          new = '''      document.querySelectorAll('form[method="post"]').forEach(function(form) {
        form.addEventListener('submit', function() {
          // Mercado Pago subscription creation performs an external API call and
          // then redirects to Mercado Pago. Do not cover the page with the global
          // loader here: if the external API is slow/rejected, the user must still
          // be able to see the page/error instead of getting an apparently frozen UI.
          if (form.matches('[data-mp-auto-subscription="true"]')) {
            const button = form.querySelector('[data-mp-auto-subscription-button="true"]');
            if (button) {
              button.disabled = true;
              button.textContent = 'Conectando con Mercado Pago…';
            }
            return;
          }
          const loading = document.getElementById('appLoading');
          if (loading) loading.classList.add('show');
        });
      });'''
          if old in text:
              text = text.replace(old, new, 1)
              base.write_text(text, encoding='utf-8')
          elif 'data-mp-auto-subscription="true"' not in text:
              raise SystemExit('No se encontró el manejador global de formularios')
          PY

      - name: Validate and self-remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          portal = Path('templates/company_billing/portal.html').read_text(encoding='utf-8')
          base = Path('templates/base_master.html').read_text(encoding='utf-8')
          assert 'data-mp-auto-subscription="true"' in portal
          assert 'data-mp-auto-subscription-button="true"' in portal
          assert 'form.matches(\'[data-mp-auto-subscription="true"]\')' in base
          PY
          git rm .github/workflows/fix-mp-subscription-loader.yml
          git add templates/base_master.html templates/company_billing/portal.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: avoid global loader on Mercado Pago subscription redirect'
          git push
