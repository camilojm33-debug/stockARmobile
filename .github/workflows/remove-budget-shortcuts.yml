name: Remove budget shortcut legend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-shortcuts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove visible shortcut legend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('templates/presupuestos/form.html')
          text = path.read_text(encoding='utf-8')
          block = '''    <div class="small text-muted">
      Atajos: <strong>F2</strong> buscar, <strong>F3</strong> cliente, <strong>F4</strong> guardar, <strong>F5</strong> PDF, <strong>F6</strong> convertir, <strong>ESC</strong> limpiar, <strong>ENTER</strong> agregar.
    </div>
'''
          if block not in text:
              raise SystemExit('No se encontró el bloque visible de atajos rápidos')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'Atajos: <strong>F2</strong>' templates/presupuestos/form.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/presupuestos/form.html
          git rm -f .github/workflows/remove-budget-shortcuts.yml
          git commit -m 'fix: remove budget shortcut legend'
          git push origin main
